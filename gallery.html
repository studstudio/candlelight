<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>candlelight — gallery</title>
<style>
  :root {
    --bg: #15100a;
    --panel: #1d1610;
    --line: rgba(240, 224, 190, 0.12);
    --ember: #e8823c;
    --ember-dim: rgba(232, 130, 60, 0.55);
    --cream: #f2e9d8;
    --cream-dim: rgba(242, 233, 216, 0.55);
    --land: #2a2117;
    --land-line: rgba(242, 233, 216, 0.16);
    --water: #17304a;
    --river: #3d6f96;
    --graticule: rgba(242, 233, 216, 0.05);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; background: var(--bg); color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 6px; flex: 0 0 auto;
  }
  h1 { font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; margin: 0; color: var(--ember); font-weight: 700; }
  #status { font-size: 11px; color: var(--cream-dim); }
  #status.live::before { content: '● '; color: var(--ember); }
  main { position: relative; flex: 1 1 auto; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #tooltip {
    position: absolute; pointer-events: none; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font-size: 12px; line-height: 1.5; color: var(--cream); display: none;
    max-width: 220px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); z-index: 5;
  }
  #tooltip b { color: var(--ember); }
  #legend {
    position: absolute; left: 14px; bottom: 14px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    font-size: 11px; color: var(--cream-dim); display: flex; flex-direction: column; gap: 5px;
  }
  #legend .row { display: flex; align-items: center; gap: 7px; }
  #legend .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  #count {
    position: absolute; right: 14px; bottom: 14px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
    font-size: 11px; color: var(--cream-dim); text-align: right;
  }
  #count b { color: var(--cream); font-size: 16px; display: block; }
  #empty {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 6px; color: var(--cream-dim); font-size: 13px; text-align: center; padding: 20px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>candlelight — gallery</h1>
    <span id="status">connecting…</span>
  </header>
  <main>
    <canvas id="map"></canvas>
    <div id="tooltip"></div>
    <div id="legend">
      <div class="row"><span class="dot" style="background:var(--ember)"></span> sent</div>
      <div class="row"><span class="dot" style="background:var(--cream)"></span> received</div>
      <div class="row"><span class="dot" style="background:var(--ember-dim);opacity:0.6"></span> in flight</div>
    </div>
    <div id="count"><b id="countNum">0</b>lights shared</div>
    <div id="empty">
      <div>no lights shared yet</div>
      <div style="font-size:11px;opacity:0.7">send one from the app, or seed test data via the Worker</div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
// ---- config ----
const WORKER_BASE_URL = "https://candlelight.daniloinfinite.workers.dev"; // keep in sync with index.html
const POLL_MS = 8000;
const LAND_URL = "https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json";
const COUNTRIES_URL = "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json";
const LAKES_URL = "https://ne.freemap.online/110m/physical/ne_110m_lakes.json";
const RIVERS_URL = "https://ne.freemap.online/110m/physical/ne_110m_rivers_lake_centerlines.json";

// ---- canvas + projection setup ----
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const countEl = document.getElementById('countNum');
const emptyEl = document.getElementById('empty');
const tooltipEl = document.getElementById('tooltip');

// Azimuthal equidistant, polar aspect (North Pole at center) — the classic
// "UN flag" world projection: true distance-from-center in every direction,
// which fits a "who's sending light to whom, right now" map nicely since
// travel distance reads honestly outward from the pole.
const projection = d3.geoAzimuthalEquidistant().precision(0.3);
const path = d3.geoPath(projection, ctx);

let land = null, countryBorders = null, lakes = null, rivers = null;
let events = [];
let dpr = window.devicePixelRatio || 1;

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const size = Math.min(rect.width, rect.height);
  projection.scale(size * 0.47).translate([rect.width / 2, rect.height / 2]);
  draw();
}

// ---- data loading (each layer fails independently — a missing river
// dataset shouldn't take down the whole map) ----
async function loadGeo(url, isTopo, objectName) {
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    return isTopo ? topojson.feature(data, data.objects[objectName]) : data;
  } catch (err) {
    console.warn('gallery: failed to load', url, err);
    return null;
  }
}
async function loadBorders(url) {
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    return topojson.mesh(data, data.objects.countries, (a, b) => a !== b);
  } catch { return null; }
}

// ---- drawing ----
const graticule = d3.geoGraticule10();
const sphere = { type: 'Sphere' };

function project(geo) { return geo && geo.lat != null && geo.lon != null ? [geo.lon, geo.lat] : null; }

function draw() {
  const rect = canvas.parentElement.getBoundingClientRect();
  ctx.clearRect(0, 0, rect.width, rect.height);

  ctx.beginPath(); path(sphere);
  ctx.fillStyle = '#0d1420'; ctx.fill();

  ctx.beginPath(); path(graticule);
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--graticule');
  ctx.lineWidth = 1; ctx.stroke();

  if (land) {
    ctx.beginPath(); path(land);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--land');
    ctx.fill();
  }
  if (rivers) {
    ctx.beginPath(); path(rivers);
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--river');
    ctx.lineWidth = 0.6; ctx.stroke();
  }
  if (lakes) {
    ctx.beginPath(); path(lakes);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--water');
    ctx.fill();
  }
  if (countryBorders) {
    ctx.beginPath(); path(countryBorders);
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--land-line');
    ctx.lineWidth = 0.5; ctx.stroke();
  }
  ctx.beginPath(); path(sphere);
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--line');
  ctx.lineWidth = 1; ctx.stroke();

  drawEvents();
}

function drawEvents() {
  const now = Date.now();
  for (const ev of events) {
    const from = project(ev.sentGeo);
    const to = project(ev.downloadGeo);

    if (from && to) {
      ctx.beginPath();
      path({ type: 'LineString', coordinates: [from, to] });
      ctx.strokeStyle = 'rgba(232,130,60,0.4)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    if (from) {
      const inFlight = !ev.downloadedAt;
      const pulse = inFlight ? (0.5 + 0.5 * Math.sin(now / 400)) : 1;
      ctx.beginPath();
      path.pointRadius(inFlight ? 3.5 : 2.5)({ type: 'Point', coordinates: from });
      ctx.fillStyle = inFlight ? `rgba(232,130,60,${0.35 + 0.35 * pulse})` : '#e8823c';
      ctx.fill();
    }
    if (to) {
      ctx.beginPath();
      path.pointRadius(2.5)({ type: 'Point', coordinates: to });
      ctx.fillStyle = '#f2e9d8';
      ctx.fill();
    }
  }
}

// ---- hover tooltips ----
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  let best = null, bestDist = 14;
  for (const ev of events) {
    for (const [geo, kind] of [[ev.sentGeo, 'sent'], [ev.downloadGeo, 'received']]) {
      const p = project(geo);
      if (!p) continue;
      const proj = projection(p);
      if (!proj) continue;
      const d = Math.hypot(proj[0] - mx, proj[1] - my);
      if (d < bestDist) { bestDist = d; best = { ev, kind, geo }; }
    }
  }
  if (best) {
    const { ev, kind, geo } = best;
    const place = [geo.city, geo.region, geo.country].filter(Boolean).join(', ') || 'unknown location';
    let html = `<b>${kind === 'sent' ? 'sent from' : 'received in'}</b> ${place}`;
    if (ev.deliveryMs != null) {
      const secs = Math.round(ev.deliveryMs / 1000);
      html += `<br>delivered in ${secs < 60 ? secs + 's' : Math.round(secs/60) + 'm'}`;
    } else {
      html += `<br><span style="color:var(--ember)">in flight…</span>`;
    }
    tooltipEl.innerHTML = html;
    tooltipEl.style.display = 'block';
    tooltipEl.style.left = Math.min(mx + 14, rect.width - 230) + 'px';
    tooltipEl.style.top = Math.max(my - 10, 4) + 'px';
    canvas.style.cursor = 'pointer';
  } else {
    tooltipEl.style.display = 'none';
    canvas.style.cursor = 'default';
  }
});
canvas.addEventListener('mouseleave', () => { tooltipEl.style.display = 'none'; });

// ---- polling ----
async function poll() {
  try {
    const res = await fetch(`${WORKER_BASE_URL}/gallery/events?limit=200`);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    events = data.events || [];
    countEl.textContent = events.length;
    emptyEl.style.display = events.length === 0 ? 'flex' : 'none';
    statusEl.textContent = 'live';
    statusEl.classList.add('live');
  } catch (err) {
    statusEl.textContent = 'connection lost — retrying…';
    statusEl.classList.remove('live');
  }
}

// ---- animation loop (only needed for the in-flight pulse) ----
function tick() { draw(); requestAnimationFrame(tick); }

(async function init() {
  window.addEventListener('resize', resize);
  const [landData, borderData, lakeData, riverData] = await Promise.all([
    loadGeo(LAND_URL, true, 'land'),
    loadBorders(COUNTRIES_URL),
    loadGeo(LAKES_URL, false),
    loadGeo(RIVERS_URL, false),
  ]);
  land = landData; countryBorders = borderData; lakes = lakeData; rivers = riverData;
  resize();
  await poll();
  setInterval(poll, POLL_MS);
  tick();
})();
</script>
</body>
</html>
