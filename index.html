<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#14100d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Send to Lamp</title>
<style>
  :root {
    --bg: #14100d;
    --bg-elevated: #1e1712;
    --ember: #e8834a;
    --ember-dim: #a85c30;
    --ember-glow: #ff9d5c;
    --cream: #f0e6d8;
    --cream-dim: #b8ac9c;
    --line: #332a22;
    --success: #7fae7a;
    --fail: #c46a5f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(ellipse at top, #1c150f 0%, var(--bg) 60%);
    color: var(--cream);
    margin: 0;
    padding: 12px 18px 40px;
    min-height: 100vh;
  }
  h1 {
    font-size: 13px; font-weight: 500; letter-spacing: 0.03em; color: var(--cream-dim);
    text-align: center; margin: 0 0 12px; text-transform: lowercase;
  }
  .footer-row { text-align: center; opacity: 0.85; }
  h3 { font-size: 12px; font-weight: 600; color: var(--cream-dim); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: 0.06em; }

  input[type=file] { display: none; }

  .orientation-row { display: flex; gap: 8px; margin-bottom: 14px; justify-content: center; }
  .pill {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--cream-dim); font-size: 12px; letter-spacing: 0.02em;
  }
  .pill.active { background: var(--ember); border-color: var(--ember); color: #1a1108; font-weight: 600; }

  /* --- full photo + crop box --- */
  .photo-wrap {
    position: relative; width: 100%; overflow: hidden;
    background: #000; border: 1px solid var(--line); border-bottom: none;
    border-radius: 14px 14px 0 0;
    height: 30vh; min-height: 160px;
  }
  .photo-wrap img {
    display: block; width: 100%; height: 100%; object-fit: contain;
    user-select: none; -webkit-user-select: none; pointer-events: none;
  }
  .empty-state {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: var(--cream-dim); font-size: 13px; padding: 30px 0;
  }
  .empty-state svg { opacity: 0.5; }
  .tap-target { position: absolute; inset: 0; z-index: 3; }
  .photo-wrap.has-photo .tap-target { z-index: 1; pointer-events: none; }

  .crop-box {
    position: absolute; border: 2px solid var(--ember); background: rgba(232,131,74,0.08);
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.55);
    touch-action: none; z-index: 4;
  }
  .crop-box .handle {
    position: absolute; width: 28px; height: 28px;
    background: var(--ember); border-radius: 50%; border: 3px solid var(--bg);
    touch-action: none;
  }
  .handle-tl { left: -14px; top: -14px; }
  .handle-tr { right: -14px; top: -14px; }
  .handle-bl { left: -14px; bottom: -14px; }
  .handle-br { right: -14px; bottom: -14px; }

  .crop-hint { font-size: 11px; color: var(--cream-dim); text-align: center; margin-top: 8px; opacity: 0.7; }

  /* --- live dithered preview, scrub to adjust --- */
  /* height:auto (not a fixed vh box) so the canvas displays at true 1:1 pixel
     scale instead of being squeezed smaller than its real 400x300 resolution,
     which was smoothing away the actual blockiness of the real panel */
  .preview-wrap {
    position: relative; touch-action: none;
    width: 100%;
    border-radius: 0 0 14px 14px; overflow: hidden;
    border: 1px solid var(--line); border-top: 1px solid var(--ember-dim);
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  .preview-wrap canvas {
    max-width: 100%; height: auto; display: block;
    image-rendering: pixelated;
    image-rendering: -webkit-optimize-contrast;
    background: #fff;
  }
  .scrub-label {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(20,16,13,0.85); border: 1px solid var(--ember);
    color: var(--ember-glow); font-size: 12px; padding: 4px 10px; border-radius: 999px;
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  .scrub-label.visible { opacity: 1; }

  hr.divider { border: none; border-top: 1px solid var(--line); margin: 26px 0 18px; }

  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--cream-dim); margin-bottom: 10px; }
  .contacts-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .contact-chip {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 4px; border-radius: 12px; opacity: 0.55; width: 68px;
  }
  .contact-chip.selected { opacity: 1; }
  .contact-avatar {
    width: 52px; height: 52px; border-radius: 50%; background: var(--bg-elevated);
    border: 2px solid var(--line); display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--cream-dim);
  }
  .contact-chip.selected .contact-avatar { border-color: var(--ember); color: var(--ember-glow); }
  .contact-name { font-size: 11px; color: var(--cream-dim); max-width: 68px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .contact-chip.selected .contact-name { color: var(--cream); }
  .contact-id { font-size: 9px; color: #6b6155; max-width: 68px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .add-chip .contact-avatar { border-style: dashed; font-size: 22px; }
  .hold-hint { font-size: 10px; color: #6b6155; text-align: center; margin-top: 8px; }

  .send-zone { display: flex; flex-direction: column; align-items: center; margin-top: 32px; }
  .send-btn {
    width: 96px; height: 96px; border-radius: 50%; border: none;
    background: radial-gradient(circle at 35% 30%, var(--ember-glow), var(--ember) 55%, var(--ember-dim) 100%);
    box-shadow: 0 0 0 6px rgba(232,131,74,0.08), 0 8px 24px rgba(232,131,74,0.25);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease;
  }
  .send-btn:active { transform: scale(0.94); }
  .send-btn:disabled { opacity: 0.3; box-shadow: none; }
  .send-btn svg { width: 30px; height: 30px; }
  .send-status { margin-top: 14px; font-size: 12px; color: var(--cream-dim); text-align: center; min-height: 16px; }
  .send-status.success { color: var(--success); }
  .send-status.fail { color: var(--fail); }
  .last-seen { font-size: 11px; color: var(--cream-dim); text-align: center; margin-top: 6px; opacity: 0.7; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none;
    align-items: flex-end; justify-content: center; z-index: 50;
  }
  .modal-backdrop.open { display: flex; }
  .modal-sheet {
    background: var(--bg-elevated); border-radius: 18px 18px 0 0; padding: 22px 20px 32px;
    width: 100%; max-width: 480px; border-top: 1px solid var(--line);
  }
  .modal-sheet h2 { font-size: 15px; font-weight: 600; margin: 0 0 16px; color: var(--cream); }
  .modal-sheet label { font-size: 12px; color: var(--cream-dim); display: block; margin-bottom: 6px; }
  .modal-sheet input[type=text] {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--cream); font-size: 14px; margin-bottom: 14px;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 4px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; }
  .btn-cancel { background: var(--line); color: var(--cream-dim); }
  .btn-save { background: var(--ember); color: #1a1108; }
  .btn-remove { background: transparent; color: var(--fail); font-size: 12px; border: none; margin-top: 10px; padding: 6px; width: 100%; }
</style>
</head>
<body>

<div class="photo-wrap" id="photoWrap">
  <img id="sourceImg" src="" style="display:none;">
  <div class="empty-state" id="emptyState">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
    <span>tap to choose a photo</span>
  </div>
  <div class="crop-box" id="cropBox" style="display:none;">
    <div class="handle handle-tl" data-corner="tl"></div>
    <div class="handle handle-tr" data-corner="tr"></div>
    <div class="handle handle-bl" data-corner="bl"></div>
    <div class="handle handle-br" data-corner="br"></div>
  </div>
  <input type="file" id="fileInput" accept="image/*">
  <div class="tap-target" id="tapTarget"></div>
</div>
<div class="preview-wrap" id="previewWrap">
  <canvas id="liveCanvas"></canvas>
  <div class="scrub-label" id="scrubLabel">2</div>
</div>
<p class="crop-hint" id="cropHint" style="display:none;">drag box to move · drag corners to reshape · drag up/down on preview for shading</p>

<hr class="divider">

<div class="section-label">send to</div>
<div class="contacts-row" id="contactsRow">
  <div class="contact-chip add-chip" id="addContactBtn">
    <div class="contact-avatar">+</div>
    <div class="contact-name">add lamp</div>
  </div>
</div>
<p class="hold-hint">tap to select · hold to edit</p>

<div class="send-zone">
  <button class="send-btn" id="sendBtn" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="#1a1108" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3c2 2.5 3.5 5 3.5 7.5A3.5 3.5 0 0 1 8.5 12C8.5 9 10 5.5 12 3z"/>
      <path d="M12 21a4 4 0 0 0 4-4c0-1.5-1-2.5-2-3.5"/>
    </svg>
  </button>
  <div class="send-status" id="sendStatus"></div>
  <div class="last-seen" id="lastSeen"></div>
</div>

<hr class="divider">

<div class="footer-row">
  <h1>send today's light</h1>
  <div class="orientation-row">
    <button class="pill active" id="btnLandscape">landscape</button>
    <button class="pill" id="btnPortrait">portrait</button>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-sheet">
    <h2 id="modalTitle">add a lamp</h2>
    <label>name</label>
    <input type="text" id="contactName" placeholder="Sarah">
    <label>lamp id</label>
    <input type="text" id="contactId" placeholder="paste the code they gave you">
    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">cancel</button>
      <button class="btn-save" id="modalSave">save</button>
    </div>
    <button class="btn-remove" id="modalRemove" style="display:none;">remove this lamp</button>
  </div>
</div>

<script>
const WORKER_BASE_URL = "https://your-worker-name.workers.dev"; // <-- edit this

const fileInput = document.getElementById('fileInput');
const tapTarget = document.getElementById('tapTarget');
const photoWrap = document.getElementById('photoWrap');
const sourceImg = document.getElementById('sourceImg');
const emptyState = document.getElementById('emptyState');
const cropBox = document.getElementById('cropBox');
const cropHint = document.getElementById('cropHint');
const liveCanvas = document.getElementById('liveCanvas');
const lctx = liveCanvas.getContext('2d');
const previewWrap = document.getElementById('previewWrap');
const scrubLabel = document.getElementById('scrubLabel');
const sendBtn = document.getElementById('sendBtn');
const sendStatus = document.getElementById('sendStatus');
const lastSeen = document.getElementById('lastSeen');
const btnLandscape = document.getElementById('btnLandscape');
const btnPortrait = document.getElementById('btnPortrait');
const contactsRow = document.getElementById('contactsRow');
const addContactBtn = document.getElementById('addContactBtn');
const modalBackdrop = document.getElementById('modalBackdrop');
const modalTitle = document.getElementById('modalTitle');
const contactNameInput = document.getElementById('contactName');
const contactIdInput = document.getElementById('contactId');
const modalSave = document.getElementById('modalSave');
const modalCancel = document.getElementById('modalCancel');
const modalRemove = document.getElementById('modalRemove');

// ============================================================
// PANEL HARDWARE CONFIG: matches a 4.2" e-ink module (400x300).
// Change these if you're targeting a different panel size later —
// e.g. 296x128 for a 2.9", or 800x480 for a 7.5".
// ============================================================
const PANEL_W = 400, PANEL_H = 300;

let targetW = PANEL_W, targetH = PANEL_H; // fixed to the real panel resolution, not derived from the crop box
let naturalW = 0, naturalH = 0;
let hasPhoto = false;
let editingContactIdx = null;
let selectedContact = null;
let levels = 2;

// crop box state, in DISPLAYED (CSS) pixel coordinates relative to photoWrap
let box = { left: 0, top: 0, width: 0, height: 0 };

const CHUNK_TYPE = 'epRb';

// ---------- contacts ----------
function loadContacts() {
  try { return JSON.parse(localStorage.getItem('lampContacts') || '[]'); }
  catch { return []; }
}
function saveContacts(list) { localStorage.setItem('lampContacts', JSON.stringify(list)); }

function renderContacts() {
  const contacts = loadContacts();
  contactsRow.querySelectorAll('.contact-chip:not(.add-chip)').forEach(el => el.remove());
  contacts.forEach((c, i) => {
    const chip = document.createElement('div');
    chip.className = 'contact-chip' + (selectedContact === i ? ' selected' : '');
    const shortId = c.id.length > 10 ? c.id.slice(0, 10) + '…' : c.id;
    chip.innerHTML = `<div class="contact-avatar">${c.name.charAt(0).toUpperCase()}</div><div class="contact-name">${c.name}</div><div class="contact-id">${shortId}</div>`;

    let pressTimer = null;
    let firedLongPress = false;

    chip.addEventListener('touchstart', () => {
      firedLongPress = false;
      pressTimer = setTimeout(() => { firedLongPress = true; openModal(i); }, 550);
    }, { passive: true });

    chip.addEventListener('touchend', () => {
      clearTimeout(pressTimer);
      if (!firedLongPress) {
        selectedContact = i;
        renderContacts();
        updateSendState();
        checkLastSeen(c.id);
      }
    });

    chip.addEventListener('touchmove', () => { clearTimeout(pressTimer); });

    chip.addEventListener('click', () => {
      selectedContact = i; renderContacts(); updateSendState(); checkLastSeen(c.id);
    });

    contactsRow.insertBefore(chip, addContactBtn);
  });
}

function openModal(idx) {
  editingContactIdx = idx;
  const contacts = loadContacts();
  if (idx !== null) {
    modalTitle.textContent = 'edit lamp';
    contactNameInput.value = contacts[idx].name;
    contactIdInput.value = contacts[idx].id;
    modalRemove.style.display = 'block';
  } else {
    modalTitle.textContent = 'add a lamp';
    contactNameInput.value = '';
    contactIdInput.value = '';
    modalRemove.style.display = 'none';
  }
  modalBackdrop.classList.add('open');
}
addContactBtn.onclick = () => openModal(null);
modalCancel.onclick = () => modalBackdrop.classList.remove('open');
modalBackdrop.onclick = (e) => { if (e.target === modalBackdrop) modalBackdrop.classList.remove('open'); };
modalSave.onclick = () => {
  const name = contactNameInput.value.trim();
  const id = contactIdInput.value.trim();
  if (!name || !id) { alert('Enter both a name and the lamp id'); return; }
  const contacts = loadContacts();
  if (editingContactIdx !== null) contacts[editingContactIdx] = { name, id };
  else { contacts.push({ name, id }); selectedContact = contacts.length - 1; }
  saveContacts(contacts);
  modalBackdrop.classList.remove('open');
  renderContacts();
  updateSendState();
};
modalRemove.onclick = () => {
  const contacts = loadContacts();
  contacts.splice(editingContactIdx, 1);
  saveContacts(contacts);
  selectedContact = null;
  modalBackdrop.classList.remove('open');
  renderContacts();
  updateSendState();
};

function updateSendState() { sendBtn.disabled = !(hasPhoto && selectedContact !== null); }

async function checkLastSeen(lampId) {
  lastSeen.textContent = 'checking…';
  try {
    const res = await fetch(`${WORKER_BASE_URL}/lamp/${lampId}/status`);
    if (!res.ok) throw new Error();
    const info = await res.json();
    if (info.lastUpload) {
      const mins = Math.round((Date.now() - info.lastUpload) / 60000);
      let human;
      if (mins < 1) human = 'just now';
      else if (mins < 60) human = `${mins}m ago`;
      else if (mins < 1440) human = `${Math.round(mins/60)}h ago`;
      else human = `${Math.round(mins/1440)}d ago`;
      lastSeen.textContent = `last light sent ${human}`;
    } else lastSeen.textContent = 'no uploads yet';
  } catch { lastSeen.textContent = ''; }
}

// ---------- orientation: which way the physical panel is mounted ----------
// This now sets the ACTUAL fixed output resolution (matching the real e-ink
// hardware), not just a starting box shape. The crop box can still be any
// shape — whatever region you select gets stretched/squashed to fit this
// fixed pixel count, same as it will be on the real panel.
function setOrientation(landscape) {
  if (landscape) {
    btnLandscape.classList.add('active'); btnPortrait.classList.remove('active');
    targetW = PANEL_W; targetH = PANEL_H; presetAspect = PANEL_W / PANEL_H;
  } else {
    btnPortrait.classList.add('active'); btnLandscape.classList.remove('active');
    targetW = PANEL_H; targetH = PANEL_W; presetAspect = PANEL_H / PANEL_W;
  }
  liveCanvas.width = targetW;
  liveCanvas.height = targetH;
  if (naturalW) { initBox(); render(); }
}
let presetAspect = PANEL_W / PANEL_H;
btnLandscape.onclick = () => setOrientation(true);
btnPortrait.onclick = () => setOrientation(false);

// ---------- photo load ----------
tapTarget.onclick = () => fileInput.click();
fileInput.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    naturalW = img.naturalWidth; naturalH = img.naturalHeight;
    sourceImg.src = img.src;
    sourceImg.style.display = 'block';
    emptyState.style.display = 'none';
    photoWrap.classList.add('has-photo');
    cropBox.style.display = 'block';
    cropHint.style.display = 'block';
    hasPhoto = true;
    requestAnimationFrame(() => {
      updateCoverFit();
      initBox();
      render();
      lastWrapW = photoWrap.clientWidth;
    });
    updateSendState();
  };
  img.src = URL.createObjectURL(file);
};

// the container has a FIXED height (30vh via CSS) and the photo displays via
// object-fit: contain — the whole photo is always visible, letterboxed with
// the dark background on whichever axis doesn't fill the container.
// These three values describe exactly how the browser is rendering that
// contain-fit, so we can map container coords <-> natural pixel coords.
let coverScale = 1, coverX0 = 0, coverY0 = 0;
function updateCoverFit() {
  const containerW = photoWrap.clientWidth;
  const containerH = photoWrap.clientHeight;
  coverScale = Math.min(containerW / naturalW, containerH / naturalH); // min = contain (was max = cover)
  coverX0 = (containerW - naturalW * coverScale) / 2;
  coverY0 = (containerH - naturalH * coverScale) / 2;
}

// bounds of the actual visible photo within the container (excludes letterbox bars)
function visibleImageBounds() {
  return {
    left: coverX0,
    top: coverY0,
    right: coverX0 + naturalW * coverScale,
    bottom: coverY0 + naturalH * coverScale
  };
}

function initBox() {
  const vis = visibleImageBounds();
  const visW = vis.right - vis.left, visH = vis.bottom - vis.top;
  const aspect = presetAspect;

  let boxW, boxH;
  if (visW / visH > aspect) {
    boxH = visH * 0.9;
    boxW = boxH * aspect;
  } else {
    boxW = visW * 0.9;
    boxH = boxW / aspect;
  }
  box.width = boxW;
  box.height = boxH;
  box.left = vis.left + (visW - boxW) / 2;
  box.top = vis.top + (visH - boxH) / 2;
  applyBoxStyle();
}

function applyBoxStyle() {
  cropBox.style.left = box.left + 'px';
  cropBox.style.top = box.top + 'px';
  cropBox.style.width = box.width + 'px';
  cropBox.style.height = box.height + 'px';
}

// ---------- drag to move box (single touch only) ----------
let dragState = null;
cropBox.addEventListener('touchstart', (e) => {
  if (e.target.classList.contains('handle')) return; // handled separately
  if (e.touches.length !== 1) return;
  e.preventDefault();
  const t = e.touches[0];
  dragState = { startX: t.clientX, startY: t.clientY, startLeft: box.left, startTop: box.top };
}, { passive: false });
cropBox.addEventListener('touchmove', (e) => {
  if (!dragState) return;
  e.preventDefault();
  const t = e.touches[0];
  const vis = visibleImageBounds();
  let newLeft = dragState.startLeft + (t.clientX - dragState.startX);
  let newTop = dragState.startTop + (t.clientY - dragState.startY);
  newLeft = Math.max(vis.left, Math.min(vis.right - box.width, newLeft));
  newTop = Math.max(vis.top, Math.min(vis.bottom - box.height, newTop));
  box.left = newLeft; box.top = newTop;
  applyBoxStyle();
  render();
}, { passive: false });
cropBox.addEventListener('touchend', () => { dragState = null; }, { passive: false });

// ---------- freeform resize from any of the 4 corners, independent width/height ----------
const MIN_BOX = 40; // minimum displayed size in CSS px
let cornerState = null;

document.querySelectorAll('.handle').forEach(handle => {
  const corner = handle.dataset.corner; // 'tl' | 'tr' | 'bl' | 'br'

  handle.addEventListener('touchstart', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const t = e.touches[0];
    // the point opposite this handle stays fixed while dragging
    const fixed = {
      x: corner.includes('l') ? box.left + box.width : box.left,
      y: corner.includes('t') ? box.top + box.height : box.top
    };
    const moving = {
      x: corner.includes('l') ? box.left : box.left + box.width,
      y: corner.includes('t') ? box.top : box.top + box.height
    };
    cornerState = { corner, fixed, startMoving: moving, startX: t.clientX, startY: t.clientY };
  }, { passive: false });

  handle.addEventListener('touchmove', (e) => {
    if (!cornerState || cornerState.corner !== corner) return;
    e.preventDefault();
    e.stopPropagation();
    const t = e.touches[0];
    const vis = visibleImageBounds();
    const { fixed, startMoving, startX, startY } = cornerState;

    let movingX = startMoving.x + (t.clientX - startX);
    let movingY = startMoving.y + (t.clientY - startY);
    movingX = Math.max(vis.left, Math.min(vis.right, movingX));
    movingY = Math.max(vis.top, Math.min(vis.bottom, movingY));

    // enforce a minimum box size, expanding outward from the fixed point if needed
    if (Math.abs(movingX - fixed.x) < MIN_BOX) {
      movingX = fixed.x + (movingX >= fixed.x ? MIN_BOX : -MIN_BOX);
    }
    if (Math.abs(movingY - fixed.y) < MIN_BOX) {
      movingY = fixed.y + (movingY >= fixed.y ? MIN_BOX : -MIN_BOX);
    }
    movingX = Math.max(vis.left, Math.min(vis.right, movingX));
    movingY = Math.max(vis.top, Math.min(vis.bottom, movingY));

    box.left = Math.min(fixed.x, movingX);
    box.top = Math.min(fixed.y, movingY);
    box.width = Math.abs(fixed.x - movingX);
    box.height = Math.abs(fixed.y - movingY);

    applyBoxStyle();
    render();
  }, { passive: false });

  handle.addEventListener('touchend', (e) => {
    e.stopPropagation();
    if (cornerState && cornerState.corner === corner) cornerState = null;
  }, { passive: false });
});

// mobile Safari fires 'resize' when the address bar collapses/expands on scroll —
// we must NOT reset the box in that case, only reclamp it if the wrap actually got narrower
let lastWrapW = 0;
window.addEventListener('resize', () => {
  if (!naturalW) return;
  const wrapW = photoWrap.clientWidth;
  if (lastWrapW && wrapW === lastWrapW) return; // width unchanged, likely just a toolbar show/hide — ignore
  lastWrapW = wrapW;
  updateCoverFit();
  const vis = visibleImageBounds();
  box.width = Math.min(box.width, vis.right - vis.left);
  box.height = Math.min(box.height, vis.bottom - vis.top);
  box.left = Math.max(vis.left, Math.min(box.left, vis.right - box.width));
  box.top = Math.max(vis.top, Math.min(box.top, vis.bottom - box.height));
  applyBoxStyle();
  render();
});

// ---------- live render: crop + grayscale + floyd-steinberg dither ----------
function render() {
  if (!naturalW) return;

  // map crop box (container coordinates) back to natural image pixel coordinates
  // using the same cover-fit math the browser used to render the photo
  const sx = (box.left - coverX0) / coverScale;
  const sy = (box.top - coverY0) / coverScale;
  const sw = box.width / coverScale;
  const sh = box.height / coverScale;

  const W = targetW, H = targetH;
  lctx.clearRect(0,0,W,H);
  lctx.drawImage(sourceImg, sx, sy, sw, sh, 0, 0, W, H);

  const imgData = lctx.getImageData(0,0,W,H);
  const data = imgData.data;
  const gray = new Float32Array(W*H);
  for (let i=0;i<W*H;i++){ gray[i]=0.299*data[i*4]+0.587*data[i*4+1]+0.114*data[i*4+2]; }

  const step = 255/(levels-1);
  function quantize(v){ v=Math.max(0,Math.min(255,v)); return Math.round(Math.round(v/step)*step); }

  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const idx=y*W+x, old=gray[idx], nv=quantize(old); gray[idx]=nv; const err=old-nv;
    if(x+1<W) gray[idx+1]+=err*7/16;
    if(y+1<H){ if(x-1>=0) gray[idx+W-1]+=err*3/16; gray[idx+W]+=err*5/16; if(x+1<W) gray[idx+W+1]+=err*1/16; }
  }

  for (let i=0;i<W*H;i++){ const v=Math.max(0,Math.min(255,gray[i])); data[i*4]=v;data[i*4+1]=v;data[i*4+2]=v;data[i*4+3]=255; }
  lctx.putImageData(imgData,0,0);
  liveCanvas._grayCache = gray;
}

// ---------- scrub vertically on preview to adjust gray levels (replaces slider) ----------
// most affordable e-ink panels max out at 4 gray levels (2bpp); higher grayscale
// exists but needs pricier/slower hardware not suited to this power budget
const LEVEL_STEPS = [2, 3, 4];
function levelIndex(v) { return LEVEL_STEPS.indexOf(v); }

let scrubState = null;
let scrubLabelTimeout = null;
previewWrap.addEventListener('touchstart', (e) => {
  if (!naturalW || e.touches.length !== 1) return;
  const t = e.touches[0];
  scrubState = { startY: t.clientY, startIdx: levelIndex(levels) };
  scrubLabel.classList.add('visible');
  clearTimeout(scrubLabelTimeout);
}, { passive: true });
previewWrap.addEventListener('touchmove', (e) => {
  if (!scrubState) return;
  const t = e.touches[0];
  const dy = t.clientY - scrubState.startY;
  // dragging UP increases levels (more gradation), dragging DOWN decreases — sensitized to ~12px per step
  const stepsMoved = Math.round(-dy / 45);
  let newIdx = Math.max(0, Math.min(LEVEL_STEPS.length - 1, scrubState.startIdx + stepsMoved));
  const newLevel = LEVEL_STEPS[newIdx];
  if (newLevel !== levels) {
    levels = newLevel;
    scrubLabel.textContent = levels;
    render();
  }
}, { passive: true });
previewWrap.addEventListener('touchend', () => {
  scrubState = null;
  scrubLabelTimeout = setTimeout(() => scrubLabel.classList.remove('visible'), 700);
});

// ---------- crc32 + PNG chunk embed ----------
const crcTable = (() => { const t=[]; for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++){c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);}t[n]=c;} return t; })();
function crc32(bytes){ let c=0xFFFFFFFF; for(let i=0;i<bytes.length;i++){c=crcTable[(c^bytes[i])&0xFF]^(c>>>8);} return (c^0xFFFFFFFF)>>>0; }
function u32be(n){ return new Uint8Array([(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255]); }

async function buildChunkedPNG() {
  const W = targetW, H = targetH;
  const gray = liveCanvas._grayCache;
  const bytesPerRow = Math.ceil(W/8);
  const packed = new Uint8Array(bytesPerRow*H);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if (gray[y*W+x] > 127) packed[y*bytesPerRow+(x>>3)] |= (0x80 >> (x&7));
  }
  const header = new Uint8Array([(W>>8)&255,W&255,(H>>8)&255,H&255]);
  const chunkData = new Uint8Array(header.length+packed.length);
  chunkData.set(header,0); chunkData.set(packed,header.length);

  const blob = await new Promise(res => liveCanvas.toBlob(res,'image/png'));
  const pngBytes = new Uint8Array(await blob.arrayBuffer());
  let offset=8, iendOffset=-1;
  while(offset<pngBytes.length){
    const len=(pngBytes[offset]<<24|pngBytes[offset+1]<<16|pngBytes[offset+2]<<8|pngBytes[offset+3])>>>0;
    const type=String.fromCharCode(pngBytes[offset+4],pngBytes[offset+5],pngBytes[offset+6],pngBytes[offset+7]);
    if(type==='IEND'){ iendOffset=offset; break; }
    offset += 8+len+4;
  }
  const typeBytes = new Uint8Array([CHUNK_TYPE.charCodeAt(0),CHUNK_TYPE.charCodeAt(1),CHUNK_TYPE.charCodeAt(2),CHUNK_TYPE.charCodeAt(3)]);
  const crcInput = new Uint8Array(typeBytes.length+chunkData.length);
  crcInput.set(typeBytes,0); crcInput.set(chunkData,typeBytes.length);
  const crc = crc32(crcInput);
  const newChunk = new Uint8Array(4+4+chunkData.length+4);
  newChunk.set(u32be(chunkData.length),0);
  newChunk.set(typeBytes,4);
  newChunk.set(chunkData,8);
  newChunk.set(u32be(crc),8+chunkData.length);

  const finalBytes = new Uint8Array(pngBytes.length+newChunk.length);
  finalBytes.set(pngBytes.slice(0,iendOffset),0);
  finalBytes.set(newChunk, iendOffset);
  finalBytes.set(pngBytes.slice(iendOffset), iendOffset+newChunk.length);
  return new Blob([finalBytes], { type:'image/png' });
}

sendBtn.onclick = async () => {
  if (sendBtn.disabled) return;
  const contacts = loadContacts();
  const target = contacts[selectedContact];
  sendStatus.className = 'send-status';
  sendStatus.textContent = 'sending…';
  sendBtn.disabled = true;
  try {
    const blob = await buildChunkedPNG();
    const res = await fetch(`${WORKER_BASE_URL}/lamp/${target.id}/upload`, {
      method: 'POST', headers: { 'Content-Type': 'image/png' }, body: blob
    });
    if (!res.ok) throw new Error('Upload failed');
    sendStatus.textContent = `sent to ${target.name}`;
    sendStatus.classList.add('success');
    checkLastSeen(target.id);
  } catch (err) {
    sendStatus.textContent = 'could not send — check connection';
    sendStatus.classList.add('fail');
  }
  sendBtn.disabled = false;
};

// prevent Safari page-level pinch/zoom as a safety net (crop box uses single-touch drags only)
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('gesturechange', (e) => e.preventDefault());
document.addEventListener('gestureend', (e) => e.preventDefault());

renderContacts();
liveCanvas.width = targetW; liveCanvas.height = targetH;
</script>
