// inverse of equivalentMapLibreZoom: given a MapLibre zoom + latitude,
// what d3 transform.k gives the same real-world meters/pixel
function equivalentD3Zoom(mapLibreZoom, lat) {
  const metersPerPxAtK1 = (Math.PI * 6371000) / discRadius;
  const metersPerPxNow = 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, mapLibreZoom);
  return metersPerPxAtK1 / metersPerPxNow;
}

// positions the flat map so whatever MapLibre is currently centered on
// lands at the center of the flat map's viewport too, at the equivalent
// zoom/rotation — this is what makes exiting 3D feel like a continuation
// instead of a hard reset
function syncFlatMapToMapLibre() {
  rotationGamma = -terrainMapInstance.getBearing(); // preserve whatever rotation happened in 3D (entry used bearing: -rotationGamma, so this is its inverse)
  const c = terrainMapInstance.getCenter();
  // capped safely below HANDOFF_K — otherwise exiting could land the flat
  // map's zoom still above the entry threshold, which its own zoom handler
  // would see immediately and snap straight back into 3D: a flicker loop
  // that looks like an unwanted snap and interrupts whatever gesture is in
  // progress on the canvas underneath
  const k = Math.max(0.25, Math.min(HANDOFF_K * 0.8, equivalentD3Zoom(terrainMapInstance.getZoom(), c.lat)));
  const base = projection([c.lng, c.lat]);
  if (!base) return;
  const rad = rotationGamma * Math.PI / 180;
  const dx = base[0] - discCenter.x, dy = base[1] - discCenter.y;
  const rx = dx * Math.cos(rad) - dy * Math.sin(rad) + discCenter.x;
  const ry = dx * Math.sin(rad) + dy * Math.cos(rad) + discCenter.y;
  const rect = canvas.getBoundingClientRect();
  const tx = rect.width / 2 - k * rx, ty = rect.height / 2 - k * ry;
  d3.select(canvas).call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(k));
}

// EXIT_ZOOM used to be a fixed threshold here (4.5) — removed. The exit
// threshold is now the dynamic zoom floor itself (computeZoomFloor,
// defined below with the rest of that system), not a separate fixed
// number, so the two can never contradict each other at any latitude.
const EXIT_GRACE_MS = 400; // ignore the very first zoom event or two right after entry/jumpTo settling
const TREND_WINDOW_MS = 500; // exit is judged against zoom from this long ago, not the single previous event — absorbs gesture restarts/jitter that were eating pinch progress
const MIN_EXIT_DELTA = 0.35; // must have genuinely dropped by this much over the window, not just crossed the line — rotating the camera alone can nudge the reported zoom slightly, and this keeps that from misreading as a real zoom-out
let enteredAt = 0;
let zoomHistory = []; // rolling [{t, z}, ...] samples, trimmed to TREND_WINDOW_MS

// ============================================================
// HARD ZOOM FLOOR — this is the actual safety guarantee, not the trend
// check above. autoExitCheck() only looks at RATE of change within a
// rolling window (must drop >=0.35 within 500ms) — a real gap, since many
// small, deliberately slow pinches (each under that delta) never trip it,
// letting the camera drift arbitrarily far out with no exit ever
// triggering. minZoom is a genuine MapLibre-enforced constraint: it clamps
// every zoom interaction, gesture pattern or speed, so that loophole can't
// be exploited regardless of how the trend check behaves.
//
// Layered on top: the floor tightens the closer the camera gets to either
// pole. The Mercator void only ever becomes visible once you're BOTH
// zoomed out far AND near a pole — so instead of trying to cosmetically
// hide or blend it, just never let the camera reach a position where both
// conditions are true at once. Simpler and actually reliable.
//
// The curve itself: NOT a guessed formula. It's a piecewise-linear fit
// through 36 real (latitude, desired-min-zoom) data points, collected by
// testing at random longitudes and reporting the minimum zoom-out that
// still hid the void there. Sorted by latitude, binned (5° below 60°,
// 2° from 60-82°, tightening to 0.1° right at the edge, where sampling was
// densest and the curve is steepest — from 84.58° to 84.96°, only 0.38°,
// the desired floor rises from 9.74 to 13.13), then smoothed to be
// monotonic non-decreasing (two points, 12.42°->4.55 and 16.71°->4.22,
// disagreed — real noise from eyeballing screenshots, not a genuine signal
// that the floor should ever relax closer to a pole, so the curve takes
// the running max rather than dipping).
// To add more data points later: append [lat, zoom] pairs to this array in
// the same format, in any order — ZOOM_FLOOR_CURVE gets sorted before use.
// ============================================================
// The floor is active everywhere, exactly as originally intended — the
// low-latitude points here (4.55-5.14) are real data from testing, not a
// problem to work around. What WAS the problem: comparing this dynamic,
// location-dependent floor against a separate FIXED exit threshold
// (EXIT_ZOOM) could contradict it at some latitudes. Fixed by unifying
// them — see autoExitCheck below, which now exits when the camera hits
// THIS curve's current value, not a fixed number, so the two can never
// be in conflict again regardless of latitude.
const ZOOM_FLOOR_CURVE = [
  [10, 4.55], [15, 4.55], [25, 4.83], [35, 4.87], [45, 4.92], [50, 5.12],
  [55, 5.14], [62, 5.25], [66, 5.41], [68, 5.48], [70, 5.65], [72, 5.79],
  [76, 6.14], [78, 6.43], [80, 6.85], [82.5, 7.46], [82.75, 7.46],
  [83.5, 7.87], [83.75, 8.14], [84.3, 8.81], [84.6, 9.74], [84.8, 10.5],
  [84.9, 11.39], [85, 13.13],
].sort((a, b) => a[0] - b[0]);
let lastAppliedZoomFloor = null;

function computeZoomFloor(lat) {
  const absLat = Math.abs(lat);
  const curve = ZOOM_FLOOR_CURVE;
  if (absLat <= curve[0][0]) return curve[0][1]; // at or below the lowest sampled latitude — flat at that value
  if (absLat >= curve[curve.length - 1][0]) return curve[curve.length - 1][1]; // at or beyond the highest sampled latitude (currently 85°, essentially the true edge) — flat at that value
  for (let i = 1; i < curve.length; i++) {
    const [lat0, z0] = curve[i - 1], [lat1, z1] = curve[i];
    if (absLat <= lat1) {
      const t = (absLat - lat0) / (lat1 - lat0);
      return z0 + t * (z1 - z0);
    }
  }
  return curve[curve.length - 1][1]; // unreachable given the bounds checks above, but keeps this defined either way
}

// Single 'move' listener, ALWAYS the same rounding precision, plus a
// time-based throttle. An earlier version used two different rounding
// precisions — coarse on 'move', precise on 'moveend' — intending to
// reduce how often setMinZoom fires. Instead it created two DIFFERENT
// target values for the same latitude (e.g. 5.25 coarse vs 5.2547
// precise), and since setMinZoom itself can trigger another move/moveend
// event (clamping the current zoom changes the transform), those two
// values could ping-pong forever: precise sets 5.2547 -> fires a move
// event -> coarse recomputes 5.25 (different) -> sets it -> fires
// moveend -> precise recomputes 5.2547 again -> different from 5.25 ->
// sets it again -> repeat indefinitely, fully self-sustaining with no
// user input needed. A single consistent value can't do that: once
// applied, ANY subsequent event (even one triggered by this very call)
// computes the exact same number, hits the "nothing changed" guard below,
// and the cascade stops on its own. The throttle is just a lighter-touch
// version of the original goal (don't fight active gesture handling by
// calling setMinZoom too often) without introducing a second value to
// oscillate against.
let lastZoomFloorApplyTime = 0;
const ZOOM_FLOOR_THROTTLE_MS = 200;
// Circuit breaker: if setMinZoom is somehow still being called in a tight
// loop (a fixed repro at 79.56°N suggests there's a second cascade this
// throttle alone isn't catching — possibly involving the weather layer's
// zoom-based opacity fade, which happens to end at zoom 8, right where
// this was reported stuck), this hard-stops it after a handful of calls
// in quick succession rather than letting it spin forever, AND logs what
// was happening so the real mechanism can actually be identified instead
// of guessed at again.
let zoomFloorCallTimestamps = [];
const ZOOM_FLOOR_BREAKER_WINDOW_MS = 1500;
const ZOOM_FLOOR_BREAKER_MAX_CALLS = 8;
let zoomFloorBreakerTripped = false;
function updateZoomFloor(force) {
  if (DEBUG_DISABLE_ZOOM_FLOOR || !terrainMapInstance) return;
  const floor = Math.round(computeZoomFloor(terrainMapInstance.getCenter().lat) * 100) / 100;
  if (floor === lastAppliedZoomFloor) return; // nothing actually changed
  const now = performance.now();

  zoomFloorCallTimestamps.push(now);
  zoomFloorCallTimestamps = zoomFloorCallTimestamps.filter(t => now - t < ZOOM_FLOOR_BREAKER_WINDOW_MS);
  if (zoomFloorCallTimestamps.length > ZOOM_FLOOR_BREAKER_MAX_CALLS) {
    if (!zoomFloorBreakerTripped) {
      zoomFloorBreakerTripped = true;
      console.error('gallery: zoom-floor circuit breaker tripped —', zoomFloorCallTimestamps.length,
        'setMinZoom attempts within', ZOOM_FLOOR_BREAKER_WINDOW_MS, 'ms at lat', terrainMapInstance.getCenter().lat.toFixed(4),
        'zoom', terrainMapInstance.getZoom().toFixed(4), '— pausing zoom-floor updates for 3s.');
      setTimeout(() => {
        zoomFloorBreakerTripped = false;
        zoomFloorCallTimestamps = [];
        console.warn('gallery: zoom-floor circuit breaker reset, resuming normal updates');
      }, 3000);
    }
    return; // hard stop — don't call setMinZoom again until the breaker resets, regardless of throttle/force
  }

  if (!force && now - lastZoomFloorApplyTime < ZOOM_FLOOR_THROTTLE_MS) return; // rate-limited — a genuine change will still go through on the next allowed tick, since lastAppliedZoomFloor was never updated for the skipped attempt
  lastZoomFloorApplyTime = now;
  lastAppliedZoomFloor = floor;
  console.log('gallery: setMinZoom(' + floor + ') at lat', terrainMapInstance.getCenter().lat.toFixed(4), 'zoom', terrainMapInstance.getZoom().toFixed(4));
  terrainMapInstance.setMinZoom(floor);
}

// Estimates the CAMERA's real-world altitude — not the terrain's own
// elevation (that's queryTerrainElevation, used for elevVal above), but
// how high the camera itself is sitting, derived from zoom/pitch/viewport
// height using MapLibre's documented fixed vertical FOV (36.87°, confirmed
// against MapLibre's own docs). Matches MapLibre's own internal formula
// for camera altitude: cos(pitch) * cameraToCenterDistance / pixelsPerMeter
// + centerElevation — reconstructed here entirely from public APIs
// (getZoom/getPitch/getCenter/queryTerrainElevation/container size) rather
// than reaching into transform internals.
const MAPLIBRE_FOV_DEG = 36.87;
const METERS_TO_FEET = 3.28084;
function estimateCameraAltitudeFt() {
  if (!terrainMapInstance) return null;
  const canvasHeightPx = terrainMapInstance.getContainer().clientHeight;
  if (!canvasHeightPx) return null;
  const fovRad = MAPLIBRE_FOV_DEG * Math.PI / 180;
  const cameraToCenterDistancePx = 0.5 / Math.tan(fovRad / 2) * canvasHeightPx;
  const pitchRad = terrainMapInstance.getPitch() * Math.PI / 180;
  const c = terrainMapInstance.getCenter();
  const groundResolutionMPerPx = 156543.03392 * Math.cos(c.lat * Math.PI / 180) / Math.pow(2, terrainMapInstance.getZoom());
  const altitudeAboveCenterM = Math.cos(pitchRad) * cameraToCenterDistancePx * groundResolutionMPerPx;
  let terrainElevM = 0;
  try {
    const e = terrainMapInstance.queryTerrainElevation([c.lng, c.lat]);
    if (typeof e === 'number' && !isNaN(e)) terrainElevM = e;
  } catch {}
  return {
    aboveTerrainFt: altitudeAboveCenterM * METERS_TO_FEET,
    aboveSeaLevelFt: (altitudeAboveCenterM + terrainElevM) * METERS_TO_FEET,
  };
}

// Debug/tuning readout (replaces "lights shared") — lets ocean depth, real
// terrain elevation, and estimated camera altitude be read directly off
// the dashboard while tuning computeZoomFloor() above.
function updateZoomElevReadout() {
  if (!in3D || !terrainMapInstance) {
    terrainLevelValEl.textContent = '–';
    terrainLevelUnitEl.textContent = 'm elev';
    camAltValEl.textContent = '–';
    return;
  }
  const c = terrainMapInstance.getCenter();
  const depth = getOceanDepthMetersSync(c.lng, c.lat);

  // One shared metric line: below sea level, show bathymetric depth;
  // otherwise show terrain elevation. Ocean depth is negative by convention
  // here, so there is never a redundant "0 m elev" while over water.
  if (depth === undefined) {
    terrainLevelValEl.textContent = '…';
    terrainLevelUnitEl.textContent = 'm depth';
  } else if (depth !== null && depth < 0) {
    terrainLevelValEl.textContent = Math.round(depth);
    terrainLevelUnitEl.textContent = 'm depth';
  } else {
    let elev = null;
    try { elev = terrainMapInstance.queryTerrainElevation([c.lng, c.lat]); } catch {}
    terrainLevelValEl.textContent = (typeof elev === 'number' && !isNaN(elev)) ? Math.round(elev) : '–';
    terrainLevelUnitEl.textContent = 'm elev';
  }

  const camAlt = estimateCameraAltitudeFt();
  camAltValEl.textContent = camAlt ? (camAlt.aboveTerrainFt / 5280).toFixed(2) : '–';
}

async function enter3D(lon, lat) {
  if (in3D) return;
  in3D = true;
  await loadMapLibre();
  // RainViewer is initialized only when 3D is actually entered. This keeps
  // the flat map fast while restoring the original live precipitation layer
  // and its MapLibre attribution in the 3D view.
  if (!DEBUG_DISABLE_WEATHER) initWeatherProtocol();
  const map3d = initTerrainMap();
  const zoom = Math.max(3, equivalentMapLibreZoom(lat)); // matches where you actually were on the flat map — no artificial floor
  zoomHistory = [{ t: performance.now(), z: zoom }];
  enteredAt = performance.now(); // stamped after loadMapLibre() resolves, so the grace period covers actual settling time, not library-fetch time
  map3d.jumpTo({ center: [lon, lat], zoom, pitch: 60, bearing: -rotationGamma });
  lastPoleLat = map3d.getCenter().lat;
  updateZoomFloor(true); // force=true: apply immediately, bypassing the throttle, in case entry itself is already near a pole
  updateZoomElevReadout();
  poleWrapping = false;
  setPoleFade(false);
  document.getElementById('terrainMap').classList.add('active');
  canvas.classList.add('faded');
  backBtn.classList.add('visible');
  document.getElementById('layerToggles').classList.add('visible');
  setTimeout(() => map3d.resize(), 50); // container was display:none-adjacent (opacity 0); MapLibre needs a resize once it's actually laid out
}

function autoExitCheck() {
  if (!in3D) return;
  const now = performance.now();
  const z = terrainMapInstance.getZoom();
  zoomHistory.push({ t: now, z });
  while (zoomHistory.length > 1 && now - zoomHistory[0].t > TREND_WINDOW_MS) zoomHistory.shift();
  if (now - enteredAt < EXIT_GRACE_MS) return; // still settling from entry — ignore
  const oldest = zoomHistory[0];
  // The floor IS the exit threshold now, not a separate fixed number —
  // this is what "hitting the floor" means: minZoom clamps the camera so
  // it literally cannot go below this value, so once zoomed-out gesture
  // pressure gets the camera down to (within a small tolerance of) its
  // current location's floor, that's the trigger. A fixed EXIT_ZOOM used
  // to be compared against separately, which could sit BELOW the floor at
  // some latitudes — making exit unreachable there, and very likely
  // trapping an active zoom-out gesture uselessly pushing against a wall
  // with no escape, which is probably what the glitch actually was.
  const currentFloor = computeZoomFloor(terrainMapInstance.getCenter().lat);
  const atFloor = z <= currentFloor + 0.05; // small tolerance for float/interpolation jitter, not an exact equality check
  if (atFloor && (oldest.z - z) > MIN_EXIT_DELTA) exit3D(); // at the floor AND a real, sustained zoom-out over the window — not rotation noise or gesture-restart jitter
}

function exit3D() {
  if (!in3D) return;
  in3D = false;
  syncFlatMapToMapLibre();
  document.getElementById('terrainMap').classList.remove('active');
  canvas.classList.remove('faded');
  backBtn.classList.remove('visible');
  document.getElementById('layerToggles').classList.remove('visible');
  updateZoomElevReadout(); // resets to "–" now that in3D is false
  draw();
}
const backBtn = document.getElementById('backBtn');
backBtn.onclick = exit3D;

// ---- hover / tap tooltips (accounts for current pan/zoom) ----
function screenPointFor(geo) {
  const p = project(geo);
  if (!p) return null;
  const base = projection(p); // base (gamma=0) projected coordinates
  if (!base) return null;
  // apply the same gamma rotation around discCenter that draw() applies via
  // ctx.rotate(), so hit-testing matches what's actually on screen
  const rad = rotationGamma * Math.PI / 180;
  const dx = base[0] - discCenter.x, dy = base[1] - discCenter.y;
  const rx = dx * Math.cos(rad) - dy * Math.sin(rad) + discCenter.x;
  const ry = dx * Math.sin(rad) + dy * Math.cos(rad) + discCenter.y;
  return [transform.x + transform.k * rx, transform.y + transform.k * ry];
}
function handlePointer(mx, my) {
  let best = null, bestDist = 16;
  for (const ev of events) {
    for (const [geo, kind] of [[ev.sentGeo, 'sent'], [ev.downloadGeo, 'received']]) {
      const s = screenPointFor(geo);
      if (!s) continue;
      const d = Math.hypot(s[0] - mx, s[1] - my);
      if (d < bestDist) { bestDist = d; best = { ev, kind, geo }; }
    }
  }
  if (best) {
    const { ev, kind, geo } = best;
    const place = [geo.city, geo.region, geo.country].filter(Boolean).join(', ') || 'unknown location';
    let html = `<b>${kind === 'sent' ? 'sent from' : 'received in'}</b> ${place}`;
    if (ev.deliveryMs != null) {
      const secs = Math.round(ev.deliveryMs / 1000);
      html += `<br>delivered in ${secs < 60 ? secs + 's' : Math.round(secs/60) + 'm'}`;
    } else {
      html += `<br><span style="color:var(--ember)">in flight…</span>`;
    }
    tooltipEl.innerHTML = html;
    tooltipEl.style.display = 'block';
    const rect = canvas.getBoundingClientRect();
    tooltipEl.style.left = Math.min(mx + 14, rect.width - 230) + 'px';
    tooltipEl.style.top = Math.max(my - 10, 4) + 'px';
  } else {
    tooltipEl.style.display = 'none';
  }
}
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  handlePointer(e.clientX - rect.left, e.clientY - rect.top);
});
canvas.addEventListener('mouseleave', () => { tooltipEl.style.display = 'none'; });

// ---- polling, with a real reason shown on failure instead of a vague message ----
async function poll() {
  try {
    const res = await fetch(`${WORKER_BASE_URL}/gallery/events?limit=200`);
    if (!res.ok) {
      statusEl.textContent = `worker returned ${res.status} — check it's deployed`;
      statusEl.classList.add('error'); statusEl.classList.remove('live');
      return;
    }
    const data = await res.json();
    events = data.events || [];
    emptyEl.style.display = events.length === 0 ? 'flex' : 'none';
    statusEl.textContent = 'live';
    statusEl.classList.add('live'); statusEl.classList.remove('error');
  } catch (err) {
    console.error('gallery: poll failed', err);
    statusEl.textContent = 'network error — retrying… (see console for detail)';
    statusEl.classList.add('error'); statusEl.classList.remove('live');
  }
}

function tick() {
  if (!twist && Math.abs(spinVelocity) > 0.01) {
    rotationGamma += spinVelocity;
    spinVelocity *= 0.976; // friction, decay rate reduced 2.5x from before — spins longer before settling
  }
  draw();
  requestAnimationFrame(tick);
}

(async function init() {
  window.addEventListener('resize', resize);
  const [landData, lakeData, riverData] = await Promise.all([
    loadGeo(LAND_URL, true, 'land'),
    loadGeo(LAKES_URL, false),
    loadGeo(RIVERS_URL, false),
  ]);
  land = landData; lakes = lakeData; rivers = riverData;
  resize();
  await poll();
  setInterval(poll, POLL_MS);
  tick();
})();
</script>
</body>
