<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>candlelight — gallery</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.10.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root {
    --bg: #15100a;
    --panel: #1d1610;
    --line: rgba(240, 224, 190, 0.12);
    --ember: #e8823c;
    --ember-dim: rgba(232, 130, 60, 0.55);
    --cream: #f2e9d8;
    --cream-dim: rgba(242, 233, 216, 0.55);
    /* bright atlas-style palette for the map surface itself, distinct from
       the dark app chrome around it — legibility over mood here */
    --ocean: #b9dde2;
    --land: #ecd191;
    --land-line: #b08a4a;
    --water: #8fc3d6;
    --river: #4f9fc0;
    --graticule: rgba(90, 70, 30, 0.18);
    --sphere-edge: #6b5230;
  }
  * { box-sizing: border-box; touch-action: none; }
  html, body {
    height: 100%; height: 100dvh; margin: 0; background: var(--bg); color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 6px; flex: 0 0 auto; background: var(--bg); z-index: 2;
  }
  h1 { font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; margin: 0; color: var(--ember); font-weight: 700; }
  #status { font-size: 11px; color: var(--cream-dim); }
  #status.live::before { content: '● '; color: var(--ember); }
  #status.error { color: #e88a6c; }
  main {
    position: relative; flex: 1 1 auto; min-height: 0;
    background: radial-gradient(circle at center, #f1e6cf 0%, #ddcda3 55%, #c3ac81 100%);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; position: relative; z-index: 2; }
  canvas:active { cursor: grabbing; }
  #tooltip {
    position: absolute; pointer-events: none; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font-size: 12px; line-height: 1.5; color: var(--cream); display: none;
    max-width: 220px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); z-index: 5;
  }
  #tooltip b { color: var(--ember); }
  #legend {
    position: absolute; left: 14px; bottom: 14px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    font-size: 11px; color: var(--cream-dim); display: flex; flex-direction: column; gap: 5px;
  }
  #legend .row { display: flex; align-items: center; gap: 7px; }
  #legend .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  #count {
    position: absolute; right: 14px; bottom: 14px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
    font-size: 11px; color: var(--cream-dim); text-align: right;
  }
  #count b { color: var(--cream); font-size: 16px; display: block; }
  #resetBtn {
    position: absolute; right: 14px; top: 14px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px;
    font-size: 11px; color: var(--cream-dim); z-index: 3;
  }
  #terrainMap {
    position: absolute; inset: 0; opacity: 0; pointer-events: none;
    transition: opacity 0.6s ease; z-index: 1;
  }
  #terrainMap.active { opacity: 1; pointer-events: auto; }
  #map { transition: opacity 0.6s ease; }
  #map.faded { opacity: 0; pointer-events: none; }
  #backBtn {
    position: absolute; left: 14px; top: 14px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px;
    font-size: 11px; color: var(--cream-dim); z-index: 3; display: none;
  }
  #backBtn.visible { display: block; }
  /* strip MapLibre's own attribution/logo chrome down to something minimal
     and on-theme rather than its default styling */
  .maplibregl-ctrl-attrib { background: var(--panel) !important; color: var(--cream-dim) !important; font-size: 10px !important; }
  .maplibregl-ctrl-attrib a { color: var(--cream-dim) !important; }
  .maplibregl-ctrl-logo { display: none !important; }
  #empty {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 6px; color: var(--cream-dim); font-size: 13px; text-align: center; padding: 20px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>candlelight — gallery</h1>
    <span id="status">connecting…</span>
  </header>
  <main>
    <canvas id="map"></canvas>
    <div id="terrainMap"></div>
    <button id="resetBtn">reset view</button>
    <button id="backBtn">back to overview</button>
    <div id="tooltip"></div>
    <div id="legend">
      <div class="row"><span class="dot" style="background:var(--ember)"></span> sent</div>
      <div class="row"><span class="dot" style="background:#1d1610"></span> received</div>
      <div class="row"><span class="dot" style="background:var(--ember-dim);opacity:0.6"></span> in flight</div>
    </div>
    <div id="count"><b id="countNum">0</b>lights shared</div>
    <div id="empty">
      <div>no lights shared yet</div>
      <div style="font-size:11px;opacity:0.7">send one from the app, or seed test data via the Worker</div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script type="module">
// maplibregl is loaded lazily (see loadMapLibre()) rather than imported here
// eagerly — it's a large library, and importing it up front was adding real
// load weight to every visit even for people who never zoom in far enough
// to reach the 3D view.
let maplibregl = null;
async function loadMapLibre() {
  if (maplibregl) return maplibregl;
  maplibregl = await import('https://cdn.jsdelivr.net/npm/maplibre-gl@6.10.0/dist/maplibre-gl.mjs');
  return maplibregl;
}
// ---- config ----
const WORKER_BASE_URL = "https://candlelight.daniloinfinite.workers.dev"; // keep in sync with index.html
const POLL_MS = 8000;
const LAND_URL = "https://cdn.jsdelivr.net/npm/world-atlas@2/land-50m.json";
const LAKES_URL = "https://ne.freemap.online/50m/physical/ne_50m_lakes.json";
const RIVERS_URL = "https://ne.freemap.online/50m/physical/ne_50m_rivers_lake_centerlines.json";

const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const countEl = document.getElementById('countNum');
const emptyEl = document.getElementById('empty');
const tooltipEl = document.getElementById('tooltip');
const resetBtn = document.getElementById('resetBtn');

// Azimuthal equidistant, polar aspect (North Pole at center) — true
// distance-from-center in every direction. Base scale fits the WHOLE disc
// in view; d3-zoom (pinch/drag/wheel) layers on top for zooming in.
// Azimuthal equidistant, centered on the continental US (geographic center,
// near Lebanon, Kansas: ~39.83N, 98.58W) — the classic "centered on my
// city" style seen in vintage azimuthal equidistant maps, rather than the
// default polar-centered aspect. d3's .rotate() takes the negated
// [longitude, latitude] of the point that should land at the center.
const US_CENTER = [98.58, -39.83];
let rotationGamma = 0; // two-finger twist offset, degrees — applied as a pure canvas rotation at draw time (see draw()), NOT baked into the projection, so spinning stays cheap even with the terrain layer below
let spinVelocity = 0; // degrees/frame of residual spin after a flick, decays via friction in tick()
const projection = d3.geoAzimuthalEquidistant().rotate(US_CENTER).precision(0.3);
const path = d3.geoPath(projection, ctx);

let discCenter = { x: 0, y: 0 }, discRadius = 0; // fixed once per resize(), since the projection itself no longer changes with gamma

let land = null, lakes = null, rivers = null;
let events = [];
let dpr = window.devicePixelRatio || 1;
let transform = d3.zoomIdentity;

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  const size = Math.min(rect.width, rect.height);
  projection.scale(size * 0.49).translate([rect.width / 2, rect.height / 2]);
  const b = path.bounds(sphere);
  discCenter = { x: (b[0][0] + b[1][0]) / 2, y: (b[0][1] + b[1][1]) / 2 };
  discRadius = (b[1][0] - b[0][0]) / 2;
  bakeWater(); // expensive (canvas blur filter) — only runs here, on load/resize, never per animation frame
  draw();
}

// rivers/lakes, pre-rendered WITH their blur applied once, at the same
// fixed (gamma=0) projected coordinates everything else uses — draw() just
// blits this each frame via the live pan/zoom/rotate transform, the same
// cheap pattern used elsewhere, instead of recomputing a canvas blur filter
// on every single animation frame (which is expensive and was the real
// cause of the spin feeling laggy)
let waterCanvas = null;
function bakeWater() {
  if (!rivers && !lakes) { waterCanvas = null; return; }
  const rect = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(1, Math.round(rect.width)), h = Math.max(1, Math.round(rect.height));
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const octx = off.getContext('2d');
  const bakePath = d3.geoPath(projection, octx);
  const oceanColor = getComputedStyle(document.documentElement).getPropertyValue('--ocean').trim();
  if (rivers) {
    octx.save();
    octx.filter = 'blur(1px)';
    octx.beginPath(); bakePath(rivers);
    octx.strokeStyle = oceanColor;
    octx.globalAlpha = 0.8;
    octx.lineWidth = 0.4;
    octx.stroke();
    octx.restore();
  }
  if (lakes) {
    octx.save();
    octx.filter = 'blur(1.5px)';
    octx.beginPath(); bakePath(lakes);
    octx.fillStyle = oceanColor;
    octx.globalAlpha = 0.8;
    octx.fill();
    octx.restore();
  }
  waterCanvas = off;
}

async function loadGeo(url, isTopo, objectName) {
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    return isTopo ? topojson.feature(data, data.objects[objectName]) : data;
  } catch (err) {
    console.warn('gallery: failed to load', url, err);
    return null;
  }
}

const sphere = { type: 'Sphere' };


function project(geo) { return geo && geo.lat != null && geo.lon != null ? [geo.lon, geo.lat] : null; }

function draw() {
  const rect = canvas.parentElement.getBoundingClientRect();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, rect.width, rect.height);

  // pan/zoom: fold the current d3-zoom transform into the canvas transform
  // (alongside dpr scaling), then draw everything in fixed projected
  // coordinates — the standard d3-zoom + canvas pattern
  ctx.setTransform(transform.k * dpr, 0, 0, transform.k * dpr, transform.x * dpr, transform.y * dpr);

  // two-finger spin: a pure rotation around the disc's (fixed) center,
  // layered on top of pan/zoom. Decoupled from the projection itself, so it
  // applies identically and cheaply to both the live vector paths below AND
  // the pre-baked terrain bitmap, without needing to re-bake anything.
  ctx.translate(discCenter.x, discCenter.y);
  ctx.rotate(rotationGamma * Math.PI / 180);
  ctx.translate(-discCenter.x, -discCenter.y);

  const lw = (px) => px / transform.k; // keep stroke widths visually constant across zoom levels
  const pr = (px) => px / transform.k; // same for point radii

  // ocean fades to transparent near the disc's outer edge, so it blends
  // softly into the beige page background instead of a hard circular border
  const oceanGrad = ctx.createRadialGradient(discCenter.x, discCenter.y, discRadius * 0.92, discCenter.x, discCenter.y, discRadius);
  const oceanColor = getComputedStyle(document.documentElement).getPropertyValue('--ocean').trim();
  oceanGrad.addColorStop(0, oceanColor);
  oceanGrad.addColorStop(1, 'rgba(185,221,226,0)');
  ctx.beginPath(); path(sphere);
  ctx.fillStyle = oceanGrad;
  ctx.fill();

  if (land) {
    ctx.beginPath(); path(land);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--land');
    ctx.fill();
  }
  if (waterCanvas) {
    ctx.drawImage(waterCanvas, 0, 0, waterCanvas.width, waterCanvas.height);
  }

  drawEvents(lw, pr);
}

function drawEvents(lw, pr) {
  const now = Date.now();
  for (const ev of events) {
    const from = project(ev.sentGeo);
    const to = project(ev.downloadGeo);

    if (from && to) {
      ctx.beginPath();
      path({ type: 'LineString', coordinates: [from, to] });
      ctx.strokeStyle = 'rgba(232,130,60,0.55)';
      ctx.lineWidth = lw(1.3);
      ctx.stroke();
    }
    if (from) {
      const inFlight = !ev.downloadedAt;
      const pulse = inFlight ? (0.5 + 0.5 * Math.sin(now / 400)) : 1;
      ctx.beginPath();
      path.pointRadius(pr(inFlight ? 4 : 3))({ type: 'Point', coordinates: from });
      ctx.fillStyle = inFlight ? `rgba(232,130,60,${0.4 + 0.4 * pulse})` : '#e8823c';
      ctx.fill();
      ctx.lineWidth = lw(0.8); ctx.strokeStyle = '#1d1610'; ctx.stroke();
    }
    if (to) {
      ctx.beginPath();
      path.pointRadius(pr(3))({ type: 'Point', coordinates: to });
      ctx.fillStyle = '#1d1610';
      ctx.fill();
      ctx.lineWidth = lw(0.8); ctx.strokeStyle = '#f2e9d8'; ctx.stroke();
    }
  }
  path.pointRadius(2.5); // reset default used elsewhere
}

// ---- pan / pinch-zoom, plus two-finger twist-to-spin read from the same
// gesture — d3.zoom suppresses propagation of the raw touch events it
// handles, so separate touchstart/touchmove listeners never see them.
// Reading rotation from event.sourceEvent inside d3.zoom's own 'zoom'
// callback sidesteps that entirely, since that event always fires. ----
let twist = null; // { prevAngle, lastTime } while a 2-touch zoom gesture is active
function touchAngle(touches) {
  const dx = touches[1].clientX - touches[0].clientX;
  const dy = touches[1].clientY - touches[0].clientY;
  return Math.atan2(dy, dx) * 180 / Math.PI;
}
const zoomBehavior = d3.zoom()
  .scaleExtent([0.25, 10])
  .on('zoom', (event) => {
    transform = event.transform;
    const se = event.sourceEvent;
    if (se && se.touches && se.touches.length === 2) {
      const angle = touchAngle(se.touches);
      const now = performance.now();
      if (twist) {
        let delta = angle - twist.prevAngle;
        if (delta > 180) delta -= 360; // shortest-path across the atan2 wrap point
        if (delta < -180) delta += 360;
        const dt = Math.max(now - twist.lastTime, 1);
        const SPIN_MULT = -2; // spins twice as fast as the raw finger angle, reversed direction
        const MOMENTUM_MULT = 1.5; // extra boost to how much velocity a flick imparts
        spinVelocity = (delta / dt) * 16 * SPIN_MULT * MOMENTUM_MULT;
        rotationGamma += delta * SPIN_MULT;
      } else {
        spinVelocity = 0; // grabbing it fresh stops any residual momentum spin
      }
      twist = { prevAngle: angle, lastTime: now };
    } else if (twist) {
      twist = null; // dropped below 2 touches — momentum takes over in tick()
    }
    if (transform.k >= HANDOFF_K && !in3D) {
      const rect = canvas.getBoundingClientRect();
      const lonlat = lonLatAtScreenPoint(rect.width / 2, rect.height / 2);
      if (lonlat) enter3D(lonlat[0], lonlat[1]);
    }
    draw();
  });
d3.select(canvas).call(zoomBehavior);
resetBtn.onclick = () => {
  d3.select(canvas).transition().duration(400).call(zoomBehavior.transform, d3.zoomIdentity);
  rotationGamma = 0; spinVelocity = 0;
};

// ============================================================
// FLAT-TO-3D HANDOFF
// Pinch/zoom in far enough on the flat azimuthal map and it crossfades
// into a real MapLibre 3D terrain view, positioned at whatever point was
// at the center of the screen. This isn't a continuous reprojection (that
// would need the two engines to share a coordinate system, which they
// don't) — it's a deliberate hand-off at a chosen threshold, timed for
// where the difference between azimuthal equidistant and a standard
// projection becomes visually irrelevant anyway.
// ============================================================
const HANDOFF_K = 5; // d3 zoom scale that triggers the crossfade into 3D
let in3D = false;

// inverse of screenPointFor(): given a screen pixel, find the lon/lat
// currently shown there — undoes pan/zoom, then gamma rotation, then the
// (fixed, gamma=0) projection itself
function lonLatAtScreenPoint(sx, sy) {
  const baseX = (sx - transform.x) / transform.k;
  const baseY = (sy - transform.y) / transform.k;
  const rad = -rotationGamma * Math.PI / 180;
  const dx = baseX - discCenter.x, dy = baseY - discCenter.y;
  const px = dx * Math.cos(rad) - dy * Math.sin(rad) + discCenter.x;
  const py = dx * Math.sin(rad) + dy * Math.cos(rad) + discCenter.y;
  return projection.invert([px, py]); // [lon, lat] or null
}

// converts the flat map's current zoom into an equivalent MapLibre zoom
// level, via actual real-world meters/pixel — not an arbitrary tuned
// number. discRadius (CSS px) represents pi * earthRadius (meters), since
// that's the edge of an azimuthal equidistant world map.
function equivalentMapLibreZoom(lat) {
  const metersPerPxAtK1 = (Math.PI * 6371000) / discRadius;
  const metersPerPxNow = metersPerPxAtK1 / transform.k;
  return Math.log2(156543.03392 * Math.cos(lat * Math.PI / 180) / metersPerPxNow);
}

// ============================================================
// WEATHER: RainViewer's free public radar API, with snow and rain given
// distinct client-side styling — soft fuzzy white for snow, faint blue for
// rain — since RainViewer's own tiles just render both as one continuous
// color ramp. There's no MapLibre style-spec paint property that can do
// this kind of per-pixel conditional recoloring on a plain raster layer
// (that needs actual pixel access), so this uses maplibregl.addProtocol to
// intercept each tile, recolor it on a canvas, and hand the result back —
// still fully client-side, no backend involved, just the real mechanism
// for this rather than a style-property that doesn't exist.
//
// Real, verified API: https://api.rainviewer.com/public/weather-maps.json
// gives {host, radar:{past:[...]}}; tiles are
// {host}{path}/256/{z}/{x}/{y}/{color}/{smooth}_{snow}.png — color=2 is
// RainViewer's "Universal Blue" scheme, and snow=1 renders snow in a
// visually distinct blue/purple range from the green-yellow-red rain ramp.
// Free tier caps at zoom 7 (set as maxzoom below; MapLibre stretches those
// tiles at deeper zoom, which is fine — radar resolution wouldn't show
// more detail anyway). The exact RGB split between "snow blue" and "rain"
// below is a reasonable starting heuristic, not a value from an official
// RainViewer color table (I couldn't find one to verify against) — likely
// worth eyeballing against a real snowy tile and adjusting.
// ============================================================
let weatherTileUrl = null;
let weatherProtocolReady = false;

function initWeatherProtocol() {
  if (weatherProtocolReady) return;
  weatherProtocolReady = true;
  try {
    fetch('https://api.rainviewer.com/public/weather-maps.json')
      .then((res) => res.json())
      .then((data) => {
        const frame = data.radar && data.radar.past && data.radar.past[data.radar.past.length - 1];
        if (!frame) throw new Error('no radar frames in RainViewer response');
        weatherTileUrl = `${data.host}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`;
        console.log('GALLERY: weather tile template resolved:', weatherTileUrl);
        addWeatherLayerIfReady();
      })
      .catch((err) => console.warn('GALLERY: RainViewer weather-maps.json fetch failed —', err.message));

    maplibregl.addProtocol('rainviewer', async (params) => {
      const realUrl = params.url.replace('rainviewer://', '');
      const res = await fetch(realUrl);
      if (!res.ok) throw new Error('tile fetch failed: ' + res.status);
      const blob = await res.blob();
      const bitmap = await createImageBitmap(blob);
      const w = bitmap.width, h = bitmap.height;

      // read the source only to sample it at a coarse grid — not to process
      // its pixels directly. What actually gets drawn is our own shape:
      // a few thin concentric rings per active cell, contour-map style.
      // Overlapping rings from neighboring active cells weave into a
      // topographic-looking mesh, denser (so visually stronger) wherever
      // more neighboring cells overlap — an intensity cue without needing
      // real contour math. Thin lines also cover far less area than a
      // filled blob, so hillshade shows through the gaps naturally.
      const srcCanvas = new OffscreenCanvas(w, h);
      const sctx = srcCanvas.getContext('2d');
      sctx.drawImage(bitmap, 0, 0);
      const src = sctx.getImageData(0, 0, w, h).data;

      const CELL = 14; // sampling grid spacing, in source pixels — coarser than the raw data on purpose
      const RADIUS = CELL * 1.7; // ring spread — overlaps neighboring cells so the mesh stays continuous, not separate isolated circles
      const RING_RADII = [0.4, 0.7, 1.0]; // fractions of RADIUS — a few concentric bands per cell, like elevation contour intervals
      const RING_WIDTH = 1.1;
      const OCEAN = [185, 221, 226]; // matches --ocean, per "make rain that same blue"

      const out = new OffscreenCanvas(w, h);
      const octx = out.getContext('2d');
      octx.lineWidth = RING_WIDTH;
      for (let y = 0; y < h; y += CELL) {
        for (let x = 0; x < w; x += CELL) {
          const i = (y * w + x) * 4;
          if (src[i + 3] < 10) continue; // no signal at this sample point
          const isSnow = src[i + 2] > 130 && src[i] < 110; // snow renders in RainViewer's blue/purple range, distinct from the green-yellow-red rain ramp
          const cx = x + CELL / 2, cy = y + CELL / 2;
          octx.strokeStyle = isSnow ? 'rgba(255,255,255,0.8)' : `rgba(${OCEAN[0]},${OCEAN[1]},${OCEAN[2]},0.75)`;
          for (const frac of RING_RADII) {
            octx.beginPath();
            octx.arc(cx, cy, RADIUS * frac, 0, Math.PI * 2);
            octx.stroke();
          }
        }
      }
      const outBlob = await out.convertToBlob({ type: 'image/png' });
      return { data: await outBlob.arrayBuffer() };
    });
  } catch (err) {
    console.warn('GALLERY: weather protocol setup failed —', err.message);
  }
}

function addWeatherLayerIfReady() {
  if (!terrainMapInstance || !weatherTileUrl) return;
  if (terrainMapInstance.getSource('weather')) return; // already added
  const addIt = () => {
    terrainMapInstance.addSource('weather', {
      type: 'raster',
      tiles: [`rainviewer://${weatherTileUrl}`],
      tileSize: 256, maxzoom: 7,
      attribution: 'Weather: <a href="https://rainviewer.com" target="_blank">RainViewer</a>',
    });
    terrainMapInstance.addLayer({ id: 'weather', type: 'raster', source: 'weather', paint: { 'raster-opacity': 0.8, 'raster-resampling': 'linear' } });
  };
  if (terrainMapInstance.isStyleLoaded()) addIt(); else terrainMapInstance.once('load', addIt);
}

let terrainMapInstance = null;
function initTerrainMap() {
  if (terrainMapInstance) return terrainMapInstance;
  initWeatherProtocol();
  terrainMapInstance = new maplibregl.Map({
    container: 'terrainMap',
    style: {
      version: 8,
      sources: {
        // Mapterhorn — the terrain source MapLibre's own official 3D
        // Terrain example uses. Faster and higher-res (512px) than the AWS
        // Terrarium tiles tried before, which are documented as slow to
        // fetch directly from a browser. Two separate source entries
        // pointing at the same TileJSON, matching the official example's
        // own pattern for improved render quality (terrain mesh + hillshade
        // drawn from independent caches instead of sharing one).
        terrainSource: { type: 'raster-dem', url: 'https://tiles.mapterhorn.com/tilejson.json' },
        hillshadeSource: { type: 'raster-dem', url: 'https://tiles.mapterhorn.com/tilejson.json' },
        // lakes/rivers reuse the exact same GeoJSON already fetched for the
        // flat map (see LAKES_URL/RIVERS_URL) — no second data source, just
        // fed to MapLibre as plain in-memory GeoJSON
        lakesGeo: { type: 'geojson', data: lakes || { type: 'FeatureCollection', features: [] } },
        riversGeo: { type: 'geojson', data: rivers || { type: 'FeatureCollection', features: [] } },
      },
      layers: [
        // color-relief: colors the terrain BY ELEVATION straight from the
        // DEM — ocean blue at/below sea level, light green through olive
        // going up. This is the real fix for both "no ocean color" and
        // "add greenery": one elevation-driven color ramp, not a raster
        // photo or a guessed threshold.
        {
          id: 'color-relief', type: 'color-relief', source: 'terrainSource',
          paint: {
            'color-relief-color': [
              'interpolate', ['linear'], ['elevation'],
              -200, '#8fc3d6',   // below sea level (bathymetry in the DEM) — matches --water
              0, '#b9dde2',      // sea level — matches the flat map's --ocean exactly
              5, '#a9d089',      // coast, real green starts immediately
              300, '#8fbd68',    // lowland — plentiful, saturated green like a standard hypsometric ramp
              900, '#a8c478',    // mid elevation, green easing toward olive
              1800, '#c9b989',   // transition band, olive into beige
              2800, '#ecd191',   // the actual flat-map --land beige
              4200, '#f5e6c0',   // peaks, lightest tone in the palette
            ],
          },
        },
        {
          id: 'hillshade', type: 'hillshade', source: 'hillshadeSource',
          paint: {
            // several light beige tones instead of one flat shadow color —
            // reads as varied terrain texture rather than a uniform tint
            'hillshade-shadow-color': '#d9c297',
            'hillshade-highlight-color': '#faf3e0',
            'hillshade-accent-color': '#e8d4a0',
            'hillshade-exaggeration': 0.35,
          },
        },
        { id: 'lakes', type: 'fill', source: 'lakesGeo', paint: { 'fill-color': '#b9dde2' } },
        { id: 'rivers', type: 'line', source: 'riversGeo', paint: { 'line-color': '#8fc3d6', 'line-width': 1.2 } },
      ],
      terrain: { source: 'terrainSource', exaggeration: 1 },
      sky: { 'sky-color': '#1d1610', 'sky-horizon-blend': 0.5, 'horizon-color': '#3a2c1c', 'horizon-fog-blend': 0.6 },
    },
    attributionControl: { compact: true },
    maxPitch: 75,
    dragRotate: true,
    touchPitch: true,
  });
  terrainMapInstance.on('load', () => { addWeatherLayerIfReady(); });
  terrainMapInstance.on('zoom', autoExitCheck);
  return terrainMapInstance;
}

// inverse of equivalentMapLibreZoom: given a MapLibre zoom + latitude,
// what d3 transform.k gives the same real-world meters/pixel
function equivalentD3Zoom(mapLibreZoom, lat) {
  const metersPerPxAtK1 = (Math.PI * 6371000) / discRadius;
  const metersPerPxNow = 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, mapLibreZoom);
  return metersPerPxAtK1 / metersPerPxNow;
}

// positions the flat map so whatever MapLibre is currently centered on
// lands at the center of the flat map's viewport too, at the equivalent
// zoom/rotation — this is what makes exiting 3D feel like a continuation
// instead of a hard reset
function syncFlatMapToMapLibre() {
  rotationGamma = -terrainMapInstance.getBearing(); // preserve whatever rotation happened in 3D (entry used bearing: -rotationGamma, so this is its inverse)
  const c = terrainMapInstance.getCenter();
  // capped safely below HANDOFF_K — otherwise exiting could land the flat
  // map's zoom still above the entry threshold, which its own zoom handler
  // would see immediately and snap straight back into 3D: a flicker loop
  // that looks like an unwanted snap and interrupts whatever gesture is in
  // progress on the canvas underneath
  const k = Math.max(0.25, Math.min(HANDOFF_K * 0.8, equivalentD3Zoom(terrainMapInstance.getZoom(), c.lat)));
  const base = projection([c.lng, c.lat]);
  if (!base) return;
  const rad = rotationGamma * Math.PI / 180;
  const dx = base[0] - discCenter.x, dy = base[1] - discCenter.y;
  const rx = dx * Math.cos(rad) - dy * Math.sin(rad) + discCenter.x;
  const ry = dx * Math.sin(rad) + dy * Math.cos(rad) + discCenter.y;
  const rect = canvas.getBoundingClientRect();
  const tx = rect.width / 2 - k * rx, ty = rect.height / 2 - k * ry;
  d3.select(canvas).call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(k));
}

const EXIT_ZOOM = 6.5; // MapLibre zoom that triggers handoff back — roughly US-state scale
const EXIT_GRACE_MS = 400; // ignore the very first zoom event or two right after entry/jumpTo settling
const TREND_WINDOW_MS = 500; // exit is judged against zoom from this long ago, not the single previous event — absorbs gesture restarts/jitter that were eating pinch progress
let enteredAt = 0;
let zoomHistory = []; // rolling [{t, z}, ...] samples, trimmed to TREND_WINDOW_MS

async function enter3D(lon, lat) {
  if (in3D) return;
  in3D = true;
  await loadMapLibre();
  const map3d = initTerrainMap();
  const zoom = Math.max(3, equivalentMapLibreZoom(lat)); // matches where you actually were on the flat map — no artificial floor
  zoomHistory = [{ t: performance.now(), z: zoom }];
  enteredAt = performance.now(); // stamped after loadMapLibre() resolves, so the grace period covers actual settling time, not library-fetch time
  map3d.jumpTo({ center: [lon, lat], zoom, pitch: 60, bearing: -rotationGamma });
  document.getElementById('terrainMap').classList.add('active');
  canvas.classList.add('faded');
  backBtn.classList.add('visible');
  setTimeout(() => map3d.resize(), 50); // container was display:none-adjacent (opacity 0); MapLibre needs a resize once it's actually laid out
}

function autoExitCheck() {
  if (!in3D) return;
  const now = performance.now();
  const z = terrainMapInstance.getZoom();
  zoomHistory.push({ t: now, z });
  while (zoomHistory.length > 1 && now - zoomHistory[0].t > TREND_WINDOW_MS) zoomHistory.shift();
  if (now - enteredAt < EXIT_GRACE_MS) return; // still settling from entry — ignore
  const oldest = zoomHistory[0];
  if (z < EXIT_ZOOM && z < oldest.z) exit3D(); // below threshold AND net lower than ~500ms ago — a real sustained zoom-out, not gesture-restart noise
}

function exit3D() {
  if (!in3D) return;
  in3D = false;
  syncFlatMapToMapLibre();
  document.getElementById('terrainMap').classList.remove('active');
  canvas.classList.remove('faded');
  backBtn.classList.remove('visible');
  draw();
}
const backBtn = document.getElementById('backBtn');
backBtn.onclick = exit3D;

// ---- hover / tap tooltips (accounts for current pan/zoom) ----
function screenPointFor(geo) {
  const p = project(geo);
  if (!p) return null;
  const base = projection(p); // base (gamma=0) projected coordinates
  if (!base) return null;
  // apply the same gamma rotation around discCenter that draw() applies via
  // ctx.rotate(), so hit-testing matches what's actually on screen
  const rad = rotationGamma * Math.PI / 180;
  const dx = base[0] - discCenter.x, dy = base[1] - discCenter.y;
  const rx = dx * Math.cos(rad) - dy * Math.sin(rad) + discCenter.x;
  const ry = dx * Math.sin(rad) + dy * Math.cos(rad) + discCenter.y;
  return [transform.x + transform.k * rx, transform.y + transform.k * ry];
}
function handlePointer(mx, my) {
  let best = null, bestDist = 16;
  for (const ev of events) {
    for (const [geo, kind] of [[ev.sentGeo, 'sent'], [ev.downloadGeo, 'received']]) {
      const s = screenPointFor(geo);
      if (!s) continue;
      const d = Math.hypot(s[0] - mx, s[1] - my);
      if (d < bestDist) { bestDist = d; best = { ev, kind, geo }; }
    }
  }
  if (best) {
    const { ev, kind, geo } = best;
    const place = [geo.city, geo.region, geo.country].filter(Boolean).join(', ') || 'unknown location';
    let html = `<b>${kind === 'sent' ? 'sent from' : 'received in'}</b> ${place}`;
    if (ev.deliveryMs != null) {
      const secs = Math.round(ev.deliveryMs / 1000);
      html += `<br>delivered in ${secs < 60 ? secs + 's' : Math.round(secs/60) + 'm'}`;
    } else {
      html += `<br><span style="color:var(--ember)">in flight…</span>`;
    }
    tooltipEl.innerHTML = html;
    tooltipEl.style.display = 'block';
    const rect = canvas.getBoundingClientRect();
    tooltipEl.style.left = Math.min(mx + 14, rect.width - 230) + 'px';
    tooltipEl.style.top = Math.max(my - 10, 4) + 'px';
  } else {
    tooltipEl.style.display = 'none';
  }
}
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  handlePointer(e.clientX - rect.left, e.clientY - rect.top);
});
canvas.addEventListener('mouseleave', () => { tooltipEl.style.display = 'none'; });

// ---- polling, with a real reason shown on failure instead of a vague message ----
async function poll() {
  try {
    const res = await fetch(`${WORKER_BASE_URL}/gallery/events?limit=200`);
    if (!res.ok) {
      statusEl.textContent = `worker returned ${res.status} — check it's deployed`;
      statusEl.classList.add('error'); statusEl.classList.remove('live');
      return;
    }
    const data = await res.json();
    events = data.events || [];
    countEl.textContent = events.length;
    emptyEl.style.display = events.length === 0 ? 'flex' : 'none';
    statusEl.textContent = 'live';
    statusEl.classList.add('live'); statusEl.classList.remove('error');
  } catch (err) {
    console.error('gallery: poll failed', err);
    statusEl.textContent = 'network error — retrying… (see console for detail)';
    statusEl.classList.add('error'); statusEl.classList.remove('live');
  }
}

function tick() {
  if (!twist && Math.abs(spinVelocity) > 0.01) {
    rotationGamma += spinVelocity;
    spinVelocity *= 0.976; // friction, decay rate reduced 2.5x from before — spins longer before settling
  }
  draw();
  requestAnimationFrame(tick);
}

(async function init() {
  window.addEventListener('resize', resize);
  const [landData, lakeData, riverData] = await Promise.all([
    loadGeo(LAND_URL, true, 'land'),
    loadGeo(LAKES_URL, false),
    loadGeo(RIVERS_URL, false),
  ]);
  land = landData; lakes = lakeData; rivers = riverData;
  resize();
  await poll();
  setInterval(poll, POLL_MS);
  tick();
})();
</script>
</body>
