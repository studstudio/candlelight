// ============================================================
// FLAT-TO-3D HANDOFF
// Pinch/zoom in far enough on the flat azimuthal map and it crossfades
// into a real MapLibre 3D terrain view, positioned at whatever point was
// at the center of the screen. This isn't a continuous reprojection (that
// would need the two engines to share a coordinate system, which they
// don't) — it's a deliberate hand-off at a chosen threshold, timed for
// where the difference between azimuthal equidistant and a standard
// projection becomes visually irrelevant anyway.
// ============================================================
const HANDOFF_K = 5; // d3 zoom scale that triggers the crossfade into 3D
let in3D = false;

// inverse of screenPointFor(): given a screen pixel, find the lon/lat
// currently shown there — undoes pan/zoom, then gamma rotation, then the
// (fixed, gamma=0) projection itself
function lonLatAtScreenPoint(sx, sy) {
  const baseX = (sx - transform.x) / transform.k;
  const baseY = (sy - transform.y) / transform.k;
  const rad = -rotationGamma * Math.PI / 180;
  const dx = baseX - discCenter.x, dy = baseY - discCenter.y;
  const px = dx * Math.cos(rad) - dy * Math.sin(rad) + discCenter.x;
  const py = dx * Math.sin(rad) + dy * Math.cos(rad) + discCenter.y;
  return projection.invert([px, py]); // [lon, lat] or null
}

// converts the flat map's current zoom into an equivalent MapLibre zoom
// level, via actual real-world meters/pixel — not an arbitrary tuned
// number. discRadius (CSS px) represents pi * earthRadius (meters), since
// that's the edge of an azimuthal equidistant world map.
function equivalentMapLibreZoom(lat) {
  const metersPerPxAtK1 = (Math.PI * 6371000) / discRadius;
  const metersPerPxNow = metersPerPxAtK1 / transform.k;
  return Math.log2(156543.03392 * Math.cos(lat * Math.PI / 180) / metersPerPxNow);
}

// ============================================================
// WEATHER: RainViewer's free public radar API, with snow and rain given
// distinct client-side styling — soft white for snow, faint --ocean blue
// for rain — since RainViewer's own tiles just render both as one
// continuous color ramp. There's no MapLibre style-spec paint property
// that can do this kind of per-pixel conditional recoloring on a plain
// raster layer (that needs actual pixel access), so this registers a
// custom maplibregl.addProtocol handler that intercepts each tile,
// recolors + softly blurs it on an OffscreenCanvas, and hands the result
// back as a normal raster tile.
//
// This used to convert classified pixels into thousands of GeoJSON point
// features (one 'circle' per sample) instead. That looked fine zoomed out
// (dense clusters happened to read as organic texture) but fell apart
// zoomed in — the source data is capped at zoom 7, so points sampled from
// it don't get any denser as you zoom past that, they just look sparse —
// and manually recomputing + refetching + rebuilding that whole point set
// on every 'moveend' is real synchronous work that visibly popped in
// tile-by-tile ("loading in blocks"). A raster tile sidesteps both: past
// the source's own maxzoom (7, RainViewer's free-tier cap) MapLibre just
// bilinear-upscales the last real tile instead of running out of dots, so
// combined with the blur baked into each tile below it reads as a
// continuous soft cloud wash at any zoom instead of thinning out — and
// MapLibre's own tile loader handles viewport culling, caching, and a
// built-in cross-fade between tiles natively (raster-fade-duration below),
// instead of our own bounds math + Promise.all + full-GeoJSON-replace.
//
// Real, verified API: https://api.rainviewer.com/public/weather-maps.json
// gives {host, radar:{past:[...]}}; tiles are
// {host}{path}/256/{z}/{x}/{y}/{color}/{smooth}_{snow}.png — color=2 is
// RainViewer's "Universal Blue" scheme, and snow=1 renders snow pixels
// using a distinct sub-palette from rain pixels (RainViewer classifies
// this server-side from the underlying radar data, not something we
// compute). Snow vs rain classification below is now built directly from
// RainViewer's own published Universal Blue color table
// (rainviewer.com/api/color-schemes.html — CSV linked there), not a
// guessed RGB threshold: light rain is a similar cyan/blue to snow in
// this palette (they only cleanly separate at higher intensity, where
// rain shifts to yellow/orange/red and snow stays blue), so a simple
// "blue high, red low" threshold — the previous approach — reliably
// mistook ordinary light rain for snow. This instead does per-pixel
// nearest-color matching against the real rain and snow palettes
// (dBZ 0–40 from the color table, RGB only). Doing that per-pixel with a
// direct distance search would be far too slow for a 256px tile, so it's
// baked ONCE into a small quantized lookup table (5 bits/channel, 32768
// entries — the nested loop below runs a single time at startup, not per
// tile) and every pixel then costs one array lookup instead of ~80
// distance calculations.
// ============================================================
let weatherTileUrl = null;
let weatherReady = false;
const WEATHER_Z = 7; // RainViewer's free-tier max
const WEATHER_PROTOCOL = 'weatherprecip';

// RainViewer's Universal Blue color table, RGB only, dBZ 0–40 (higher
// dBZ is extreme-intensity territory and doesn't affect classification
// in any realistic case)
const RAIN_PALETTE_RGB = [[130,123,105],[133,125,106],[136,128,108],[139,130,109],[142,133,111],[146,136,113],[158,147,117],[170,158,121],[182,169,126],[194,180,130],[206,192,135],[210,196,139],[214,200,143],[218,204,147],[222,208,151],[136,221,238],[108,209,235],[81,197,232],[54,186,229],[27,174,226],[0,163,224],[0,154,213],[0,145,202],[0,136,191],[0,127,180],[0,119,170],[0,112,163],[0,105,156],[0,98,149],[0,91,142],[0,85,136],[0,81,128],[0,78,120],[0,74,112],[0,71,104],[255,238,0],[255,224,0],[255,210,0],[255,197,0],[255,183,0],[255,170,0]];
const SNOW_PALETTE_RGB = [[199,255,255],[198,255,255],[197,255,255],[196,255,255],[195,255,255],[195,255,255],[194,255,255],[193,255,255],[192,255,255],[191,255,255],[191,255,255],[184,248,255],[178,242,255],[171,235,255],[165,229,255],[159,223,255],[152,216,255],[146,210,255],[139,203,255],[133,197,255],[127,191,255],[120,184,255],[114,178,255],[107,171,255],[101,165,255],[95,159,255],[91,155,255],[88,152,255],[85,149,255],[82,146,255],[79,143,255],[75,139,255],[72,136,255],[69,133,255],[66,130,255],[63,127,255],[59,123,255],[56,120,255],[53,117,255],[50,114,255],[47,111,255]];

let snowClassifyLUT = null;
function buildSnowClassifyLUT() {
  const BITS = 5, LEVELS = 1 << BITS; // 32 levels/channel, 32768 entries total
  const lut = new Uint8Array(LEVELS * LEVELS * LEVELS);
  for (let ri = 0; ri < LEVELS; ri++) {
    for (let gi = 0; gi < LEVELS; gi++) {
      for (let bi = 0; bi < LEVELS; bi++) {
        const r = ri << (8 - BITS), g = gi << (8 - BITS), b = bi << (8 - BITS);
        let bestRain = Infinity, bestSnow = Infinity;
        for (const [pr, pg, pb] of RAIN_PALETTE_RGB) { const d = (r - pr) ** 2 + (g - pg) ** 2 + (b - pb) ** 2; if (d < bestRain) bestRain = d; }
        for (const [pr, pg, pb] of SNOW_PALETTE_RGB) { const d = (r - pr) ** 2 + (g - pg) ** 2 + (b - pb) ** 2; if (d < bestSnow) bestSnow = d; }
        lut[(ri << (2 * BITS)) | (gi << BITS) | bi] = bestSnow < bestRain ? 1 : 0;
      }
    }
  }
  return lut;
}
function isSnowPixel(r, g, b) {
  if (!snowClassifyLUT) snowClassifyLUT = buildSnowClassifyLUT(); // built once, lazily, off the critical path until the first tile actually needs it
  const BITS = 5;
  return snowClassifyLUT[((r >> (8 - BITS)) << (2 * BITS)) | ((g >> (8 - BITS)) << BITS) | (b >> (8 - BITS))] === 1;
}

async function weatherProtocolHandler(params) {
  // params.url looks like "weatherprecip://{z}/{x}/{y}" with the
  // placeholders already resolved by MapLibre's own tile URL templating
  const [z, x, y] = params.url.replace(`${WEATHER_PROTOCOL}://`, '').split('/');
  const url = weatherTileUrl.replace('{z}', z).replace('{x}', x).replace('{y}', y);
  const res = await fetch(url);
  if (!res.ok) throw new Error(`weather tile ${res.status}`);
  const bitmap = await createImageBitmap(await res.blob());
  const w = bitmap.width, h = bitmap.height;

  // pass 1: classify + recolor every pixel in place
  const recolor = new OffscreenCanvas(w, h);
  const rctx = recolor.getContext('2d');
  rctx.drawImage(bitmap, 0, 0);
  const img = rctx.getImageData(0, 0, w, h);
  const data = img.data;
  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] < 10) { data[i + 3] = 0; continue; } // no signal here
    const isSnow = isSnowPixel(data[i], data[i + 1], data[i + 2]);
    if (isSnow) { data[i] = 255; data[i + 1] = 255; data[i + 2] = 255; }
    else { data[i] = 0x69; data[i + 1] = 0xce; data[i + 2] = 0xf1; } // matches --ocean
    data[i + 3] = Math.min(255, data[i + 3] * 0.85); // slightly translucent
  }
  rctx.putImageData(img, 0, 0);

  // pass 2: soft blur so edges read as an organic cloud wash rather than
  // a hard raster boundary — this is what keeps it looking good even when
  // MapLibre upscales this same tile well past its native zoom 7
  const out = new OffscreenCanvas(w, h);
  const octx = out.getContext('2d');
  octx.filter = 'blur(3px)';
  octx.drawImage(recolor, 0, 0);

  const outBlob = await out.convertToBlob({ type: 'image/png' });
  return { data: await outBlob.arrayBuffer() };
}

function initWeatherProtocol() {
  if (weatherReady) return;
  weatherReady = true;
  maplibregl.addProtocol(WEATHER_PROTOCOL, weatherProtocolHandler);
  fetch('https://api.rainviewer.com/public/weather-maps.json')
    .then((res) => res.json())
    .then((data) => {
      const frame = data.radar && data.radar.past && data.radar.past[data.radar.past.length - 1];
      if (!frame) throw new Error('no radar frames in RainViewer response');
      weatherTileUrl = `${data.host}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`;
      console.log('GALLERY: weather tile template resolved:', weatherTileUrl);
      })
    .catch((err) => console.warn('GALLERY: RainViewer weather-maps.json fetch failed —', err.message));
}

function addWeatherLayerIfReady() {
  if (!terrainMapInstance || !weatherTileUrl) return;
  if (terrainMapInstance.getSource('weatherPrecip')) return; // already added, tiles refresh on their own as MapLibre pans/zooms
  const addIt = () => {
    terrainMapInstance.addSource('weatherPrecip', {
      type: 'raster',
      tiles: [`${WEATHER_PROTOCOL}://{z}/{x}/{y}`],
      tileSize: 256,
      minzoom: 0,
      maxzoom: WEATHER_Z,
      attribution: 'Weather: <a href="https://rainviewer.com" target="_blank">RainViewer</a>',
    });
    terrainMapInstance.addLayer({
      id: 'weatherPrecip', type: 'raster', source: 'weatherPrecip',
      paint: {
        // full opacity at/below the source's own native resolution (zoom
        // 7), fading to fully transparent by zoom 8 — reads as flying
        // up through and past the cloud layer right as you approach it,
        // rather than lingering as a wash for many more zoom levels
        'raster-opacity': ['interpolate', ['linear'], ['zoom'], 7, 0.85, 8, 0],
        'raster-fade-duration': 300, // cross-fades new tiles in smoothly instead of popping in block-by-block
      },
    });
  };
  if (terrainMapInstance.isStyleLoaded()) addIt(); else terrainMapInstance.once('load', addIt);
}

let nightProtocolInstalled = false;
let environmentalProtocolInstalled = false;
let snowTerrainProtocolInstalled = false;
let climateProtocolInstalled = false;
const ENVIRONMENT_RADIATION_Z = 6;
const ENVIRONMENT_CLIMATE_Z = 5;
const ENVIRONMENT_CLIMATE_TIME = '2020-07-01';
const ENVIRONMENT_RADIATION_TIME = '2020-07-01';
const ENVIRONMENT_CANOPY_LAYER = 'GEDI_ISS_L3_Canopy_Height_Mean_RH100_201904-202303';
const ENVIRONMENT_GEOLOGY_SERVICE = 'https://tiles.arcgis.com/tiles/tV7nu2LqSErotsj3/arcgis/rest/services/Orix_World_Experience_3D_WTL1/MapServer/export';
const ENVIRONMENT_GEOLOGY_SIZE = 2048;
const ENVIRONMENT_FLOW_SIZE = 2048;
// Agriculture is intentionally a material function, not a painted GIS layer.
// The first pass uses real WorldCover cropland extent plus terrain/climate to
// create field-scale *candidates*. Exact crop identity/field edges will be
// supplied by WorldCereal as the higher-resolution agricultural data path is
// wired in.
const AGRICULTURE_BASE_VERSION = 2;
const WORLDCEREAL_WMS = 'https://ewoc-rdm-api.iiasa.ac.at/geoserver/ows';
const WORLDCEREAL_CROP_LAYER = 'worldcereal_temporarycrops_2021';
const WORLDCEREAL_MAIZE_LAYER = 'worldcereal_maize_2021';
const WORLDCEREAL_WINTER_CEREALS_LAYER = 'worldcereal_wintercereals_2021';
const WORLDCEREAL_SPRING_CEREALS_LAYER = 'worldcereal_springcereals_2021';
const WORLDCEREAL_IRRIGATION_LAYER = 'worldcereal_activeirrigation_2021';
const ENVIRONMENT_TEMPERATURE_LAYER = 'MERRA2_2m_Air_Temperature_Monthly';
const ENVIRONMENT_EVAPORATION_LAYER = 'MERRA2_Evaporation_Land_Monthly';
const ENVIRONMENT_SOIL_LAYER = 'MERRA2_Soil_Water_Root_Zone_Monthly';
const ENVIRONMENT_VAPOR_LAYER = 'MERRA2_Total_Precipitable_Water_Vapor_Monthly';

function installEnvironmentalProtocols() {
  if (environmentalProtocolInstalled && snowTerrainProtocolInstalled && climateProtocolInstalled) return;
  environmentalProtocolInstalled = true;
  snowTerrainProtocolInstalled = true;
  climateProtocolInstalled = true;

  // NASA GIBS MERRA-2 incident shortwave over land. This is a real global
  // surface-radiation field, but we deliberately remap it to a very small
  // material shift instead of displaying the source palette as a heatmap.
  maplibregl.addProtocol('terrain-radiation', async (params, abortController) => {
    const [z0, x0, y0] = params.url.replace('terrain-radiation://', '').split('/').map(Number);
    const z = Math.min(z0, ENVIRONMENT_RADIATION_Z);
    const scale = Math.pow(2, z0 - z);
    const x = Math.floor(x0 / scale);
    const y = Math.floor(y0 / scale);
    const url = `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MERRA2_Incident_Shortwave_Over_Land_Monthly/default/${ENVIRONMENT_RADIATION_TIME}/GoogleMapsCompatible_Level${ENVIRONMENT_RADIATION_Z}/${z}/${y}/${x}.png`;
    const res = await fetch(url, { signal: abortController && abortController.signal });
    if (!res.ok) throw new Error(`NASA radiation tile ${res.status}`);
    const bitmap = await createImageBitmap(await res.blob());
    const size = bitmap.width;
    const canvas = new OffscreenCanvas(size, size);
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(bitmap, 0, 0);
    if (bitmap.close) bitmap.close();
    const img = ctx.getImageData(0, 0, size, size);
    const d = img.data;

    // Convert the source visualization to a restrained material signal.
    // The source is not shown directly: its luminance controls only the
    // strength of a warm/cool shift in the existing terrain palette.
    for (let i = 0; i < d.length; i += 4) {
      const a = d[i + 3];
      if (a < 10) { d[i + 3] = 0; continue; }
      const lum = (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
      const signal = Math.max(0, Math.min(1, (lum - 0.12) / 0.76));
      // Low-radiation land gets a cool/quiet mineral cast; high-radiation
      // land gets a barely warmer, sun-baked cast. Alpha is intentionally
      // low so terrain relief and hillshade remain visually dominant.
      const warm = signal * 0.72 + 0.14;
      d[i] = Math.round(70 + 105 * warm);
      d[i + 1] = Math.round(82 + 86 * (1 - Math.abs(signal - 0.5) * 1.25));
      d[i + 2] = Math.round(94 + 58 * (1 - signal));
      d[i + 3] = Math.round(255 * (0.095 + 0.16 * Math.abs(signal - 0.5) * 2));
    }
    ctx.putImageData(img, 0, 0);
    return { data: await (await canvas.convertToBlob({ type: 'image/png' })).arrayBuffer() };
  });

  // NASA MERRA-2 total precipitation. This is the first climate field: it
  // is deliberately rendered as a quiet material influence rather than a
  // visible precipitation map. Wet regions get a slightly cooler/deeper
  // material response; dry regions remain warmer/lighter.
  maplibregl.addProtocol('terrain-climate', async (params, abortController) => {
    const [z0, x0, y0] = params.url.replace('terrain-climate://', '').split('/').map(Number);
    const z = Math.min(z0, ENVIRONMENT_CLIMATE_Z);
    const scale = Math.pow(2, z0 - z);
    const x = Math.floor(x0 / scale);
    const y = Math.floor(y0 / scale);
    const url = `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MERRA2_Precipitation_Bias_Corrected_Monthly/default/${ENVIRONMENT_CLIMATE_TIME}/GoogleMapsCompatible_Level${ENVIRONMENT_CLIMATE_Z}/${z}/${y}/${x}.png`;
    const res = await fetch(url, { signal: abortController && abortController.signal });
    if (!res.ok) throw new Error(`NASA precipitation tile ${res.status}`);
    const bitmap = await createImageBitmap(await res.blob());
    const size = bitmap.width;
    const canvas = new OffscreenCanvas(size, size);
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(bitmap, 0, 0);
    if (bitmap.close) bitmap.close();
    const img = ctx.getImageData(0, 0, size, size);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const a = d[i + 3];
      if (a < 10) { d[i + 3] = 0; continue; }
      const lum = (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
      const wet = Math.max(0, Math.min(1, 1 - Math.pow(lum, 0.72)));
      // Very low-amplitude cool mineral tint. No source colors survive.
      d[i] = Math.round(64 + 34 * (1 - wet));
      d[i + 1] = Math.round(92 + 32 * (1 - wet));
      d[i + 2] = Math.round(82 + 34 * wet);
      d[i + 3] = Math.round(255 * (0.07 + 0.13 * wet));
    }
    ctx.putImageData(img, 0, 0);
    return { data: await (await canvas.convertToBlob({ type: 'image/png' })).arrayBuffer() };
  });

  // Snow is derived from the SAME global Mapterhorn DEM already used for
  // terrain. No second global white raster is needed. The mask combines
  // latitude, elevation and a smooth snowline so permanent ice sheets and
  // high mountain snow emerge from the terrain itself.
  maplibregl.addProtocol('snow-terrain', async (params, abortController) => {
    const [z, x, y] = params.url.replace('snow-terrain://', '').split('/').map(Number);
    const size = 512;
    const sourceUrl = `https://tiles.mapterhorn.com/${z}/${x}/${y}.webp`;
    const response = await fetch(sourceUrl, { signal: abortController && abortController.signal });
    if (!response.ok) {
      const blank = new OffscreenCanvas(size, size);
      const blob = await blank.convertToBlob({ type: 'image/png' });
      return { data: await blob.arrayBuffer() };
    }
    const bitmap = await createImageBitmap(await response.blob());
    const canvas = new OffscreenCanvas(size, size);
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(bitmap, 0, 0, size, size);
    if (bitmap.close) bitmap.close();
    const src = ctx.getImageData(0, 0, size, size).data;
    const out = ctx.createImageData(size, size);
    const decode = (i) => (src[i] * 256 + src[i + 1] + src[i + 2] / 256) - 32768;
    const n = Math.pow(2, z);
    const smoothstep = (a, b, v) => { const t = Math.max(0, Math.min(1, (v - a) / (b - a))); return t * t * (3 - 2 * t); };
    const latForPixel = (py) => {
      const q = Math.PI - 2 * Math.PI * (y + py / size) / n;
      return 180 / Math.PI * Math.atan(Math.sinh(q));
    };

    for (let py = 0; py < size; py++) {
      const lat = latForPixel(py);
      const absLat = Math.abs(lat);
      // Permanent ice-sheet rule: Greenland/Antarctica remain snow/ice even
      // where the generalized alpine snowline would otherwise be too high.
      const iceCap = (lat <= -60 || lat >= 70);
      // Generalized climatic snowline, falling with latitude. It is a soft
      // threshold rather than a hard contour, so mountain snow feathers into
      // the underlying terrain.
      const snowline = absLat < 20 ? 4700 :
                       absLat < 30 ? 4000 - (absLat - 20) * 45 :
                       absLat < 40 ? 3550 - (absLat - 30) * 75 :
                       absLat < 50 ? 2800 - (absLat - 40) * 105 :
                       absLat < 60 ? 1750 - (absLat - 50) * 105 :
                       absLat < 70 ? 700 - (absLat - 60) * 35 : 450;
      for (let px = 0; px < size; px++) {
        const si = (py * size + px) * 4;
        const e = decode(si);
        if (e <= 50) continue;
        let snow = smoothstep(snowline - 450, snowline + 350, e);
        if (iceCap) snow = Math.max(snow, 0.96);
        if (snow < 0.035) continue;

        // DEM-derived local shade, kept restrained so snow still reads white.
        const px0 = Math.max(0, px - 1), px1 = Math.min(size - 1, px + 1);
        const py0 = Math.max(0, py - 1), py1 = Math.min(size - 1, py + 1);
        const ex0 = decode((py * size + px0) * 4), ex1 = decode((py * size + px1) * 4);
        const ey0 = decode((py0 * size + px) * 4), ey1 = decode((py1 * size + px) * 4);
        const dx = (ex1 - ex0) * 0.5, dy = (ey1 - ey0) * 0.5;
        const shade = Math.max(0.72, Math.min(1.10, 0.94 - dx * 0.010 + dy * 0.010));
        const di = si;
        out.data[di] = Math.round(244 * shade);
        out.data[di + 1] = Math.round(248 * shade);
        out.data[di + 2] = Math.round(250 * shade);
        out.data[di + 3] = Math.round(255 * Math.min(0.92, snow));
      }
    }
    ctx.putImageData(out, 0, 0);
    return { data: await (await canvas.convertToBlob({ type: 'image/png' })).arrayBuffer() };
  });
}
let nightGlowLoading = false;
let nightGlowReady = false;
let nightGlowRequestSerial = 0;
const NIGHT_GLOW_Z = 8;
const NIGHT_GLOW_TILE_SIZE = 256;
const NIGHT_GLOW_MAX_POINTS = 35000;

function nightGlowTileX(lon) {
  const n = 1 << NIGHT_GLOW_Z;
  return Math.max(0, Math.min(n - 1, Math.floor((lon + 180) / 360 * n)));
}
function nightGlowTileY(lat) {
  const n = 1 << NIGHT_GLOW_Z;
  const r = Math.max(-85.05112878, Math.min(85.05112878, lat)) * Math.PI / 180;
  return Math.max(0, Math.min(n - 1, Math.floor((1 - Math.asinh(Math.tan(r)) / Math.PI) / 2 * n)));
}
function nightGlowLonLat(px, py, tileX, tileY) {
  const n = 1 << NIGHT_GLOW_Z;
  const gx = tileX * NIGHT_GLOW_TILE_SIZE + px + 0.5;
  const gy = tileY * NIGHT_GLOW_TILE_SIZE + py + 0.5;
  const lon = gx / (n * NIGHT_GLOW_TILE_SIZE) * 360 - 180;
  const q = Math.PI - 2 * Math.PI * gy / (n * NIGHT_GLOW_TILE_SIZE);
  const lat = 180 / Math.PI * Math.atan(Math.sinh(q));
  return [lon, Math.max(-85.05112878, Math.min(85.05112878, lat))];
}

async function buildNightGlowGeoJSON(force=false) {
  if (!terrainMapInstance || !nightModeOn) return;
  if (nightGlowLoading && !force) return;
  const requestSerial = ++nightGlowRequestSerial;
  nightGlowLoading = true;
  try {
    const b = terrainMapInstance.getBounds();
    const west = b.getWest(), east = b.getEast(), north = b.getNorth(), south = b.getSouth();
    const n = 1 << NIGHT_GLOW_Z;
    const x0 = nightGlowTileX(west), x1 = nightGlowTileX(east);
    const y0 = nightGlowTileY(north), y1 = nightGlowTileY(south);
    const xs=[];
    if (east - west >= 359) { for(let x=0;x<n;x++) xs.push(x); }
    else if (west > east) { for(let x=x0;x<n;x++) xs.push(x); for(let x=0;x<=x1;x++) xs.push(x); }
    else { for(let x=x0;x<=x1;x++) xs.push(x); }
    const ys=[]; for(let y=y0;y<=y1;y++) ys.push(y);
    const tiles=[];
    for(const x of xs) for(const y of ys) tiles.push({x,y});
    if (tiles.length > 64) return;

    const results = await Promise.all(tiles.map(async ({x,y})=>{
      const url=`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_Night_Lights/default/default/GoogleMapsCompatible_Level8/8/${y}/${x}.png`;
      const r=await fetch(url,{cache:'force-cache'});
      if(!r.ok) throw new Error(`VIIRS Level-8 tile ${r.status}`);
      const bmp=await createImageBitmap(await r.blob());
      const c=new OffscreenCanvas(NIGHT_GLOW_TILE_SIZE,NIGHT_GLOW_TILE_SIZE);
      const ctx=c.getContext('2d',{willReadFrequently:true});
      ctx.drawImage(bmp,0,0); if(bmp.close) bmp.close();
      return {x,y,img:ctx.getImageData(0,0,NIGHT_GLOW_TILE_SIZE,NIGHT_GLOW_TILE_SIZE).data};
    }));
    if(requestSerial!==nightGlowRequestSerial || !nightModeOn) return;

    // Reinterpret VIIRS as a sparse astronomical-style point field.  We do
    // NOT render the source pixels and we do NOT use a heatmap.  Each emitted
    // point is a local radiance maximum, so cities become collections of tiny
    // crisp lights instead of soft geographic blobs.
    const candidates=[];
    for(const tile of results){
      const d=tile.img;
      for(let py=3;py<253;py+=2){
        for(let px=3;px<253;px+=2){
          const i=(py*256+px)*4;
          const lum=(0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2])/255;
          const signal=Math.max(0,Math.min(1,(lum-0.055)/0.50));
          if(signal<0.045) continue;
          let isPeak=true;
          let neighborhoodMax=0;
          for(let oy=-3;oy<=3 && isPeak;oy+=3){
            for(let ox=-3;ox<=3;ox+=3){
              if(!ox && !oy) continue;
              const ni=((py+oy)*256+(px+ox))*4;
              const nl=(0.2126*d[ni]+0.7152*d[ni+1]+0.0722*d[ni+2])/255;
              if(nl>lum*0.97){ isPeak=false; break; }
              neighborhoodMax=Math.max(neighborhoodMax,nl);
            }
          }
          if(!isPeak) continue;
          const intensity=Math.pow(signal,1.18);
          candidates.push({x:tile.x,y:tile.y,px,py,intensity});
        }
      }
    }
    candidates.sort((a,b)=>b.intensity-a.intensity);
    const features=[];
    const occupied=[];
    // Screen-like geographic suppression prevents a bright urban patch from
    // becoming a carpet of points while preserving separate city centers.
    for(const p of candidates){
      if(features.length>=9000) break;
      const coord=nightGlowLonLat(p.px,p.py,p.x,p.y);
      let tooClose=false;
      for(let j=Math.max(0,occupied.length-80);j<occupied.length;j++){
        const q=occupied[j];
        const dx=(coord[0]-q[0])*Math.cos(coord[1]*Math.PI/180);
        const dy=coord[1]-q[1];
        if(dx*dx+dy*dy < 0.00035*0.00035){ tooClose=true; break; }
      }
      if(tooClose) continue;
      occupied.push(coord);
      features.push({type:'Feature',geometry:{type:'Point',coordinates:coord},properties:{intensity:p.intensity}});
    }
    const data={type:'FeatureCollection',features};
    let src=terrainMapInstance.getSource('nightGlow');
    if(src) src.setData(data);
    else terrainMapInstance.addSource('nightGlow',{type:'geojson',data,attribution:'Night lights: NASA VIIRS / GIBS'});

    const basePaint={
      'circle-color':['interpolate',['linear'],['get','intensity'],0.05,'#d58b4a',0.22,'#e4a45d',0.55,'#f3c27d',1,'#fff0c9'],
      'circle-opacity':['interpolate',['linear'],['get','intensity'],0.05,0.38,0.22,0.55,0.55,0.72,1,0.90],
      'circle-radius':['interpolate',['linear'],['get','intensity'],0.05,0.65,0.22,0.85,0.55,1.15,1,1.65],
      'circle-blur':0.08
    };
    const haloPaint={
      'circle-color':'#f0b76c',
      'circle-opacity':['interpolate',['linear'],['get','intensity'],0.05,0.025,0.22,0.045,0.55,0.075,1,0.11],
      'circle-radius':['interpolate',['linear'],['get','intensity'],0.05,2.2,0.22,3.0,0.55,4.2,1,5.5],
      'circle-blur':0.82
    };
    if(!terrainMapInstance.getLayer('nightGlowHalo')) terrainMapInstance.addLayer({id:'nightGlowHalo',type:'circle',source:'nightGlow',minzoom:0,maxzoom:22,paint:haloPaint,layout:{visibility:'visible'}});
    else for(const [k,v] of Object.entries(haloPaint)) terrainMapInstance.setPaintProperty('nightGlowHalo',k,v);
    if(!terrainMapInstance.getLayer('nightGlow')) terrainMapInstance.addLayer({id:'nightGlow',type:'circle',source:'nightGlow',minzoom:0,maxzoom:22,paint:basePaint,layout:{visibility:'visible'}});
    else for(const [k,v] of Object.entries(basePaint)) terrainMapInstance.setPaintProperty('nightGlow',k,v);
    nightGlowReady=true;
    console.log('gallery: VIIRS sparkle field ready',{tiles:tiles.length,points:features.length,zoom:terrainMapInstance.getZoom()});
  }catch(err){ console.error('gallery: VIIRS sparkle field FAILED',err); }
  finally{ nightGlowLoading=false; }
}

function installNightLightsProtocol() {
  if (nightProtocolInstalled) return;
  nightProtocolInstalled = true;

  // Keep the original raster protocol as a quiet fallback/source. The actual
  // night-mode rendering below uses a GPU additive luminance field so VIIRS
  // contributes brightness instead of depositing colored pixels over terrain.
  maplibregl.addProtocol('nightlights', async (params, abortController) => {
    const [z, x, y] = params.url.replace('nightlights://', '').split('/').map(Number);
    const safeZ = Math.min(z, 8);
    const scale = Math.pow(2, z - safeZ);
    const safeX = Math.floor(x / scale), safeY = Math.floor(y / scale);
    const url = `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_Night_Lights/default/default/GoogleMapsCompatible_Level8/${safeZ}/${safeY}/${safeX}.png`;
    const res = await fetch(url, { signal: abortController && abortController.signal });
    if (!res.ok) throw new Error(`NASA VIIRS night-light tile ${res.status}`);
    const bitmap = await createImageBitmap(await res.blob());
    const size = bitmap.width;
    const c = new OffscreenCanvas(size, size), ctx = c.getContext('2d', {willReadFrequently:true});
    ctx.drawImage(bitmap,0,0); if(bitmap.close) bitmap.close();
    const img=ctx.getImageData(0,0,size,size), d=img.data;
    for(let i=0;i<d.length;i+=4){
      const lum=(0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2])/255;
      const s=Math.pow(Math.max(0,Math.min(1,(lum-.10)/.62)),2.15);
      d[i]=255; d[i+1]=170; d[i+2]=82; d[i+3]=Math.round(255*s*.08);
    }
    ctx.putImageData(img,0,0);
    return {data:await(await c.convertToBlob({type:'image/png'})).arrayBuffer()};
  });

  // ------------------------------------------------------------
  // GPU NIGHT LUMINANCE FIELD
  // One low-frequency global VIIRS mosaic is uploaded as a texture and
  // accumulated additively by WebGL. This is intentionally not a raster
  // paint layer: the shader adds warm radiance to the framebuffer, so dark
  // terrain gets brighter where artificial light is present while existing
  // relief/color underneath remains visible. The field is deliberately
  // broad and smooth; VIIRS is a regional radiance product, not a street
  // light dataset, so we do not turn individual pixels into dots.
  // ------------------------------------------------------------
  // -------------------------------------------------------------------------
  // ENVIRONMENTAL TERRAIN MATERIAL — custom WebGL 3D drape
  // -------------------------------------------------------------------------
  // This is intentionally NOT a raster layer.  The environmental fields are
  // uploaded as scalar textures and sampled by a custom fragment shader while
  // the vertices are displaced from the same Mapterhorn DEM used by MapLibre's
  // terrain.  The native MapLibre terrain remains underneath, preserving all
  // camera/terrain mechanics; this layer contributes only material response.
  let terrainMaterialLayer = null;
  let terrainMaterialReady = false;
  let terrainMaterialLoading = false;
  let terrainMaterialProgram = null;
  let terrainMaterialTiles = [];
  let terrainMaterialTextures = null;
  let terrainMaterialLandMask = null;
  const MATERIAL_Z = 2; // 16 global tiles: deliberately broad environmental scale
  const MATERIAL_SAMPLES = 32;
  const MATERIAL_SIZE = 256;
  const MATERIAL_EARTH_CIRC = 40075016.68557849;
  const WORLDCOVER_WIDTH = 1536;
  const WORLDCOVER_HEIGHT = 612; // EPSG:4326 bbox -180,-60,180,83
  const WORLDCOVER_MIN_LAT = -60.0;
  const WORLDCOVER_MAX_LAT = 83.0;

  function materialDecodeDem(r,g,b){ return (r * 256 + g + b / 256) - 32768; }
  function materialMercatorY(lat){
    const clamped = Math.max(-85.05112878, Math.min(85.05112878, lat));
    const rad = clamped * Math.PI / 180;
    return (180 - (180 / Math.PI * Math.log(Math.tan(Math.PI/4 + rad/2)))) / 360;
  }
  function materialLatFromY(y){
    const q = Math.PI - 2 * Math.PI * y;
    return 180 / Math.PI * Math.atan(Math.sinh(q));
  }
  function materialZFromElevation(m, lat){
    const c = Math.max(0.087, Math.cos(lat * Math.PI / 180));
    return m / (MATERIAL_EARTH_CIRC * c);
  }

  async function materialFetchBitmap(url, signal){
    const r = await fetch(url, {signal});
    if(!r.ok) throw new Error(`environment tile ${r.status}`);
    return createImageBitmap(await r.blob());
  }

  async function materialBuildTexture(kind, time, signal){
    const n = 1 << MATERIAL_Z;
    const size = n * MATERIAL_SIZE;
    const canvas = new OffscreenCanvas(size, size);
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    const jobs=[];
    for(let y=0;y<n;y++) for(let x=0;x<n;x++) jobs.push((async()=>{
      const isNight = kind === 'VIIRS_Night_Lights';
      const url = isNight
        ? `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_Night_Lights/default/default/GoogleMapsCompatible_Level${MATERIAL_Z}/${MATERIAL_Z}/${y}/${x}.png`
        : `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/${kind}/default/${time}/GoogleMapsCompatible_Level${MATERIAL_Z}/${MATERIAL_Z}/${y}/${x}.png`;
      const b=await materialFetchBitmap(url,signal);
      ctx.drawImage(b,x*MATERIAL_SIZE,y*MATERIAL_SIZE,MATERIAL_SIZE,MATERIAL_SIZE);
      if(b.close)b.close();
    })());
    await Promise.all(jobs);
    const img=ctx.getImageData(0,0,size,size), d=img.data;
    // Store a normalized scalar in R. The GIBS image is a visualization, so
    // this is a deliberately smooth proxy rather than pretending RGB is the
    // scientific variable itself.  It is then interpreted only as a weak
    // material coefficient by the shader.
    for(let i=0;i<d.length;i+=4){
      const lum=(0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2])/255;
      const scalar = isNight ? Math.pow(Math.max(0, Math.min(1, (lum-0.06)/0.72)), 1.55) : lum;
      d[i]=Math.round(scalar*255); d[i+1]=d[i]; d[i+2]=d[i]; d[i+3]=255;
    }
    ctx.putImageData(img,0,0);
    return createImageBitmap(await canvas.convertToBlob({type:'image/png'}));
  }

  async function materialBuildDemTiles(signal){
    const n=1<<MATERIAL_Z;
    const tiles=[];
    for(let y=0;y<n;y++) for(let x=0;x<n;x++){
      const url=`https://tiles.mapterhorn.com/${MATERIAL_Z}/${x}/${y}.webp`;
      const b=await materialFetchBitmap(url,signal);
      const c=new OffscreenCanvas(MATERIAL_SIZE,MATERIAL_SIZE);
      const ctx=c.getContext('2d',{willReadFrequently:true});
      ctx.drawImage(b,0,0,MATERIAL_SIZE,MATERIAL_SIZE); if(b.close)b.close();
      const data=ctx.getImageData(0,0,MATERIAL_SIZE,MATERIAL_SIZE).data;
      const s=MATERIAL_SAMPLES;
      const dem=new Float32Array(s*s);
      for(let j=0;j<s;j++) for(let i=0;i<s;i++){
        const px=Math.min(MATERIAL_SIZE-1,Math.floor((i/(s-1))*(MATERIAL_SIZE-1)));
        const py=Math.min(MATERIAL_SIZE-1,Math.floor((j/(s-1))*(MATERIAL_SIZE-1)));
        const k=(py*MATERIAL_SIZE+px)*4;
        dem[j*s+i]=materialDecodeDem(data[k],data[k+1],data[k+2]);
      }
      tiles.push({x,y,dem});
    }
    return tiles;
  }

  async function materialBuildLandMask(signal){
    // High-resolution global land mask used ONLY as a fragment discard mask.
    // The old custom terrain drape decided land/water from 32-sample DEM
    // vertices, which allowed shoreline triangles to survive as rectangular
    // patches.  OSM_Land_Mask is a dedicated coastline mask, so use it to
    // decide where the environmental material is allowed to exist.
    const width=1536, height=768;
    const url='https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?version=1.1.1&service=WMS&request=GetMap&format=image/png&layers=OSM_Land_Mask&styles=&srs=EPSG:4326&bbox=-180,-90,180,90&width='+width+'&height='+height+'&transparent=true';
    const b=await materialFetchBitmap(url,signal);
    const c=new OffscreenCanvas(width,height),ctx=c.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(b,0,0,width,height); if(b.close)b.close();
    const img=ctx.getImageData(0,0,width,height),d=img.data;
    for(let i=0;i<d.length;i+=4){
      // GIBS OSM_Land_Mask uses black for land. Preserve a crisp but
      // antialiased shoreline: black/near-black = land, everything else water.
      const land=1.0-Math.min(1.0,(d[i]+d[i+1]+d[i+2])/96.0);
      const a=Math.round(255*Math.max(0,Math.min(1,land)));
      d[i]=255; d[i+1]=255; d[i+2]=255; d[i+3]=a;
    }
    ctx.putImageData(img,0,0);
    return createImageBitmap(await c.convertToBlob({type:'image/png'}));
  }

  async function materialBuildWorldCoverTexture(signal){
    // ESA WorldCover 2021 v200: global 10 m, 11-class land-cover product.
    // We request one server-rendered geographic image and immediately reduce
    // it to a categorical scalar texture. It is never displayed as its
    // original bright classification palette.
    const url='https://services.terrascope.be/wms/v2?service=WMS&version=1.1.1&request=GetMap&layers=WORLDCOVER_2021_MAP&styles=&format=image/png&transparent=true&srs=EPSG:4326&bbox=-180,-60,180,83&width='+WORLDCOVER_WIDTH+'&height='+WORLDCOVER_HEIGHT;
    const b=await materialFetchBitmap(url,signal);
    const c=new OffscreenCanvas(WORLDCOVER_WIDTH,WORLDCOVER_HEIGHT);
    const ctx=c.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(b,0,0,WORLDCOVER_WIDTH,WORLDCOVER_HEIGHT); if(b.close)b.close();
    const img=ctx.getImageData(0,0,WORLDCOVER_WIDTH,WORLDCOVER_HEIGHT), d=img.data;
    // Standard WorldCover class colors. Encode the nearest class as 0..10 in R.
    const palette=[
      [0,100,0],       // 10 tree cover
      [255,187,34],    // 20 shrubland
      [255,255,76],    // 30 grassland
      [240,150,255],   // 40 cropland
      [250,0,0],       // 50 built-up
      [180,180,180],   // 60 bare/sparse
      [240,240,240],   // 70 snow/ice
      [0,100,200],     // 80 permanent water
      [0,150,160],     // 90 herbaceous wetland
      [0,207,117],     // 95 mangroves
      [250,230,160]    // 100 moss/lichen
    ];
    for(let i=0;i<d.length;i+=4){
      if(d[i+3]<20){ d[i]=255; d[i+1]=0; d[i+2]=0; d[i+3]=0; continue; }
      let best=0,bestDist=1e9;
      for(let k=0;k<palette.length;k++){
        const dr=d[i]-palette[k][0], dg=d[i+1]-palette[k][1], db=d[i+2]-palette[k][2];
        const dist=dr*dr+dg*dg+db*db;
        if(dist<bestDist){bestDist=dist;best=k;}
      }
      d[i]=Math.round(best/10*255); d[i+1]=0; d[i+2]=0; d[i+3]=255;
    }
    ctx.putImageData(img,0,0);
    return createImageBitmap(await c.convertToBlob({type:'image/png'}));
  }

  async function materialBuildClimateTexture(time, signal){
    // Pack several slow climate fields into RGBA so the shader does not need
    // one WebGL texture unit per variable. Channels are normalized proxies
    // derived from the official GIBS visualization ramps: R temperature,
    // G evaporation, B root-zone soil water, A precipitable water vapour.
    const kinds=[ENVIRONMENT_TEMPERATURE_LAYER,ENVIRONMENT_EVAPORATION_LAYER,ENVIRONMENT_SOIL_LAYER,ENVIRONMENT_VAPOR_LAYER];
    const n=1<<MATERIAL_Z, size=n*MATERIAL_SIZE;
    const canvases=kinds.map(()=>new OffscreenCanvas(size,size));
    const ctxs=canvases.map(c=>c.getContext('2d',{willReadFrequently:true}));
    const jobs=[];
    for(let y=0;y<n;y++) for(let x=0;x<n;x++) jobs.push((async()=>{
      for(let k=0;k<kinds.length;k++){
        const url=`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/${kinds[k]}/default/${time}/GoogleMapsCompatible_Level${MATERIAL_Z}/${MATERIAL_Z}/${y}/${x}.png`;
        const b=await materialFetchBitmap(url,signal); ctxs[k].drawImage(b,x*MATERIAL_SIZE,y*MATERIAL_SIZE,MATERIAL_SIZE,MATERIAL_SIZE); if(b.close)b.close();
      }
    })());
    await Promise.all(jobs);
    const out=new OffscreenCanvas(size,size), oc=out.getContext('2d',{willReadFrequently:true});
    const imgs=ctxs.map(c=>c.getImageData(0,0,size,size));
    const od=oc.createImageData(size,size), d=od.data;
    for(let i=0;i<d.length;i+=4){
      // The GIBS rendered ramps are intentionally reduced to broad normalized
      // environmental coefficients; we do not present these as raw units.
      for(let k=0;k<4;k++){
        const a=imgs[k].data;
        const lum=(0.2126*a[i]+0.7152*a[i+1]+0.0722*a[i+2])/255;
        d[i+k]=Math.round(Math.max(0,Math.min(1,lum))*255);
      }
    }
    oc.putImageData(od,0,0);
    return createImageBitmap(await out.convertToBlob({type:'image/png'}));
  }

  async function materialBuildRiverInfluenceTexture(signal){
    const width=ENVIRONMENT_FLOW_SIZE,height=width/2,out=new OffscreenCanvas(width,height),c=out.getContext('2d',{willReadFrequently:true});
    c.lineCap='round';c.lineJoin='round';
    const features=(rivers&&Array.isArray(rivers.features))?rivers.features:[];
    const project=p=>{const lon=Number(p[0]),lat=Math.max(-85,Math.min(85,Number(p[1]))),x=((lon+180)/360)*width,ss=Math.sin(lat*Math.PI/180),y=(0.5-Math.log((1+ss)/(1-ss))/(4*Math.PI))*height;return[x,y];};
    const draw=(a,w)=>{if(!a||a.length<2)return;c.beginPath();for(let i=0;i<a.length;i++){const q=project(a[i]);i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]);}c.lineWidth=.5+4*w;c.strokeStyle=`rgba(255,255,255,${.18+.55*w})`;c.stroke();};
    const walk=(g,w)=>{if(!g)return;if(g.type==='LineString')draw(g.coordinates,w);else if(g.type==='MultiLineString')g.coordinates.forEach(a=>draw(a,w));else if(g.type==='GeometryCollection')g.geometries.forEach(x=>walk(x,w));};
    for(const f of features){const p=f.properties||{},o=Number(p.ORDER||p.order||p.river_order||0),d=Number(p.DIS_AV_CMS||p.dis_av_cms||p.discharge||0),l=Number(p.LENGTH_KM||p.length_km||p.length||0),ow=o?Math.min(1,o/8):0,dw=d?Math.min(1,Math.log10(d+1)/3):0,lw=l?Math.min(1,Math.log10(l+1)/3):.25;walk(f.geometry,Math.max(.1,.42*ow+.38*dw+.2*lw));}
    const blur=new OffscreenCanvas(width,height),bc=blur.getContext('2d');bc.filter='blur(10px)';bc.drawImage(out,0,0);c.globalAlpha=.48;c.drawImage(blur,0,0);c.globalAlpha=1;
    const img=c.getImageData(0,0,width,height),d=img.data;for(let i=0;i<d.length;i+=4){const v=Math.max(d[i],d[i+1],d[i+2]);d[i]=v;d[i+1]=0;d[i+2]=0;d[i+3]=255;}c.putImageData(img,0,0);return createImageBitmap(await out.convertToBlob({type:'image/png'}));
  }

  async function materialBuildGeologyTexture(signal){
    const width=ENVIRONMENT_GEOLOGY_SIZE,height=width/2,params=new URLSearchParams({bbox:'-180,-85.05112878,180,85.05112878',bboxSR:'4326',imageSR:'4326',size:`${width},${height}`,format:'png32',transparent:'false',f:'image'});
    const b=await materialFetchBitmap(`${ENVIRONMENT_GEOLOGY_SERVICE}?${params.toString()}`,signal),c=new OffscreenCanvas(width,height),ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(b,0,0,width,height);if(b.close)b.close();
    const img=ctx.getImageData(0,0,width,height),d=img.data;for(let i=0;i<d.length;i+=4){const r=d[i]/255,g=d[i+1]/255,bv=d[i+2]/255,lum=.2126*r+.7152*g+.0722*bv;d[i]=(0.40+0.60*lum)*255;d[i+1]=(0.43+0.57*lum)*255;d[i+2]=(0.38+0.62*lum)*255;d[i+3]=255;}ctx.putImageData(img,0,0);return createImageBitmap(await c.convertToBlob({type:'image/png'}));
  }

  async function materialBuildEnvironmentalDetailTexture(cropBitmap,riverBitmap,geologyBitmap){

  async function materialBuildWorldCerealTexture(signal){
    // WorldCereal publishes 2021 10 m products as COGs/archives and exposes
    // them through its visualization stack. This lightweight browser path
    // uses the public EWOC GeoServer WMS for the global temporary-crop product.
    // If that service is unavailable, agriculture cleanly falls back to the
    // WorldCover cropland class instead of breaking the terrain material.
    const width=2048, height=1024;
    const params=new URLSearchParams({service:'WMS',version:'1.1.1',request:'GetMap',layers:WORLDCEREAL_CROP_LAYER,styles:'',format:'image/png',transparent:'true',srs:'EPSG:4326',bbox:'-180,-90,180,90',width:String(width),height:String(height)});
    const b=await materialFetchBitmap(`${WORLDCEREAL_WMS}?${params.toString()}`,signal);
    const c=new OffscreenCanvas(width,height),ctx=c.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(b,0,0,width,height); if(b.close)b.close();
    const img=ctx.getImageData(0,0,width,height),d=img.data;
    // Preserve luminance as a fractional crop-extent proxy. The server's
    // rendered WMS palette is not treated as a numeric measurement; it is
    // only a confidence/extent cue that strengthens or weakens the procedural
    // morphology. Exact crop fractions can later come from direct COG values.
    for(let i=0;i<d.length;i+=4){
      const lum=(0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2])/255;
      d[i]=Math.round(lum*255); d[i+1]=0; d[i+2]=0; d[i+3]=255;
    }
    ctx.putImageData(img,0,0);
    return createImageBitmap(await c.convertToBlob({type:'image/png'}));
  }

  async function loadTerrainMaterial(map){
    if(terrainMaterialLoading || terrainMaterialReady) return;
    terrainMaterialLoading=true;
    try{
      const controller=new AbortController();
      const results = await Promise.all([
        materialBuildTexture('MERRA2_Incident_Shortwave_Over_Land_Monthly', ENVIRONMENT_RADIATION_TIME, controller.signal),
        materialBuildTexture('MERRA2_Precipitation_Bias_Corrected_Monthly', ENVIRONMENT_CLIMATE_TIME, controller.signal),
        materialBuildWorldCoverTexture(controller.signal),
        materialBuildTexture(ENVIRONMENT_CANOPY_LAYER, 'default', controller.signal),
        materialBuildClimateTexture(ENVIRONMENT_CLIMATE_TIME, controller.signal),
        materialBuildWorldCerealTexture(controller.signal).catch(e=>{ console.warn('gallery: WorldCereal WMS unavailable; falling back to WorldCover agriculture mask',e); return null; }),
        materialBuildRiverInfluenceTexture(controller.signal),
        materialBuildGeologyTexture(controller.signal).catch(e=>{ console.warn('gallery: GLiM geology image unavailable; using neutral geology base',e); return null; }),
        materialBuildDemTiles(controller.signal),
        materialBuildLandMask(controller.signal)
      ]);
      const [radiation, precipitation, worldCover, canopy, climate, worldCereal, riverInfluence, geology, demTiles, landMask] = results;
      const detail=await materialBuildEnvironmentalDetailTexture(worldCereal || worldCover,riverInfluence,geology || worldCover);
      terrainMaterialTextures={radiation,precipitation,worldCover,canopy,climate,detail,night:null};
      terrainMaterialTiles=demTiles;
      terrainMaterialLandMask=landMask;
      terrainMaterialReady=true;
      if(map) map.triggerRepaint();
    }catch(e){ console.warn('gallery: custom terrain material failed',e); }
    finally{ terrainMaterialLoading=false; }
  }

  let terrainMaterialNightLoading=false;
  async function loadTerrainNightTexture(){
    if(terrainMaterialTextures && terrainMaterialTextures.night) return;
    if(terrainMaterialNightLoading) return;
    terrainMaterialNightLoading=true;

      const controller=new AbortController();
      terrainMaterialTextures.night=await materialBuildTexture('VIIRS_Night_Lights','default',controller.signal);
      if(terrainMapInstance) terrainMapInstance.triggerRepaint();
    }catch(e){ console.warn('gallery: custom night luminance texture failed',e); }
    finally{ terrainMaterialNightLoading=false; }
  }

  function makeTerrainMaterialLayer(){
    terrainMaterialLayer={
      id:'environmental-terrain-material', type:'custom', renderingMode:'3d',
      onAdd(map,gl){
        const vs=`
          attribute vec3 a_pos;
          attribute vec2 a_uv;
          attribute float a_env;
          attribute float a_slope;
          attribute float a_aspect;
          uniform mat4 u_matrix;
          varying vec2 v_uv;
          varying float v_env;
          varying float v_slope;
          varying float v_aspect;
          void main(){
            v_uv=a_uv; v_env=a_env; v_slope=a_slope; v_aspect=a_aspect;
            gl_Position=u_matrix*vec4(a_pos,1.0);
          }`;
        const fs=`
          precision mediump float;
          uniform sampler2D u_radiation;
          uniform sampler2D u_precipitation;
          uniform sampler2D u_nightLights;
          uniform sampler2D u_landMask;
          uniform sampler2D u_worldCover;
          uniform sampler2D u_canopy;
          uniform sampler2D u_climate;
          uniform sampler2D u_detail;
          uniform float u_radStrength;
          uniform float u_materialZoom;
          uniform float u_agricultureStrength;
          uniform float u_wetStrength;
          uniform float u_night;
          varying vec2 v_uv;
          varying float v_env;
          varying float v_slope;
          varying float v_aspect;
          void main(){
            float rad=texture2D(u_radiation,v_uv).r;
            float wet=texture2D(u_precipitation,v_uv).r;
            float artificial=texture2D(u_nightLights,v_uv).r;
            vec4 climate=texture2D(u_climate,v_uv);
            float temp=climate.r;
            float evap=climate.g;
            float soil=climate.b;
            float vapor=climate.a;
            // Derived climate indices: broad coefficients, not displayed maps.
            float thermal=smoothstep(0.24,0.78,temp);
            float humidity=smoothstep(0.18,0.72,vapor);
            float waterBalance=clamp(0.52*wet+0.28*soil+0.20*humidity-0.24*evap,0.0,1.0);
            float aridity=1.0-smoothstep(0.28,0.72,waterBalance);
            float heatDry=thermal*aridity;
            vec4 detail=texture2D(u_detail,v_uv);
            float riverSignal=detail.g;
            float riverProximity=smoothstep(0.015,0.32,riverSignal);
            float riverLush=riverProximity*(0.46+0.54*smoothstep(0.20,0.76,waterBalance));
            vec3 geology=vec3(detail.b);
            float geologyTone=0.5*(geology.r+geology.g);
            float bareRock=1.0-smoothstep(0.10,0.48,vegetation);
            float steepRock=smoothstep(7.0,25.0,v_slope);
            float rockSignal=clamp(smoothstep(0.48,0.76,geologyTone)*mix(0.58,1.0,bareRock)*mix(0.55,1.0,steepRock),0.0,1.0);
            // Convert Mercator Y to geographic latitude for the EPSG:4326
            // land-mask texture. Do not rely on the coarse DEM vertex flag:
            // that was the source of the square shoreline artifacts.
            float q=3.14159265-6.28318530*v_uv.y;
            float lat=degrees(atan(sinh(q)));
            float landV=(lat+90.0)/180.0;
            float land=texture2D(u_landMask,vec2(v_uv.x,1.0-landV)).a;
            if(land < 0.42) discard;
            // WorldCover is geographic EPSG:4326, so convert the Mercator
            // latitude/longitude into its own UV space. Outside the product
            // extent (-60..83) we simply leave the land-cover contribution off.
            float lon=(fract(v_uv.x)*360.0)-180.0;
            float wcY=(83.0-lat)/(83.0-(-60.0));
            float wcX=(lon+180.0)/360.0;
            float wcValid=step(-60.0,lat)*step(lat,83.0);
            float wcClass=texture2D(u_worldCover,vec2(clamp(wcX,0.0,1.0),clamp(wcY,0.0,1.0))).r*10.0;
            // Class-specific material weights. These are intentionally modest:
            // land cover should diversify the base material, not become a map.
            float isTree=1.0-step(0.55,abs(wcClass-0.0));
            float isShrub=1.0-step(0.55,abs(wcClass-1.0));
            float isGrass=1.0-step(0.55,abs(wcClass-2.0));
            float isCrop=1.0-step(0.55,abs(wcClass-3.0));
            float isBuilt=1.0-step(0.55,abs(wcClass-4.0));
            float isBare=1.0-step(0.55,abs(wcClass-5.0));
            float isSnow=1.0-step(0.55,abs(wcClass-6.0));
            float isWater=1.0-step(0.55,abs(wcClass-7.0));
            float isWet=1.0-step(0.55,abs(wcClass-8.0));
            float isMangrove=1.0-step(0.55,abs(wcClass-9.0));
            float isMoss=1.0-step(0.55,abs(wcClass-10.0));
            float vegetation=(isTree*0.95+isShrub*0.72+isGrass*0.56+isCrop*0.46+isWet*0.86+isMangrove*0.98+isMoss*0.78+isBare*0.08+isBuilt*0.02)*wcValid;
            // GEDI L3 mean RH100 canopy-height layer. GIBS renders the official
            // canopy-height product as a continuous color ramp; its sampled
            // luminance is used only as a normalized height proxy, and only woody
            // land-cover classes are allowed to respond to it.
            float canopyRaw=texture2D(u_canopy,v_uv).r;
            float canopy=smoothstep(0.06,0.78,canopyRaw);
            canopy*=smoothstep(0.02,0.22,vegetation);
            float canopyTall=smoothstep(0.28,0.82,canopy);
            vec3 coverTone=vec3(0.55,0.64,0.46);
            coverTone=mix(coverTone,vec3(0.20,0.38,0.25),isTree*wcValid);
            coverTone=mix(coverTone,vec3(0.42,0.50,0.29),isShrub*wcValid);
            coverTone=mix(coverTone,vec3(0.56,0.63,0.34),isGrass*wcValid);
            coverTone=mix(coverTone,vec3(0.64,0.60,0.34),isCrop*wcValid);
            coverTone=mix(coverTone,vec3(0.50,0.48,0.43),isBuilt*wcValid);
            coverTone=mix(coverTone,vec3(0.60,0.55,0.45),isBare*wcValid);
            coverTone=mix(coverTone,vec3(0.50,0.67,0.52),isWet*wcValid);
            coverTone=mix(coverTone,vec3(0.30,0.58,0.40),isMangrove*wcValid);
            coverTone=mix(coverTone,vec3(0.60,0.66,0.48),isMoss*wcValid);
            // Canopy height modulates forest material instead of painting a forest
            // overlay: taller canopy is deeper/richer and receives a little more
            // material contrast; short/sparse vegetation stays closer to the base.
            float canopyWeight=canopy*wcValid*(isTree+0.55*isMangrove);
            coverTone=mix(coverTone,vec3(0.16,0.30,0.19),canopyWeight*0.58);
            float riverVegetation=riverLush*wcValid*(0.28+0.72*vegetation);
            coverTone=mix(coverTone,vec3(0.14,0.40,0.24),riverVegetation*0.42);
            // ------------------------------------------------------------
            // PROCEDURAL AGRICULTURE BASE
            // ------------------------------------------------------------
            // This is deliberately a morphology layer, not a crop heatmap.
            // WorldCover tells us where cropland exists; slope, precipitation,
            // latitude and (when available) irrigation/crop identity will decide
            // how the material behaves. At this stage we only generate plausible
            // field structure inside confirmed cropland, and keep it restrained
            // until the higher-resolution WorldCereal products are connected.
            float wcAg=texture2D(u_detail,v_uv).r;
            float cropMask=wcValid*mix(isCrop,smoothstep(0.08,0.42,wcAg),0.78);
            // WorldCereal is a real crop-extent signal, while WorldCover is the
            // broad land-cover gate. The blend keeps the shader robust if a
            // region has no current WorldCereal coverage.
            float cropPresence=clamp(max(isCrop*0.35,wcAg),0.0,1.0);
            float slopeDeg=v_slope;

// - flat mechanized fields: large orthogonal/anisotropic parcels, mostly on
//   low slopes; orientation will eventually come from observed field edges.
// - contour/terrace fields: slope-following bands; later gated by actual rice
//   / crop identity and irrigation instead of a geographic guess.
// - paddy: wet/reflective lowland fields, seasonal inundation and bund geometry.
// - orchards/vineyards: perennial row spacing and smaller regular blocks.
// - plantations: very regular narrow-row texture at tropical/subtropical scale.
// - smallholder mosaics: irregular small parcels rather than giant rectangles.
// - greenhouse horticulture: high-contrast rectangular clusters where source
//   data supports them.
// - floodplain agriculture: field geometry aligned with river/floodplain axes.

    console.warn('gallery: night palette update failed',err);
    if (terrainMapInstance) terrainMapInstance.once('idle', () => { if (nightModeOn === on) setNightPalette(on); });
  }
}

let terrainMapInstance = null;

const POLE_PORTAL_LAT = 82;
let poleWrapping = false;
let lastPoleLat = 0;

function setPoleFade(active) {
  const el = document.getElementById('poleFade');
  if (!el) return;
  el.classList.toggle('active', active);
}

function handlePoleWrap() {
  if (!terrainMapInstance || poleWrapping || !in3D) return;
  const c = terrainMapInstance.getCenter();
  const crossedNorth = lastPoleLat <= POLE_PORTAL_LAT && c.lat > POLE_PORTAL_LAT;
  const crossedSouth = lastPoleLat >= -POLE_PORTAL_LAT && c.lat < -POLE_PORTAL_LAT;
  lastPoleLat = c.lat;
  if (!crossedNorth && !crossedSouth) return;

  poleWrapping = true;
  const targetLat = crossedNorth ? -POLE_PORTAL_LAT : POLE_PORTAL_LAT;
  // The 180° longitude shift puts the view on the opposite side of the
  // sphere-like pole crossing. The white veil hides the discontinuity and
  // also masks the Mercator/Antarctica cutoff at the finite tile boundary.
  const targetLng = c.lng + 180;
  setPoleFade(true);
  terrainMapInstance.stop();
  setTimeout(() => {
    terrainMapInstance.jumpTo({ center: [targetLng, targetLat] });
    lastPoleLat = targetLat;
    requestAnimationFrame(() => {
      setTimeout(() => {
        setPoleFade(false);
        setTimeout(() => { poleWrapping = false; }, 240);
      }, 150);
    });
  }, 420);
}

// ============================================================
// ANTARCTIC TERRAIN COLOR PROTOCOL
//
// Replaces the old approach (a Natural Earth Antarctica polygon drawn as a
// GeoJSON fill layer on top of the terrain). Instead this decodes the
// exact same Mapterhorn DEM tiles MapLibre already uses for terrain,
// client-side, and generates an ordinary raster tile whose pixels are
// colored from BOTH elevation and geographic latitude. MapLibre then
// drapes that raster tile over the real 3D terrain geometry — no GeoJSON,
// polygon, mask, floating mesh, or flat white overlay, and the ice
// shading includes real hillshading computed from the DEM's own local
// slope, not a faked gradient.
// ============================================================
let antarcticProtocolInstalled = false;

// ============================================================
// OCEAN DEPTH LOOKUP — used by the dashboard's depth readout. MapLibre's
// queryTerrainElevation() only reads whichever source is set as the
// active 3D terrain (our land DEM), not bathymetryDem, so there's no
// built-in way to ask "what's the bathymetry value under this point" —
// this fetches and decodes the relevant Seascape tile directly, the same
// approach the Antarctic ice layer already uses for its own DEM data.
//
// Queried at a fixed zoom (8) rather than whatever the camera's current
// zoom is — Seascape's own docs describe global coverage through z8, with
// denser regional detail only in some areas beyond that, so z8 is the
// safe choice that resolves everywhere rather than returning "n/a" in
// most of the ocean. The tradeoff is resolution: each z8 tile covers a
// wide area, so this is a coarse reading, not a precise sounding.
//
// getOceanDepthMetersSync() is what the readout actually calls, and it's
// genuinely synchronous from the caller's side: if the relevant tile is
// already cached, it returns a real number immediately; if not, it kicks
// off a background fetch (fire-and-forget) and returns undefined for
// this call, with the result available on a later call once the fetch
// resolves — same non-blocking pattern already used throughout this file.
// ============================================================
let seascapeRasterTemplate = null;
let seascapeRasterTemplatePromise = null;
async function resolveSeascapeRasterTemplate() {
  if (seascapeRasterTemplate) return seascapeRasterTemplate;
  if (!seascapeRasterTemplatePromise) {
    seascapeRasterTemplatePromise = fetch('https://tiles.openwaters.io/seascape/raster.json')
      .then(res => res.json())
      .then(json => { seascapeRasterTemplate = (json.tiles && json.tiles[0]) || null; return seascapeRasterTemplate; })
      .catch(err => { console.warn('gallery: failed to resolve seascape raster tile template —', err.message); return null; });
  }
  return seascapeRasterTemplatePromise;
}

const DEPTH_QUERY_ZOOM = 8;
const depthTileCache = new Map(); // "z/x/y" -> {data, size} | null (null = fetched but no data there)
const depthTileInFlight = new Set();

function lngLatToTileXYZ(lng, lat, z) {
  const n = Math.pow(2, z);
  const x = Math.floor((lng + 180) / 360 * n);
  const latRad = lat * Math.PI / 180;
  const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
  return { x, y, z, n };
}

async function ensureDepthTileLoading(key, z, x, y) {
  if (depthTileCache.has(key) || depthTileInFlight.has(key)) return;
  depthTileInFlight.add(key);
  try {
    const template = await resolveSeascapeRasterTemplate();
    if (!template) { depthTileCache.set(key, null); return; }
    const url = template.replace('{z}', z).replace('{x}', x).replace('{y}', y);
    const res = await fetch(url);
    if (!res.ok) { depthTileCache.set(key, null); return; }
    const bitmap = await createImageBitmap(await res.blob());
    const size = bitmap.width;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(bitmap, 0, 0);
    if (bitmap.close) bitmap.close();
    depthTileCache.set(key, { data: ctx.getImageData(0, 0, size, size).data, size });
  } catch {
    depthTileCache.set(key, null);
  } finally {
    depthTileInFlight.delete(key);
  }
}

// Returns: a number (elevation in meters — negative is depth below sea
// level, >=0 is land or Seascape's land sentinel), null (fetched, no real
// data there), or undefined (still loading — a background fetch was just
// started, try again on a later call).
function getOceanDepthMetersSync(lng, lat) {
  const { x, y, z, n } = lngLatToTileXYZ(lng, lat, DEPTH_QUERY_ZOOM);
  const key = `${z}/${x}/${y}`;
  const cached = depthTileCache.get(key);
  if (cached === undefined) {
    ensureDepthTileLoading(key, z, x, y);
    return undefined;
  }
  if (cached === null) return null;
  const xFrac = (lng + 180) / 360 * n - x;
  const latRad = lat * Math.PI / 180;
  const yExact = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
  const yFrac = yExact - y;
  const px = Math.max(0, Math.min(cached.size - 1, Math.floor(xFrac * cached.size)));
  const py = Math.max(0, Math.min(cached.size - 1, Math.floor(yFrac * cached.size)));
  const i = (py * cached.size + px) * 4;
  const d = cached.data;
  return (d[i] * 256 + d[i + 1] + d[i + 2] / 256) - 32768; // Terrarium encoding
}

function installAntarcticTerrainProtocol() {
  if (antarcticProtocolInstalled) return;
  antarcticProtocolInstalled = true;

  maplibregl.addProtocol('antarctic-relief', async (params, abortController) => {
    const parts = params.url.replace('antarctic-relief://', '').split('/').map(Number);
    const z = parts[0], x = parts[1], y = parts[2];
    const size = 512;
    const sourceUrl = `https://tiles.mapterhorn.com/${z}/${x}/${y}.webp`;
    const response = await fetch(sourceUrl, { signal: abortController && abortController.signal });
    if (!response.ok) {
      // Mapterhorn's coverage has real gaps (their own docs note it
      // started with a European-DEM focus, not full global coverage) —
      // a missing tile here just means "no ice-shading data available",
      // not a fatal error. Hand back a fully transparent tile instead of
      // throwing, so the ordinary color-relief ocean blue shows through
      // underneath for that one tile instead of spamming the console.
      const blankCanvas = new OffscreenCanvas(size, size);
      blankCanvas.getContext('2d'); // required before convertToBlob will work, even though nothing gets drawn — stays fully transparent
      const blankBlob = await blankCanvas.convertToBlob({ type: 'image/png' });
      return { data: await blankBlob.arrayBuffer() };
    }
    const bitmap = await createImageBitmap(await response.blob());

    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(bitmap, 0, 0, size, size);
    if (bitmap.close) bitmap.close();
    const src = ctx.getImageData(0, 0, size, size).data;
    const out = ctx.createImageData(size, size);

    const decode = (i) => (src[i] * 256 + src[i + 1] + src[i + 2] / 256) - 32768; // Terrarium encoding
    const n = Math.pow(2, z);
    const latForPixel = (py) => {
      const q = Math.PI - 2 * Math.PI * (y + py / size) / n;
      return 180 / Math.PI * Math.atan(Math.sinh(q));
    };

    // Same global elevation bands as the existing color-relief, but the
    // Antarctic land palette is cool/white. Ocean remains transparent so
    // the existing vivid-blue native DEM color-relief remains visible.
    const icePalette = (e) => {
      if (e < 100) return [222, 236, 242];
      if (e < 500) { const t = (e - 100) / 400; return [Math.round(222 + 25 * t), Math.round(236 + 17 * t), Math.round(242 + 13 * t)]; }
      if (e < 1500) return [247, 253, 255];
      if (e < 2500) { const t = (e - 1500) / 1000; return [Math.round(247 - 18 * t), Math.round(253 - 15 * t), Math.round(255 - 5 * t)]; }
      return [245, 250, 255];
    };

    for (let py = 0; py < size; py++) {
      const lat = latForPixel(py);
      for (let px = 0; px < size; px++) {
        const si = (py * size + px) * 4;
        const e = decode(si);
        const di = si;

        // Geographic condition computed per DEM pixel. Elevation keeps
        // ocean blue: only actual positive land/ice is recolored.
        const isAntarctic = lat <= -60.0 && e > 0.0;
        if (!isAntarctic) {
          out.data[di] = 0; out.data[di + 1] = 0; out.data[di + 2] = 0; out.data[di + 3] = 0;
          continue;
        }

        let rgb = icePalette(e);
        // Real hillshade from the same DEM, using adjacent pixels — not a
        // fake gradient, calculated from the DEM's own slope.
        const px0 = Math.max(0, px - 1), px1 = Math.min(size - 1, px + 1);
        const py0 = Math.max(0, py - 1), py1 = Math.min(size - 1, py + 1);
        const ex0 = decode((py * size + px0) * 4), ex1 = decode((py * size + px1) * 4);
        const ey0 = decode((py0 * size + px) * 4), ey1 = decode((py1 * size + px) * 4);
        const dx = (ex1 - ex0) * 0.5, dy = (ey1 - ey0) * 0.5;
        const shade = Math.max(0.68, Math.min(1.12, 0.94 - dx * 0.012 + dy * 0.012));
        rgb = rgb.map(v => Math.max(0, Math.min(255, Math.round(v * shade))));
        out.data[di] = rgb[0]; out.data[di + 1] = rgb[1]; out.data[di + 2] = rgb[2]; out.data[di + 3] = 255;
      }
    }
    ctx.putImageData(out, 0, 0);
    return { data: await createImageBitmap(canvas) };
  });
}
