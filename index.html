<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#14100d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Send to Lamp</title>
<style>
  /* ============================================================
     POSTCARD FONTS — 10 open-source fonts in /fonts, selectable via
     the small circular dial next to the message input.
     ============================================================ */
  @font-face { font-family: 'GeistPixel'; src: url('./fonts/GeistPixel-Square.otf') format('opentype'); font-display: swap; }
  @font-face { font-family: 'MW'; src: url('./fonts/MW-Regular.otf') format('opentype'); font-display: swap; }
  @font-face { font-family: 'NB'; src: url('./fonts/NB-Bold.otf') format('opentype'); font-display: swap; }

  :root {
    --bg: #14100d;
    --bg-elevated: #1e1712;
    --ember: #e8834a;
    --ember-dim: #a85c30;
    --ember-glow: #ff9d5c;
    --neutral-grey: #9c9a94;
    --cream: #f0e6d8;
    --cream-dim: #b8ac9c;
    --line: #332a22;
    --success: #7fae7a;
    --fail: #c46a5f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(ellipse at top, #1c150f 0%, var(--bg) 60%);
    color: var(--cream);
    margin: 0;
    padding: 12px 18px 40px;
    min-height: 100vh;
  }
  h1 {
    font-size: 13px; font-weight: 500; letter-spacing: 0.03em; color: var(--cream-dim);
    text-align: center; margin: 0 0 12px; text-transform: lowercase;
  }
  .footer-row { text-align: center; opacity: 0.85; }
  h3 { font-size: 12px; font-weight: 600; color: var(--cream-dim); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: 0.06em; }

  input[type=file] { display: none; }

  .pill {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--cream-dim); font-size: 12px; letter-spacing: 0.02em;
  }
  .pill.active { background: var(--ember); border-color: var(--ember); color: #1a1108; font-weight: 600; }

  /* orientation icon buttons — sit in the letterbox space beside the photo */
  .orient-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 34px; height: 34px; border-radius: 8px;
    background: rgba(30,23,18,0.75); border: 1px solid var(--line);
    color: var(--cream-dim);
    display: flex; align-items: center; justify-content: center;
    z-index: 6;
  }
  .orient-btn.active { background: var(--ember); border-color: var(--ember); color: #1a1108; }
  .orient-btn-left { left: 8px; }
  .orient-btn-right { right: 8px; }

  /* tone/filter indicator icons — fade in during scrub, out shortly after;
     sit inline with the invert/pattern buttons, which stay always clickable */
  .scrub-pill {
    display: flex; align-items: center;
    min-height: 20px;
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  .scrub-pill.visible { opacity: 1; }
  .scrub-pill svg rect,
  .scrub-pill svg circle,
  .scrub-pill svg line { transition: opacity 0.15s; }

  /* --- full photo + crop box --- */
  .photo-wrap {
    position: relative; width: 100%; overflow: hidden;
    background: #000; border: 1px solid var(--line); border-bottom: none;
    border-radius: 14px 14px 0 0;
    height: 30vh; min-height: 160px;
  }
  .photo-wrap img {
    display: block; width: 100%; height: 100%; object-fit: contain;
    user-select: none; -webkit-user-select: none; pointer-events: none;
  }
  .empty-state {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: var(--cream-dim); font-size: 13px; padding: 30px 0;
  }
  .empty-state svg { opacity: 0.5; }
  .tap-target { position: absolute; inset: 0; z-index: 3; }
  .photo-wrap.has-photo .tap-target { z-index: 1; pointer-events: none; }

  .crop-box {
    position: absolute; border: 2px solid var(--ember); background: rgba(232,131,74,0.08);
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.55);
    touch-action: none; z-index: 4;
  }
  .crop-box .handle {
    position: absolute; width: 28px; height: 28px;
    background: var(--ember); border-radius: 50%; border: 3px solid var(--bg);
    touch-action: none;
  }
  .handle-tl { left: -14px; top: -14px; }
  .handle-tr { right: -14px; top: -14px; }
  .handle-bl { left: -14px; bottom: -14px; }
  .handle-br { right: -14px; bottom: -14px; }

  .crop-hint { font-size: 11px; color: var(--cream-dim); text-align: center; margin-top: 8px; opacity: 0.7; }

  /* --- live dithered preview, scrub to adjust --- */
  /* height:auto (not a fixed vh box) so the canvas displays at true 1:1 pixel
     scale instead of being squeezed smaller than its real 400x300 resolution,
     which was smoothing away the actual blockiness of the real panel */
  .preview-wrap {
    position: relative; touch-action: none;
    width: 100%;
    border-radius: 0 0 14px 14px; overflow: hidden;
    border: 1px solid var(--line); border-top: 1px solid var(--ember-dim);
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  .preview-wrap canvas {
    max-width: 100%; height: auto; display: block;
    image-rendering: pixelated;
    image-rendering: -webkit-optimize-contrast;
    background: #fff;
  }

  hr.divider { border: none; border-top: 1px solid var(--line); margin: 26px 0 18px; }

  .moire-row {
    display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 0 2px;
  }
  .moire-label { font-size: 11px; color: var(--cream-dim); flex: 0 0 44px; }
  .moire-row input[type=range] {
    flex: 1; height: 22px; accent-color: var(--ember);
  }

  .postcard-row { display: flex; gap: 8px; margin-top: 12px; }
  .postcard-row input[type=text] {
    flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg-elevated); color: var(--cream); font-size: 16px;
    font-family: inherit;
  }
  .postcard-row input[type=text]::placeholder { color: var(--cream-dim); opacity: 0.6; }
  .postcard-pos-btn {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg-elevated); color: var(--cream-dim);
    display: flex; align-items: center; justify-content: center;
  }
  .font-dial-btn {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg-elevated);
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  .font-dial-btn circle { transition: opacity 0.15s, r 0.1s; }

  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--cream-dim); margin-bottom: 10px; }
  .contacts-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .contact-chip {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 4px; border-radius: 12px; opacity: 0.55; width: 68px;
  }
  .contact-chip.selected { opacity: 1; }
  .contact-avatar {
    width: 52px; height: 52px; border-radius: 50%; background: var(--bg-elevated);
    border: 2px solid var(--line); display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--cream-dim);
  }
  .contact-chip.selected .contact-avatar { border-color: var(--ember); color: var(--ember-glow); }
  .contact-name { font-size: 11px; color: var(--cream-dim); max-width: 68px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .contact-chip.selected .contact-name { color: var(--cream); }
  .contact-id { font-size: 9px; color: #6b6155; max-width: 68px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .add-chip .contact-avatar { border-style: dashed; font-size: 22px; }
  .hold-hint { font-size: 10px; color: #6b6155; text-align: center; margin-top: 8px; }

  .send-zone { display: flex; flex-direction: column; align-items: center; margin-top: 32px; }
  .send-btn {
    width: 96px; height: 96px; border-radius: 50%; border: none;
    background: radial-gradient(circle at 35% 30%, var(--ember-glow), var(--ember) 55%, var(--ember-dim) 100%);
    box-shadow: 0 0 0 6px rgba(232,131,74,0.08), 0 8px 24px rgba(232,131,74,0.25);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease;
  }
  .send-btn:active { transform: scale(0.94); }
  .send-btn:disabled { opacity: 0.3; box-shadow: none; }
  .send-btn svg { width: 30px; height: 30px; }
  .send-status { margin-top: 14px; font-size: 12px; color: var(--cream-dim); text-align: center; min-height: 16px; }
  .send-status.success { color: var(--success); }
  .send-status.fail { color: var(--fail); }
  .last-seen { font-size: 11px; color: var(--cream-dim); text-align: center; margin-top: 6px; opacity: 0.7; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none;
    align-items: flex-end; justify-content: center; z-index: 50;
  }
  .modal-backdrop.open { display: flex; }
  .modal-sheet {
    background: var(--bg-elevated); border-radius: 18px 18px 0 0; padding: 22px 20px 32px;
    width: 100%; max-width: 480px; border-top: 1px solid var(--line);
  }
  .modal-sheet h2 { font-size: 15px; font-weight: 600; margin: 0 0 16px; color: var(--cream); }
  .modal-sheet label { font-size: 12px; color: var(--cream-dim); display: block; margin-bottom: 6px; }
  .modal-sheet input[type=text] {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--cream); font-size: 14px; margin-bottom: 14px;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 4px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; }
  .btn-cancel { background: var(--line); color: var(--cream-dim); }
  .btn-save { background: var(--ember); color: #1a1108; }
  .btn-remove { background: transparent; color: var(--fail); font-size: 12px; border: none; margin-top: 10px; padding: 6px; width: 100%; }
</style>
</head>
<body>

<div class="photo-wrap" id="photoWrap">
  <img id="sourceImg" src="" style="display:none;">
  <div class="empty-state" id="emptyState">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
    <span>tap to choose a photo</span>
  </div>
  <div class="crop-box" id="cropBox" style="display:none;">
    <div class="handle handle-tl" data-corner="tl"></div>
    <div class="handle handle-tr" data-corner="tr"></div>
    <div class="handle handle-bl" data-corner="bl"></div>
    <div class="handle handle-br" data-corner="br"></div>
  </div>
  <input type="file" id="fileInput" accept="image/*">
  <div class="tap-target" id="tapTarget"></div>

  <button class="orient-btn orient-btn-left active" id="btnLandscape" title="landscape">
    <svg viewBox="0 0 24 24" width="16" height="16"><rect x="2" y="6" width="20" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
  <button class="orient-btn orient-btn-right" id="btnPortrait" title="portrait">
    <svg viewBox="0 0 24 24" width="16" height="16"><rect x="6" y="2" width="12" height="20" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
</div>
<div class="preview-wrap" id="previewWrap">
  <canvas id="liveCanvas"></canvas>
</div>

<div style="display:flex; align-items:center; gap:10px; margin-top:14px;">
  <div class="scrub-pill" id="scrubPill">
    <svg id="toneIndicator" viewBox="0 0 16 23" width="12" height="20">
      <rect id="tonePip0" x="0" y="18" width="16" height="5" fill="var(--neutral-grey)"></rect>
      <rect id="tonePip1" x="0" y="12" width="16" height="5" fill="var(--neutral-grey)" opacity="0.15"></rect>
      <rect id="tonePip2" x="0" y="6"  width="16" height="5" fill="var(--neutral-grey)" opacity="0.15"></rect>
      <rect id="tonePip3" x="0" y="0"  width="16" height="5" fill="var(--neutral-grey)" opacity="0.15"></rect>
    </svg>
    <svg id="filterIndicator" viewBox="0 0 6 23" width="4" height="20" style="margin-left:6px;">
      <!-- colored fill-line, sits flush against the bars — height always
           matches the current tone fill level, color swaps per active filter -->
      <rect id="filterFillLine" x="0" y="23" width="6" height="0" fill="#e2584a" opacity="0"></rect>
    </svg>
  </div>
  <button class="pill" id="invertBtn">invert</button>
  <button class="pill" id="patternBtn">floyd–steinberg</button>
</div>

<div class="moire-row"><span class="moire-label">grid</span><input type="range" id="gridSlider" min="0" max="100" value="0"></div>
<div class="moire-row"><span class="moire-label">hatch</span><input type="range" id="hatchSlider" min="0" max="100" value="0"></div>
<div class="moire-row"><span class="moire-label">scan</span><input type="range" id="scanSlider" min="0" max="100" value="0"></div>
<div class="moire-row"><span class="moire-label">grain</span><input type="range" id="grainSlider" min="0" max="100" value="0"></div>
<div class="moire-row"><span class="moire-label">chroma</span><input type="range" id="chromaSlider" min="0" max="100" value="0"></div>

<div class="postcard-row">
  <input type="text" id="postcardInput" placeholder="add a short message (optional)" maxlength="70">
  <button class="postcard-pos-btn" id="postcardPosBtn" title="move message to top/bottom">
    <svg viewBox="0 0 24 24" width="16" height="16"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="4.5" y="15" width="15" height="5.5" rx="1" fill="currentColor" id="postcardPosIcon"/></svg>
  </button>
  <button class="font-dial-btn" id="fontDialBtn" title="change font — drag around the dial">
    <svg viewBox="0 0 24 24" width="22" height="22">
      <circle id="fontDot0" cx="12"    cy="4"  r="2"   fill="var(--ember)" opacity="1"></circle>
      <circle id="fontDot1" cx="18.93" cy="16" r="1.6" fill="var(--cream-dim)" opacity="0.4"></circle>
      <circle id="fontDot2" cx="5.07"  cy="16" r="1.6" fill="var(--cream-dim)" opacity="0.4"></circle>
    </svg>
  </button>
</div>

<div style="display:flex; justify-content:center; gap:6px; margin-top:8px; flex-wrap:wrap;">
  <button class="pill filter-pill active" id="filterStandard" data-filter="standard">standard</button>
  <button class="pill filter-pill" id="filterRed" data-filter="red">red filter</button>
  <button class="pill filter-pill" id="filterGreen" data-filter="green">green filter</button>
  <button class="pill filter-pill" id="filterBlue" data-filter="blue">blue filter</button>
</div>
<p class="crop-hint" id="cropHint" style="display:none;">drag box to move · drag corners to reshape · drag preview up/down for shading · tap preview to cycle filter</p>

<hr class="divider">

<div class="section-label">send to</div>
<div class="contacts-row" id="contactsRow">
  <div class="contact-chip add-chip" id="addContactBtn">
    <div class="contact-avatar">+</div>
    <div class="contact-name">add lamp</div>
  </div>
</div>
<p class="hold-hint">tap to select · hold to edit</p>

<div class="send-zone">
  <button class="send-btn" id="sendBtn" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="#1a1108" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3c2 2.5 3.5 5 3.5 7.5A3.5 3.5 0 0 1 8.5 12C8.5 9 10 5.5 12 3z"/>
      <path d="M12 21a4 4 0 0 0 4-4c0-1.5-1-2.5-2-3.5"/>
    </svg>
  </button>
  <div class="send-status" id="sendStatus"></div>
  <div class="last-seen" id="lastSeen"></div>
</div>

<hr class="divider">

<div class="footer-row">
  <h1>send today's light</h1>
</div>


<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-sheet">
    <h2 id="modalTitle">add a lamp</h2>
    <label>name</label>
    <input type="text" id="contactName" placeholder="Sarah">
    <label>lamp id</label>
    <input type="text" id="contactId" placeholder="paste the code they gave you">
    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">cancel</button>
      <button class="btn-save" id="modalSave">save</button>
    </div>
    <button class="btn-remove" id="modalRemove" style="display:none;">remove this lamp</button>
  </div>
</div>

<script>
const WORKER_BASE_URL = "https://your-worker-name.workers.dev"; // <-- edit this

const fileInput = document.getElementById('fileInput');
const tapTarget = document.getElementById('tapTarget');
const photoWrap = document.getElementById('photoWrap');
const sourceImg = document.getElementById('sourceImg');
const emptyState = document.getElementById('emptyState');
const cropBox = document.getElementById('cropBox');
const cropHint = document.getElementById('cropHint');
const liveCanvas = document.getElementById('liveCanvas');
const lctx = liveCanvas.getContext('2d');
const previewWrap = document.getElementById('previewWrap');
const scrubPill = document.getElementById('scrubPill');
const tonePip0 = document.getElementById('tonePip0');
const tonePip1 = document.getElementById('tonePip1');
const tonePip2 = document.getElementById('tonePip2');
const tonePip3 = document.getElementById('tonePip3');
const filterFillLine = document.getElementById('filterFillLine');
const invertBtn = document.getElementById('invertBtn');
const patternBtn = document.getElementById('patternBtn');
const filterButtons = document.querySelectorAll('.filter-pill');
const postcardInput = document.getElementById('postcardInput');
const postcardPosBtn = document.getElementById('postcardPosBtn');
const postcardPosIcon = document.getElementById('postcardPosIcon');
const fontDialBtn = document.getElementById('fontDialBtn');
const FONT_DOTS = [0,1,2].map(i => document.getElementById(`fontDot${i}`));
const sendBtn = document.getElementById('sendBtn');
const sendStatus = document.getElementById('sendStatus');
const lastSeen = document.getElementById('lastSeen');
const btnLandscape = document.getElementById('btnLandscape');
const btnPortrait = document.getElementById('btnPortrait');
const contactsRow = document.getElementById('contactsRow');
const addContactBtn = document.getElementById('addContactBtn');
const modalBackdrop = document.getElementById('modalBackdrop');
const modalTitle = document.getElementById('modalTitle');
const contactNameInput = document.getElementById('contactName');
const contactIdInput = document.getElementById('contactId');
const modalSave = document.getElementById('modalSave');
const modalCancel = document.getElementById('modalCancel');
const modalRemove = document.getElementById('modalRemove');

// ============================================================
// PANEL HARDWARE CONFIG: matches a 4.2" e-ink module (400x300).
// Change these if you're targeting a different panel size later —
// e.g. 296x128 for a 2.9", or 800x480 for a 7.5".
// ============================================================
const PANEL_W = 400, PANEL_H = 300;

let targetW = PANEL_W, targetH = PANEL_H; // fixed to the real panel resolution, not derived from the crop box
let naturalW = 0, naturalH = 0;
let hasPhoto = false;
let editingContactIdx = null;
let selectedContact = null;
// gray-level/tone-curve state now lives in STEPS + stepIndex, defined near the scrub handler below

// crop box state, in DISPLAYED (CSS) pixel coordinates relative to photoWrap
let box = { left: 0, top: 0, width: 0, height: 0 };

const CHUNK_TYPE = 'epRb';

// ---------- contacts ----------
function loadContacts() {
  try { return JSON.parse(localStorage.getItem('lampContacts') || '[]'); }
  catch { return []; }
}
function saveContacts(list) { localStorage.setItem('lampContacts', JSON.stringify(list)); }

function renderContacts() {
  const contacts = loadContacts();
  contactsRow.querySelectorAll('.contact-chip:not(.add-chip)').forEach(el => el.remove());
  contacts.forEach((c, i) => {
    const chip = document.createElement('div');
    chip.className = 'contact-chip' + (selectedContact === i ? ' selected' : '');
    const shortId = c.id.length > 10 ? c.id.slice(0, 10) + '…' : c.id;
    chip.innerHTML = `<div class="contact-avatar">${c.name.charAt(0).toUpperCase()}</div><div class="contact-name">${c.name}</div><div class="contact-id">${shortId}</div>`;

    let pressTimer = null;
    let firedLongPress = false;

    chip.addEventListener('touchstart', () => {
      firedLongPress = false;
      pressTimer = setTimeout(() => { firedLongPress = true; openModal(i); }, 550);
    }, { passive: true });

    chip.addEventListener('touchend', () => {
      clearTimeout(pressTimer);
      if (!firedLongPress) {
        selectedContact = i;
        renderContacts();
        updateSendState();
        checkLastSeen(c.id);
      }
    });

    chip.addEventListener('touchmove', () => { clearTimeout(pressTimer); });

    chip.addEventListener('click', () => {
      selectedContact = i; renderContacts(); updateSendState(); checkLastSeen(c.id);
    });

    contactsRow.insertBefore(chip, addContactBtn);
  });
}

function openModal(idx) {
  editingContactIdx = idx;
  const contacts = loadContacts();
  if (idx !== null) {
    modalTitle.textContent = 'edit lamp';
    contactNameInput.value = contacts[idx].name;
    contactIdInput.value = contacts[idx].id;
    modalRemove.style.display = 'block';
  } else {
    modalTitle.textContent = 'add a lamp';
    contactNameInput.value = '';
    contactIdInput.value = '';
    modalRemove.style.display = 'none';
  }
  modalBackdrop.classList.add('open');
}
addContactBtn.onclick = () => openModal(null);
modalCancel.onclick = () => modalBackdrop.classList.remove('open');
modalBackdrop.onclick = (e) => { if (e.target === modalBackdrop) modalBackdrop.classList.remove('open'); };
modalSave.onclick = () => {
  const name = contactNameInput.value.trim();
  const id = contactIdInput.value.trim();
  if (!name || !id) { alert('Enter both a name and the lamp id'); return; }
  const contacts = loadContacts();
  if (editingContactIdx !== null) contacts[editingContactIdx] = { name, id };
  else { contacts.push({ name, id }); selectedContact = contacts.length - 1; }
  saveContacts(contacts);
  modalBackdrop.classList.remove('open');
  renderContacts();
  updateSendState();
};
modalRemove.onclick = () => {
  const contacts = loadContacts();
  contacts.splice(editingContactIdx, 1);
  saveContacts(contacts);
  selectedContact = null;
  modalBackdrop.classList.remove('open');
  renderContacts();
  updateSendState();
};

function updateSendState() { sendBtn.disabled = !(hasPhoto && selectedContact !== null); }

async function checkLastSeen(lampId) {
  lastSeen.textContent = 'checking…';
  try {
    const res = await fetch(`${WORKER_BASE_URL}/lamp/${lampId}/status`);
    if (!res.ok) throw new Error();
    const info = await res.json();
    if (info.lastUpload) {
      const mins = Math.round((Date.now() - info.lastUpload) / 60000);
      let human;
      if (mins < 1) human = 'just now';
      else if (mins < 60) human = `${mins}m ago`;
      else if (mins < 1440) human = `${Math.round(mins/60)}h ago`;
      else human = `${Math.round(mins/1440)}d ago`;
      lastSeen.textContent = `last light sent ${human}`;
    } else lastSeen.textContent = 'no uploads yet';
  } catch { lastSeen.textContent = ''; }
}

// ---------- orientation: which way the physical panel is mounted ----------
// This now sets the ACTUAL fixed output resolution (matching the real e-ink
// hardware), not just a starting box shape. The crop box can still be any
// shape — whatever region you select gets stretched/squashed to fit this
// fixed pixel count, same as it will be on the real panel.
function setOrientation(landscape) {
  if (landscape) {
    btnLandscape.classList.add('active'); btnPortrait.classList.remove('active');
    targetW = PANEL_W; targetH = PANEL_H; presetAspect = PANEL_W / PANEL_H;
  } else {
    btnPortrait.classList.add('active'); btnLandscape.classList.remove('active');
    targetW = PANEL_H; targetH = PANEL_W; presetAspect = PANEL_H / PANEL_W;
  }
  liveCanvas.width = targetW;
  liveCanvas.height = targetH;
  if (naturalW) { initBox(); render(); }
}
let presetAspect = PANEL_W / PANEL_H;
btnLandscape.onclick = () => setOrientation(true);
btnPortrait.onclick = () => setOrientation(false);

// ---------- photo load ----------
tapTarget.onclick = () => fileInput.click();
fileInput.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    naturalW = img.naturalWidth; naturalH = img.naturalHeight;
    sourceImg.src = img.src;
    sourceImg.style.display = 'block';
    emptyState.style.display = 'none';
    photoWrap.classList.add('has-photo');
    cropBox.style.display = 'block';
    cropHint.style.display = 'block';
    hasPhoto = true;
    requestAnimationFrame(() => {
      updateCoverFit();
      initBox();
      render();
      lastWrapW = photoWrap.clientWidth;
    });
    updateSendState();
  };
  img.src = URL.createObjectURL(file);
};

// the container has a FIXED height (30vh via CSS) and the photo displays via
// object-fit: contain — the whole photo is always visible, letterboxed with
// the dark background on whichever axis doesn't fill the container.
// These three values describe exactly how the browser is rendering that
// contain-fit, so we can map container coords <-> natural pixel coords.
let coverScale = 1, coverX0 = 0, coverY0 = 0;
function updateCoverFit() {
  const containerW = photoWrap.clientWidth;
  const containerH = photoWrap.clientHeight;
  coverScale = Math.min(containerW / naturalW, containerH / naturalH); // min = contain (was max = cover)
  coverX0 = (containerW - naturalW * coverScale) / 2;
  coverY0 = (containerH - naturalH * coverScale) / 2;
}

// bounds of the actual visible photo within the container (excludes letterbox bars)
function visibleImageBounds() {
  return {
    left: coverX0,
    top: coverY0,
    right: coverX0 + naturalW * coverScale,
    bottom: coverY0 + naturalH * coverScale
  };
}

function initBox() {
  const vis = visibleImageBounds();
  const visW = vis.right - vis.left, visH = vis.bottom - vis.top;
  const aspect = presetAspect;

  let boxW, boxH;
  if (visW / visH > aspect) {
    boxH = visH * 0.9;
    boxW = boxH * aspect;
  } else {
    boxW = visW * 0.9;
    boxH = boxW / aspect;
  }
  box.width = boxW;
  box.height = boxH;
  box.left = vis.left + (visW - boxW) / 2;
  box.top = vis.top + (visH - boxH) / 2;
  applyBoxStyle();
}

function applyBoxStyle() {
  cropBox.style.left = box.left + 'px';
  cropBox.style.top = box.top + 'px';
  cropBox.style.width = box.width + 'px';
  cropBox.style.height = box.height + 'px';
}

// ---------- drag to move box (single touch only) ----------
let dragState = null;
cropBox.addEventListener('touchstart', (e) => {
  if (e.target.classList.contains('handle')) return; // handled separately
  if (e.touches.length !== 1) return;
  e.preventDefault();
  const t = e.touches[0];
  dragState = { startX: t.clientX, startY: t.clientY, startLeft: box.left, startTop: box.top };
}, { passive: false });
cropBox.addEventListener('touchmove', (e) => {
  if (!dragState) return;
  e.preventDefault();
  const t = e.touches[0];
  const vis = visibleImageBounds();
  let newLeft = dragState.startLeft + (t.clientX - dragState.startX);
  let newTop = dragState.startTop + (t.clientY - dragState.startY);
  newLeft = Math.max(vis.left, Math.min(vis.right - box.width, newLeft));
  newTop = Math.max(vis.top, Math.min(vis.bottom - box.height, newTop));
  box.left = newLeft; box.top = newTop;
  applyBoxStyle();
  render();
}, { passive: false });
cropBox.addEventListener('touchend', () => { dragState = null; }, { passive: false });

// ---------- freeform resize from any of the 4 corners, independent width/height ----------
const MIN_BOX = 40; // minimum displayed size in CSS px
let cornerState = null;

document.querySelectorAll('.handle').forEach(handle => {
  const corner = handle.dataset.corner; // 'tl' | 'tr' | 'bl' | 'br'

  handle.addEventListener('touchstart', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const t = e.touches[0];
    // the point opposite this handle stays fixed while dragging
    const fixed = {
      x: corner.includes('l') ? box.left + box.width : box.left,
      y: corner.includes('t') ? box.top + box.height : box.top
    };
    const moving = {
      x: corner.includes('l') ? box.left : box.left + box.width,
      y: corner.includes('t') ? box.top : box.top + box.height
    };
    cornerState = { corner, fixed, startMoving: moving, startX: t.clientX, startY: t.clientY };
  }, { passive: false });

  handle.addEventListener('touchmove', (e) => {
    if (!cornerState || cornerState.corner !== corner) return;
    e.preventDefault();
    e.stopPropagation();
    const t = e.touches[0];
    const vis = visibleImageBounds();
    const { fixed, startMoving, startX, startY } = cornerState;

    let movingX = startMoving.x + (t.clientX - startX);
    let movingY = startMoving.y + (t.clientY - startY);
    movingX = Math.max(vis.left, Math.min(vis.right, movingX));
    movingY = Math.max(vis.top, Math.min(vis.bottom, movingY));

    // enforce a minimum box size, expanding outward from the fixed point if needed
    if (Math.abs(movingX - fixed.x) < MIN_BOX) {
      movingX = fixed.x + (movingX >= fixed.x ? MIN_BOX : -MIN_BOX);
    }
    if (Math.abs(movingY - fixed.y) < MIN_BOX) {
      movingY = fixed.y + (movingY >= fixed.y ? MIN_BOX : -MIN_BOX);
    }
    movingX = Math.max(vis.left, Math.min(vis.right, movingX));
    movingY = Math.max(vis.top, Math.min(vis.bottom, movingY));

    box.left = Math.min(fixed.x, movingX);
    box.top = Math.min(fixed.y, movingY);
    box.width = Math.abs(fixed.x - movingX);
    box.height = Math.abs(fixed.y - movingY);

    applyBoxStyle();
    render();
  }, { passive: false });

  handle.addEventListener('touchend', (e) => {
    e.stopPropagation();
    if (cornerState && cornerState.corner === corner) cornerState = null;
  }, { passive: false });
});

// mobile Safari fires 'resize' when the address bar collapses/expands on scroll —
// we must NOT reset the box in that case, only reclamp it if the wrap actually got narrower
let lastWrapW = 0;
window.addEventListener('resize', () => {
  if (!naturalW) return;
  const wrapW = photoWrap.clientWidth;
  if (lastWrapW && wrapW === lastWrapW) return; // width unchanged, likely just a toolbar show/hide — ignore
  lastWrapW = wrapW;
  updateCoverFit();
  const vis = visibleImageBounds();
  box.width = Math.min(box.width, vis.right - vis.left);
  box.height = Math.min(box.height, vis.bottom - vis.top);
  box.left = Math.max(vis.left, Math.min(box.left, vis.right - box.width));
  box.top = Math.max(vis.top, Math.min(box.top, vis.bottom - box.height));
  applyBoxStyle();
  render();
});

// ---------- live render: crop + postcard bar + grayscale + tone curve + dither ----------
function render() {
  if (!naturalW) return;

  // map crop box (container coordinates) back to natural image pixel coordinates
  // using the same cover-fit math the browser used to render the photo
  const sx = (box.left - coverX0) / coverScale;
  const sy = (box.top - coverY0) / coverScale;
  const sw = box.width / coverScale;
  const sh = box.height / coverScale;

  const W = targetW, H = targetH;
  lctx.clearRect(0,0,W,H);
  lctx.drawImage(sourceImg, sx, sy, sw, sh, 0, 0, W, H);

  // draw the postcard text directly onto the RGBA canvas, BEFORE we extract
  // grayscale — this means it rides through the exact same tone curve, dither
  // pattern, and invert as the photo itself, with no separate logic needed.
  // Single line only; the box hugs the actual text width instead of spanning
  // the full canvas, and squashes horizontally (via canvas's native maxWidth
  // behavior) rather than wrapping if the line runs long.
  const text = postcardText.trim();
  let textBarTop = null, textBarBottom = null; // used later to keep text unaffected by chromatic drift
  if (text) {
    const barH = H * 0.11;
    const barY = postcardPosition === 'top' ? 0 : H - barH;
    textBarTop = barY;
    textBarBottom = barY + barH;
    const fontSize = Math.max(9, Math.floor(barH * 0.55));
    const leftMargin = 0; // starts at the very edge, no padding
    const maxTextWidth = W; // can span the full canvas width if the text is long enough

    // font chosen via the circular dial next to the message input
    lctx.font = `${fontSize}px '${FONT_LIST[selectedFontIndex]}', Georgia, serif`;

    const naturalWidth = lctx.measureText(text).width;
    const boxWidth = Math.min(naturalWidth, maxTextWidth); // squashed width if it was too long, no extra padding

    lctx.save();

    // vertical gradient: fades in from the outer edge, plateaus at 0.8 opacity,
    // fades back out toward the inner edge — no hard top/bottom line, which
    // gives the dither pass a smooth transition to work with instead of a
    // single hard row boundary
    const grad = lctx.createLinearGradient(0, barY, 0, barY + barH);
    grad.addColorStop(0,    'rgba(190,190,190,0)');
    grad.addColorStop(0.25, 'rgba(190,190,190,0.8)');
    grad.addColorStop(0.75, 'rgba(190,190,190,0.8)');
    grad.addColorStop(1,    'rgba(190,190,190,0)');
    lctx.fillStyle = grad;
    lctx.fillRect(0, barY, boxWidth, barH);

    lctx.fillStyle = 'rgba(35,35,35,0.95)'; // near-black for legibility; inverts to light grey via the existing invert step
    lctx.textAlign = 'left';
    lctx.textBaseline = 'middle';
    lctx.fillText(text, leftMargin, barY + barH / 2, maxTextWidth);
    lctx.restore();
  }

  const imgData = lctx.getImageData(0,0,W,H);
  const data = imgData.data;
  const gray = new Float32Array(W*H);
  const fw = FILTER_STEPS[filterStepIndex];

  // chromatic drift: sample R and B from horizontally offset positions
  // before combining into grayscale — on contrast edges this creates ghostly
  // fringing, like a VHS tracking error, once it hits the dither pass
  const chromaShift = Math.round(chromaAmount * 4);
  function sampleChannel(x, y, channel) {
    x = Math.max(0, Math.min(W - 1, x));
    y = Math.max(0, Math.min(H - 1, y));
    return data[(y * W + x) * 4 + channel];
  }
  if (chromaShift > 0) {
    for (let y = 0; y < H; y++) {
      // rows inside the postcard text bar sample straight through, unshifted —
      // keeps the text itself crisp and unaffected by the chroma effect
      const inTextBar = textBarTop !== null && y >= textBarTop && y < textBarBottom;
      for (let x = 0; x < W; x++) {
        const idx = y * W + x;
        const rVal = sampleChannel(inTextBar ? x : x - chromaShift, y, 0);
        const gVal = sampleChannel(x, y, 1);
        const bVal = sampleChannel(inTextBar ? x : x + chromaShift, y, 2);
        gray[idx] = fw.r * rVal + fw.g * gVal + fw.b * bVal;
      }
    }
  } else {
    for (let i=0;i<W*H;i++){ gray[i]=fw.r*data[i*4]+fw.g*data[i*4+1]+fw.b*data[i*4+2]; }
  }

  // pre-dither texture effects: each overlays a pattern onto the luminance
  // data BEFORE quantizing. The periodic ones (grid/hatch/scan) interfere
  // with the dither pattern's own periodicity to create genuine moiré beats;
  // grain is random rather than periodic, breaking up flat gradients
  // organically instead of geometrically.
  if (gridAmount > 0 || hatchAmount > 0 || scanAmount > 0 || grainAmount > 0) {
    const AMPLITUDE = 55;
    const GRID_WAVELENGTH = 4;
    const HATCH_WAVELENGTH = 5;
    const SCAN_WAVELENGTH = 4;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const idx = y * W + x;
        if (gridAmount > 0) {
          const g = Math.sin(2 * Math.PI * x / GRID_WAVELENGTH) * Math.sin(2 * Math.PI * y / GRID_WAVELENGTH);
          gray[idx] += gridAmount * AMPLITUDE * g;
        }
        if (hatchAmount > 0) {
          const proj = (x + y) / Math.SQRT2; // 45° diagonal projection
          const h = Math.sin(2 * Math.PI * proj / HATCH_WAVELENGTH);
          gray[idx] += hatchAmount * AMPLITUDE * h;
        }
        if (scanAmount > 0) {
          const s = Math.sin(2 * Math.PI * y / SCAN_WAVELENGTH); // horizontal-only, no x term
          gray[idx] += scanAmount * AMPLITUDE * s;
        }
        if (grainAmount > 0) {
          gray[idx] += grainAmount * AMPLITUDE * (Math.random() * 2 - 1);
        }
        gray[idx] = Math.max(0, Math.min(255, gray[idx]));
      }
    }
  }

  // apply the current step's full tone curve — black/white point, then
  // shadow/highlight shaping, then contrast — before quantizing. This is what
  // gives finer variation than raw level count alone, same effect as adjusting
  // contrast/black point/shadows/highlights in Photos before uploading
  const cfg = STEPS[stepIndex];
  const range = Math.max(1, cfg.whitePoint - cfg.blackPoint);
  for (let i=0;i<W*H;i++){
    let t = (gray[i] - cfg.blackPoint) / range;
    t = Math.max(0, Math.min(1, t));

    // shadow/highlight shaping: crush shadow detail and roll off highlight
    // detail independently, applied on either side of the midpoint
    if (t < 0.5) {
      let tt = t / 0.5;
      tt = Math.pow(tt, cfg.shadowGamma);
      t = tt * 0.5;
    } else {
      let tt = (t - 0.5) / 0.5;
      tt = 1 - Math.pow(1 - tt, cfg.highlightGamma);
      t = 0.5 + tt * 0.5;
    }

    t = (t - 0.5) * cfg.contrast + 0.5;
    t = Math.max(0, Math.min(1, t));
    gray[i] = t * 255;
  }

  const levelCount = cfg.levels;
  const step = 255/(levelCount-1);
  function quantize(v){ v=Math.max(0,Math.min(255,v)); return Math.round(Math.round(v/step)*step); }

  // dither: pattern is user-selectable (Floyd–Steinberg / Atkinson / Ordered),
  // strength is baked into the step progression — lower strength = harder,
  // more graphic edges; full strength = smoothest photographic gradation
  const strength = cfg.ditherStrength;
  applyDither(gray, W, H, quantize, step, ditherPattern, strength);

  // invert swaps black<->white on the already-dithered result, so the pattern
  // itself is unchanged — just which physical e-ink state (black or white)
  // each dithered pixel maps to
  if (invert) {
    for (let i=0;i<W*H;i++){ gray[i] = 255 - gray[i]; }
  }

  for (let i=0;i<W*H;i++){ const v=Math.max(0,Math.min(255,gray[i])); data[i*4]=v;data[i*4+1]=v;data[i*4+2]=v;data[i*4+3]=255; }
  lctx.putImageData(imgData,0,0);
  liveCanvas._grayCache = gray;
}

// ---------- dither implementations ----------
const BAYER4 = [
  [0,8,2,10],
  [12,4,14,6],
  [3,11,1,9],
  [15,7,13,5]
];

function applyDither(gray, W, H, quantize, step, pattern, strength) {
  if (pattern === 'floyd') {
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const idx=y*W+x, old=gray[idx], nv=quantize(old); gray[idx]=nv;
      const err=(old-nv)*strength;
      if(x+1<W) gray[idx+1]+=err*7/16;
      if(y+1<H){ if(x-1>=0) gray[idx+W-1]+=err*3/16; gray[idx+W]+=err*5/16; if(x+1<W) gray[idx+W+1]+=err*1/16; }
    }
  } else if (pattern === 'atkinson') {
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const idx=y*W+x, old=gray[idx], nv=quantize(old); gray[idx]=nv;
      const err=(old-nv)/8*strength;
      if(x+1<W) gray[idx+1]+=err;
      if(x+2<W) gray[idx+2]+=err;
      if(y+1<H){ if(x-1>=0) gray[idx+W-1]+=err; gray[idx+W]+=err; if(x+1<W) gray[idx+W+1]+=err; }
      if(y+2<H) gray[idx+2*W]+=err;
    }
  } else { // 'ordered' — Bayer 4x4, no error diffusion, texture amplitude scaled by strength
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const idx=y*W+x;
      const offset = (BAYER4[y%4][x%4]/16 - 0.5) * step * strength;
      gray[idx] = quantize(gray[idx] + offset);
    }
  }
}

// ---------- scrub vertically on preview to adjust "look" (replaces slider) ----------
// Most affordable e-ink panels max out at 4 real gray levels — we can't add more
// physical shades, but a tone curve (contrast + black/white point) applied BEFORE
// dithering changes how a photo maps onto those levels, the same way editing
// contrast/black point in Photos before uploading changed your results. Combining
// both gives a finer, more varied progression from one gesture than levels alone.
//
// contrast: 1.0 = neutral, >1 = punchier, <1 = flatter/softer
// blackPoint/whitePoint: 0-255, pulls in the tonal range before mapping to levels
// shadowGamma/highlightGamma: >1 crushes shadows / rolls off highlights (punchier),
// 1.0 = neutral, tied to the same "punch" value as contrast so they move together
//
// Rather than hand-picked presets (which jumped abruptly), generate a continuous
// zigzag: all tone parameters ramp smoothly across each gray-level tier, and the
// ramp direction ALTERNATES per tier so the value at each tier boundary matches
// exactly. That isolates the one unavoidable jump — the level count itself
// changing — instead of stacking a tone-curve jump on top of it.
// non-uniform p sampling per tier — tier 0 (2 gray) gets extra density in the
// 80%-98% contrast range specifically, since that's the range you liked most;
// everything else stays evenly spaced
function tierPValues(tierIdx) {
  if (tierIdx === 0) {
    const denseEnd = 0.257; // p value where contrast ≈ 0.98 (98%)
    const denseCount = 20;
    const coarseCount = 8;
    const pts = [];
    for (let i = 0; i < denseCount; i++) pts.push((i / (denseCount - 1)) * denseEnd);
    for (let i = 1; i < coarseCount; i++) pts.push(denseEnd + (i / (coarseCount - 1)) * (1 - denseEnd));
    return pts;
  }
  const PER_TIER = 16;
  const pts = [];
  for (let j = 0; j < PER_TIER; j++) pts.push(j / (PER_TIER - 1));
  return pts;
}

function generateSteps() {
  const TIERS = [2, 3, 4]; // real gray levels available on the hardware
  const steps = [];
  TIERS.forEach((levelCount, tierIdx) => {
    const ascending = tierIdx % 2 === 0; // alternate direction so tier edges connect
    const pValues = tierPValues(tierIdx);
    pValues.forEach((rawP) => {
      const p = ascending ? rawP : 1 - rawP;
      const contrast = 0.8 + p * 0.7;       // 0.8 .. 1.5
      const blackPoint = Math.round(p * 50);
      const whitePoint = 255 - Math.round(p * 50);
      const shadowGamma = 1 + p * 0.7;      // 1.0 .. 1.7 — crushes shadow detail as p rises
      const highlightGamma = 1 + p * 0.7;   // 1.0 .. 1.7 — rolls off highlight detail as p rises
      const ditherStrength = 1 - p * 0.6;   // 1.0 .. 0.4 — punchier steps dither less (harder, more graphic edges)
      const pct = Math.round(contrast * 100);
      steps.push({ levels: levelCount, contrast, blackPoint, whitePoint, shadowGamma, highlightGamma, ditherStrength, label: `${levelCount} gray · ${pct}%` });
    });
  });
  return steps;
}
const STEPS = generateSteps();
// tier boundaries — used to map stepIndex to "how many gray-level tiers have
// been crossed", so the sine wave icon completes exactly 1 cycle per tier
// (2 gray, 3 gray, 4 gray), regardless of how many sub-steps live in each
const TIER_BOUNDARIES = (() => {
  const bounds = [0];
  let lastLevel = STEPS[0].levels;
  for (let i = 1; i < STEPS.length; i++) {
    if (STEPS[i].levels !== lastLevel) { bounds.push(i); lastLevel = STEPS[i].levels; }
  }
  bounds.push(STEPS.length);
  return bounds;
})();
function toneCycles(idx) {
  let t = 0;
  for (let i = 0; i < TIER_BOUNDARIES.length - 1; i++) {
    if (idx >= TIER_BOUNDARIES[i] && idx < TIER_BOUNDARIES[i + 1]) { t = i; break; }
  }
  const tierStart = TIER_BOUNDARIES[t], tierEnd = TIER_BOUNDARIES[t + 1] - 1;
  const localFrac = tierEnd > tierStart ? (idx - tierStart) / (tierEnd - tierStart) : 0;
  return t + localFrac; // 0 (start of 2-gray) .. 3 (end of 4-gray)
}
// default: first tier (2 gray), contrast closest to neutral (100%)
let stepIndex = STEPS.reduce((best, cur, idx) =>
  (cur.levels === 2 && Math.abs(cur.contrast - 1) < Math.abs(STEPS[best].contrast - 1)) ? idx : best, 0);

let invert = false; // false = black content on white e-ink, true = white content on black
let ditherPattern = 'floyd'; // 'floyd' | 'atkinson' | 'ordered' — cycled via the pattern button

// pre-grayscale channel weighting, like classic B&W film filters — a red
// filter lightens skin/darkens skies, etc. Tapping the preview cycles through
// this sequence: standard → red (light/medium/strong) → green (...) → blue
// (...) → back to standard. Each color gets 3 intensity sub-steps, blended
// between neutral and the full color weighting.
const FILTER_ANCHORS = [
  { name: 'standard', r: 0.299, g: 0.587, b: 0.114 },
  { name: 'red',      r: 0.7,   g: 0.2,   b: 0.1   },
  { name: 'green',    r: 0.1,   g: 0.7,   b: 0.2   },
  { name: 'blue',     r: 0.1,   g: 0.2,   b: 0.7   }
];
const NEUTRAL = FILTER_ANCHORS[0];
// tap cycles through exactly these 4 states, each at a fixed "medium" strength
// blend between neutral and the full color weighting — no light/strong sub-steps
function generateFilterSteps() {
  const MEDIUM_T = 2 / 3;
  return FILTER_ANCHORS.map((color, i) => {
    if (i === 0) return { r: NEUTRAL.r, g: NEUTRAL.g, b: NEUTRAL.b, label: 'standard' };
    return {
      r: NEUTRAL.r + (color.r - NEUTRAL.r) * MEDIUM_T,
      g: NEUTRAL.g + (color.g - NEUTRAL.g) * MEDIUM_T,
      b: NEUTRAL.b + (color.b - NEUTRAL.b) * MEDIUM_T,
      label: color.name
    };
  });
}
const FILTER_STEPS = generateFilterSteps(); // [standard, red, green, blue]
let filterStepIndex = 0; // starts at 'standard'
let postcardText = '';
let postcardPosition = 'bottom'; // 'top' | 'bottom'

// order matches the 3 dots around the dial (dot0 at top, clockwise)
const FONT_LIST = ['GeistPixel', 'MW', 'NB'];
let selectedFontIndex = 0; // GeistPixel, the default
let gridAmount = 0;    // 0..1 — 2D periodic grid, interferes with dither patterns
let hatchAmount = 0;   // 0..1 — diagonal single-axis wave, crosshatch/engraving feel
let scanAmount = 0;    // 0..1 — horizontal-only wave, CRT/VHS scanline feel
let grainAmount = 0;   // 0..1 — random noise, breaks up flat gradients organically
let chromaAmount = 0;  // 0..1 — R/G/B channel offset before grayscale, ghostly fringing

function updateFontDots() {
  FONT_DOTS.forEach((el, i) => {
    if (i === selectedFontIndex) {
      el.setAttribute('fill', 'var(--ember)');
      el.setAttribute('opacity', '1');
      el.setAttribute('r', '2');
    } else {
      el.setAttribute('fill', 'var(--cream-dim)');
      el.setAttribute('opacity', '0.4');
      el.setAttribute('r', '1.6');
    }
  });
}

// dial interaction: drag (or just tap) anywhere around the button and the
// angle from center picks the nearest of the 3 dots — works as a genuine
// rotary drag or a single tap on the direction you want, same handler either way
function angleToFontIndex(dx, dy) {
  const angleDeg = Math.atan2(dy, dx) * 180 / Math.PI; // -180..180, 0=right, clockwise positive (SVG y-down)
  let idx = Math.round((angleDeg + 90) / 120); // dot0 sits at the top (-90°)
  idx = ((idx % 3) + 3) % 3;
  return idx;
}
function updateFontFromTouch(touch) {
  const rect = fontDialBtn.getBoundingClientRect();
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  const idx = angleToFontIndex(touch.clientX - cx, touch.clientY - cy);
  if (idx !== selectedFontIndex) {
    selectedFontIndex = idx;
    updateFontDots();
    if (naturalW) render();
  }
}
let fontDragActive = false;
fontDialBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  fontDragActive = true;
  updateFontFromTouch(e.touches[0]);
}, { passive: false });
fontDialBtn.addEventListener('touchmove', (e) => {
  if (!fontDragActive) return;
  e.preventDefault();
  updateFontFromTouch(e.touches[0]);
}, { passive: false });
fontDialBtn.addEventListener('touchend', () => { fontDragActive = false; });
updateFontDots(); // sync visuals to the default selection on load


// 4 pip dots. The first is always solid (the baseline starting state); the
// remaining 3 fill in — one per gray-level tier (2/3/4 gray) — as you scrub.
// Each fills smoothly (not a hard snap) proportional to progress through its
// tier, and un-fills again if you drag back down.
const TONE_PIPS = [tonePip0, tonePip1, tonePip2, tonePip3];
function setToneRings(cyclesValue) {
  TONE_PIPS.forEach((el, i) => {
    if (i === 0) { el.style.opacity = '1'; return; } // baseline pip, always on
    const tier = i - 1;
    const growFrac = Math.max(0, Math.min(1, cyclesValue - tier));
    el.style.opacity = `${0.15 + growFrac * 0.85}`;
  });
}

let scrubState = null;
let scrubPillTimeout = null;
let hasEverCycledFilter = false; // the very first tap still cycles immediately, as before
previewWrap.addEventListener('touchstart', (e) => {
  if (!naturalW || e.touches.length !== 1) return;
  const t = e.touches[0];
  scrubState = {
    startX: t.clientX, startY: t.clientY,
    startIdx: stepIndex, maxMove: 0,
    pillWasVisibleBeforeThisTouch: scrubPill.classList.contains('visible')
  };
  scrubPill.classList.add('visible');
  clearTimeout(scrubPillTimeout);
  updateIndicators();
}, { passive: true });
previewWrap.addEventListener('touchmove', (e) => {
  if (!scrubState) return;
  const t = e.touches[0];

  // vertical drag: tone steps (continuous — contrast/black-point/shadow/highlight/dither)
  const dy = t.clientY - scrubState.startY;
  const dx = t.clientX - scrubState.startX;
  scrubState.maxMove = Math.max(scrubState.maxMove, Math.abs(dy), Math.abs(dx));

  const stepsMoved = Math.round(-dy / 16);
  const newIdx = Math.max(0, Math.min(STEPS.length - 1, scrubState.startIdx + stepsMoved));
  if (newIdx !== stepIndex) {
    stepIndex = newIdx;
    updateIndicators();
    render();
  }
}, { passive: true });
previewWrap.addEventListener('touchend', () => {
  // a tap (little to no movement) potentially cycles the color filter.
  // The very first tap ever cycles right away. After that: if the pill had
  // already faded out, a tap just wakes it back up so you can see the
  // current filter — it takes a second tap (while it's still showing) to
  // actually commit the change to the next filter.
  if (scrubState && scrubState.maxMove < 10) {
    const shouldCycle = !hasEverCycledFilter || scrubState.pillWasVisibleBeforeThisTouch;
    if (shouldCycle) {
      filterStepIndex = (filterStepIndex + 1) % FILTER_STEPS.length;
      const anchorName = FILTER_STEPS[filterStepIndex].label;
      filterButtons.forEach(b => b.classList.toggle('active', b.dataset.filter === anchorName));
      hasEverCycledFilter = true;
      updateIndicators();
      render();
    }
  }
  scrubState = null;
  scrubPillTimeout = setTimeout(() => scrubPill.classList.remove('visible'), 2100);
});

const FILTER_LINE_COLORS = { red: '#e2584a', green: '#5ec48f', blue: '#5b9fe0' };
function updateIndicators() {
  // tone bars: 4 stacked bars, bottom one always on, the rest fill upward
  // one per gray-level tier as you scrub
  const cycles = toneCycles(stepIndex);
  setToneRings(cycles);

  // filter fill-line: sits flush against the bar stack, its height always
  // matches the current tone fill level (same 1-of-4 baseline + progressive
  // fill), color swaps per active filter, hidden entirely for standard
  const STACK_HEIGHT = 23;
  const fillFrac = Math.min(1, (1 + cycles) / 4);
  const lineHeight = STACK_HEIGHT * fillFrac;
  const colorName = FILTER_STEPS[filterStepIndex].label; // 'standard' | 'red' | 'green' | 'blue'
  if (colorName === 'standard') {
    filterFillLine.setAttribute('opacity', '0');
  } else {
    filterFillLine.setAttribute('fill', FILTER_LINE_COLORS[colorName]);
    filterFillLine.setAttribute('height', `${lineHeight}`);
    filterFillLine.setAttribute('y', `${STACK_HEIGHT - lineHeight}`);
    filterFillLine.setAttribute('opacity', '1');
  }
}

invertBtn.onclick = () => {
  invert = !invert;
  invertBtn.classList.toggle('active', invert);
  if (naturalW) render();
};

// cycles through the three dither patterns on tap
const PATTERN_LABELS = { floyd: 'floyd–steinberg', atkinson: 'atkinson', ordered: 'ordered' };
const PATTERN_ORDER = ['floyd', 'atkinson', 'ordered'];
patternBtn.onclick = () => {
  const i = PATTERN_ORDER.indexOf(ditherPattern);
  ditherPattern = PATTERN_ORDER[(i + 1) % PATTERN_ORDER.length];
  patternBtn.textContent = PATTERN_LABELS[ditherPattern];
  if (naturalW) render();
};

const EFFECT_SLIDERS = [
  { id: 'gridSlider', setter: v => gridAmount = v },
  { id: 'hatchSlider', setter: v => hatchAmount = v },
  { id: 'scanSlider', setter: v => scanAmount = v },
  { id: 'grainSlider', setter: v => grainAmount = v },
  { id: 'chromaSlider', setter: v => chromaAmount = v }
];
EFFECT_SLIDERS.forEach(({ id, setter }) => {
  const el = document.getElementById(id);
  el.oninput = () => {
    setter(el.value / 100);
    if (naturalW) render();
  };
});

// color filter buttons — pre-grayscale channel weighting, like classic B&W film filters
filterButtons.forEach(btn => {
  btn.onclick = () => {
    filterStepIndex = FILTER_ANCHORS.findIndex(a => a.name === btn.dataset.filter);
    filterButtons.forEach(b => b.classList.toggle('active', b === btn));
    updateIndicators();
    scrubPill.classList.add('visible');
    clearTimeout(scrubPillTimeout);
    scrubPillTimeout = setTimeout(() => scrubPill.classList.remove('visible'), 2100);
    if (naturalW) render();
  };
});

// postcard text — rendered live as you type, baked into the same canvas
// pipeline so it inherits tone curve, dither pattern, and invert automatically
postcardInput.oninput = () => {
  postcardText = postcardInput.value;
  if (naturalW) render();
};
// Safari scrolls the focused input into view near the top of the visible
// area above the keyboard, which pushes the preview out of frame. Let it do
// its thing, then gently correct so the input sits lower and the preview
// stays visible above it.
postcardInput.addEventListener('focus', () => {
  setTimeout(() => {
    const rect = postcardInput.getBoundingClientRect();
    const desiredTop = window.innerHeight * 0.35;
    if (rect.top > desiredTop) return; // already fine, don't fight it unnecessarily
    window.scrollBy({ top: rect.top - desiredTop, behavior: 'smooth' });
  }, 300);
});
postcardPosBtn.onclick = () => {
  postcardPosition = postcardPosition === 'bottom' ? 'top' : 'bottom';
  postcardPosIcon.setAttribute('y', postcardPosition === 'bottom' ? '15' : '3');
  if (naturalW) render();
};

// ---------- crc32 + PNG chunk embed ----------
const crcTable = (() => { const t=[]; for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++){c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);}t[n]=c;} return t; })();
function crc32(bytes){ let c=0xFFFFFFFF; for(let i=0;i<bytes.length;i++){c=crcTable[(c^bytes[i])&0xFF]^(c>>>8);} return (c^0xFFFFFFFF)>>>0; }
function u32be(n){ return new Uint8Array([(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255]); }

async function buildChunkedPNG() {
  const W = targetW, H = targetH;
  const gray = liveCanvas._grayCache;
  const bytesPerRow = Math.ceil(W/8);
  const packed = new Uint8Array(bytesPerRow*H);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if (gray[y*W+x] > 127) packed[y*bytesPerRow+(x>>3)] |= (0x80 >> (x&7));
  }
  const header = new Uint8Array([(W>>8)&255,W&255,(H>>8)&255,H&255]);
  const chunkData = new Uint8Array(header.length+packed.length);
  chunkData.set(header,0); chunkData.set(packed,header.length);

  const blob = await new Promise(res => liveCanvas.toBlob(res,'image/png'));
  const pngBytes = new Uint8Array(await blob.arrayBuffer());
  let offset=8, iendOffset=-1;
  while(offset<pngBytes.length){
    const len=(pngBytes[offset]<<24|pngBytes[offset+1]<<16|pngBytes[offset+2]<<8|pngBytes[offset+3])>>>0;
    const type=String.fromCharCode(pngBytes[offset+4],pngBytes[offset+5],pngBytes[offset+6],pngBytes[offset+7]);
    if(type==='IEND'){ iendOffset=offset; break; }
    offset += 8+len+4;
  }
  const typeBytes = new Uint8Array([CHUNK_TYPE.charCodeAt(0),CHUNK_TYPE.charCodeAt(1),CHUNK_TYPE.charCodeAt(2),CHUNK_TYPE.charCodeAt(3)]);
  const crcInput = new Uint8Array(typeBytes.length+chunkData.length);
  crcInput.set(typeBytes,0); crcInput.set(chunkData,typeBytes.length);
  const crc = crc32(crcInput);
  const newChunk = new Uint8Array(4+4+chunkData.length+4);
  newChunk.set(u32be(chunkData.length),0);
  newChunk.set(typeBytes,4);
  newChunk.set(chunkData,8);
  newChunk.set(u32be(crc),8+chunkData.length);

  const finalBytes = new Uint8Array(pngBytes.length+newChunk.length);
  finalBytes.set(pngBytes.slice(0,iendOffset),0);
  finalBytes.set(newChunk, iendOffset);
  finalBytes.set(pngBytes.slice(iendOffset), iendOffset+newChunk.length);
  return new Blob([finalBytes], { type:'image/png' });
}

sendBtn.onclick = async () => {
  if (sendBtn.disabled) return;
  const contacts = loadContacts();
  const target = contacts[selectedContact];
  sendStatus.className = 'send-status';
  sendStatus.textContent = 'sending…';
  sendBtn.disabled = true;
  try {
    const blob = await buildChunkedPNG();
    const res = await fetch(`${WORKER_BASE_URL}/lamp/${target.id}/upload`, {
      method: 'POST', headers: { 'Content-Type': 'image/png' }, body: blob
    });
    if (!res.ok) throw new Error('Upload failed');
    sendStatus.textContent = `sent to ${target.name}`;
    sendStatus.classList.add('success');
    checkLastSeen(target.id);
  } catch (err) {
    sendStatus.textContent = 'could not send — check connection';
    sendStatus.classList.add('fail');
  }
  sendBtn.disabled = false;
};

// prevent Safari page-level pinch/zoom as a safety net (crop box uses single-touch drags only)
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('gesturechange', (e) => e.preventDefault());
document.addEventListener('gestureend', (e) => e.preventDefault());

renderContacts();
liveCanvas.width = targetW; liveCanvas.height = targetH;
updateIndicators(); // sync the ring indicators to the default state

// canvas text doesn't auto-refresh when web fonts finish loading, so once
// they're all ready, force a re-render to pick up the real typefaces
// instead of whatever fallback was showing during the brief load window
document.fonts.ready.then(() => { if (naturalW) render(); });

</script>
