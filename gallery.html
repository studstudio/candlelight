<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>candlelight — gallery</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.4.0/ol.css">
<style>
  :root {
    --bg: #15100a;
    --panel: #1d1610;
    --line: rgba(240, 224, 190, 0.12);
    --ember: #e8823c;
    --ember-dim: rgba(232, 130, 60, 0.55);
    --cream: #f2e9d8;
    --cream-dim: rgba(242, 233, 216, 0.55);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; height: 100dvh; margin: 0; background: var(--bg); color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 6px; flex: 0 0 auto; background: var(--bg); z-index: 2;
  }
  h1 { font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; margin: 0; color: var(--ember); font-weight: 700; }
  #status { font-size: 11px; color: var(--cream-dim); }
  #status.live::before { content: '● '; color: var(--ember); }
  #status.error { color: #e88a6c; }
  main {
    position: relative; flex: 1 1 auto; min-height: 0;
    background: radial-gradient(circle at center, #f1e6cf 0%, #ddcda3 55%, #c3ac81 100%);
  }
  #map { position: absolute; inset: 0; }
  #tooltip {
    position: absolute; pointer-events: none; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font-size: 12px; line-height: 1.5; color: var(--cream); display: none;
    max-width: 220px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); z-index: 5;
  }
  #tooltip b { color: var(--ember); }
  #legend {
    position: absolute; left: 14px; bottom: 14px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    font-size: 11px; color: var(--cream-dim); display: flex; flex-direction: column; gap: 5px; z-index: 3;
  }
  #legend .row { display: flex; align-items: center; gap: 7px; }
  #legend .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  #count {
    position: absolute; right: 14px; bottom: 14px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
    font-size: 11px; color: var(--cream-dim); text-align: right; z-index: 3;
  }
  #count b { color: var(--cream); font-size: 16px; display: block; }
  #resetBtn {
    position: absolute; right: 14px; top: 14px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px;
    font-size: 11px; color: var(--cream-dim); z-index: 3;
  }
  #empty {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 6px; color: #3a2c1c; font-size: 13px; text-align: center; padding: 20px;
    pointer-events: none; z-index: 2;
  }
  /* data attribution (required by the tile providers' terms) — kept small,
     centered at the bottom so it doesn't collide with the legend/count */
  .ol-attribution {
    right: auto !important; left: 50% !important; transform: translateX(-50%);
    bottom: 14px !important; max-width: 40%;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>candlelight — gallery</h1>
    <span id="status">connecting…</span>
  </header>
  <main>
    <div id="map"></div>
    <button id="resetBtn">reset view</button>
    <div id="tooltip"></div>
    <div id="legend">
      <div class="row"><span class="dot" style="background:var(--ember)"></span> sent</div>
      <div class="row"><span class="dot" style="background:#1d1610;border:1.5px solid var(--cream)"></span> received</div>
      <div class="row"><span class="dot" style="background:var(--ember-dim)"></span> in flight</div>
    </div>
    <div id="count"><b id="countNum">0</b>lights shared</div>
    <div id="empty">
      <div>no lights shared yet</div>
      <div style="font-size:11px;opacity:0.7">send one from the app, or seed test data via the Worker</div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/proj4@2.15.0/dist/proj4.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ol@10.4.0/dist/ol.js"></script>
<script>
// ---- config ----
const WORKER_BASE_URL = "https://candlelight.daniloinfinite.workers.dev"; // keep in sync with index.html
const POLL_MS = 8000;

const statusEl = document.getElementById('status');
const countEl = document.getElementById('countNum');
const emptyEl = document.getElementById('empty');
const tooltipEl = document.getElementById('tooltip');
const resetBtn = document.getElementById('resetBtn');
const mapEl = document.getElementById('map');

// ============================================================
// PROJECTION: azimuthal equidistant, centered on the geographic center of
// the continental US (near Lebanon, Kansas). Defined via proj4 and
// registered with OpenLayers, which then reprojects standard Web Mercator
// map tiles into it live, tile by tile, at whatever zoom level is on
// screen — that's what keeps it sharp when zooming in, unlike a single
// pre-downloaded world image.
// ============================================================
proj4.defs('US-AEQD', '+proj=aeqd +lat_0=39.83 +lon_0=-98.58 +x_0=0 +y_0=0 +datum=WGS84 +units=m +no_defs');
if (ol.proj.proj4 && ol.proj.proj4.register) {
  ol.proj.proj4.register(proj4);
} else {
  console.error('GALLERY: ol.proj.proj4.register not found — projection cannot be registered');
}
const R = Math.PI * 6378137; // max distance from center (to the antipode), meters
const aeqd = ol.proj.get('US-AEQD');
aeqd.setExtent([-R, -R, R, R]);

// ============================================================
// BASEMAP LAYERS
// 1. Real satellite color (actual observed greenery, deserts, ice) —
//    EOX Sentinel-2 Cloudless, a cloud-free mosaic of the whole Earth.
// 2. Shaded relief — Esri World Hillshade, blended with "multiply" on top
//    of the satellite layer, the same technique print atlases use to add
//    mountain/valley relief over color.
// Both are Web Mercator tile sets; OpenLayers reprojects them on the fly.
// One known limitation: Web Mercator tiles stop at ~85° N/S, so the very
// center of Antarctica and the North Pole ice cap have no imagery.
//
// Licensing note: EOX Sentinel-2 Cloudless 2024 is CC BY-NC-SA 4.0 (free
// for non-commercial use, needs a commercial license from EOX if sold);
// Esri basemaps have their own terms. Fine for development/personal use —
// worth revisiting before shipping candlelight commercially.
// ============================================================
let tileErrors = 0;
function watchTiles(source, label) {
  source.on('tileloaderror', () => {
    tileErrors++;
    if (tileErrors === 1 || tileErrors % 50 === 0) console.warn('GALLERY: tile load errors from', label, '(total', tileErrors + ')');
  });
}

const satelliteSource = new ol.source.XYZ({
  url: 'https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2024_3857/default/g/{z}/{y}/{x}.jpg',
  maxZoom: 15,
  attributions: 'Sentinel-2 cloudless by <a href="https://s2maps.eu" target="_blank">EOX IT Services GmbH</a> (contains modified Copernicus Sentinel data 2024)',
});
watchTiles(satelliteSource, 'satellite');

const hillshadeSource = new ol.source.XYZ({
  url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}',
  maxZoom: 16,
  attributions: 'Hillshade © Esri',
});
watchTiles(hillshadeSource, 'hillshade');

const satelliteLayer = new ol.layer.Tile({ source: satelliteSource });
const hillshadeLayer = new ol.layer.Tile({ source: hillshadeSource });
// multiply blend: white flat areas leave the satellite color untouched,
// shaded slopes darken it — OpenLayers' own documented blend-mode pattern
hillshadeLayer.on('prerender', (e) => { e.context.globalCompositeOperation = 'multiply'; });
hillshadeLayer.on('postrender', (e) => { e.context.globalCompositeOperation = 'source-over'; });

// ============================================================
// EVENTS LAYER: send points, receive points, and great-circle travel arcs
// ============================================================
const eventSource = new ol.source.Vector();
let events = [];

function eventStyle(feature) {
  const kind = feature.get('kind');
  if (kind === 'arc') {
    return new ol.style.Style({ stroke: new ol.style.Stroke({ color: 'rgba(232,130,60,0.85)', width: 2 }) });
  }
  if (kind === 'sent') {
    const inFlight = feature.get('inFlight');
    const pulse = inFlight ? 0.5 + 0.5 * Math.sin(Date.now() / 400) : 1;
    return new ol.style.Style({
      image: new ol.style.Circle({
        radius: inFlight ? 6 : 5,
        fill: new ol.style.Fill({ color: inFlight ? `rgba(232,130,60,${0.4 + 0.5 * pulse})` : '#e8823c' }),
        stroke: new ol.style.Stroke({ color: '#1d1610', width: 1.5 }),
      }),
    });
  }
  return new ol.style.Style({
    image: new ol.style.Circle({
      radius: 5,
      fill: new ol.style.Fill({ color: '#1d1610' }),
      stroke: new ol.style.Stroke({ color: '#f2e9d8', width: 1.5 }),
    }),
  });
}
const eventLayer = new ol.layer.Vector({
  source: eventSource,
  style: eventStyle,
  updateWhileAnimating: true,
  updateWhileInteracting: true,
});

// great-circle path between two [lon, lat] points (spherical slerp), so
// arcs follow the true shortest route and bend correctly in the projection
function greatCircle(a, b, n = 64) {
  const d2r = Math.PI / 180;
  const vec = ([lon, lat]) => [Math.cos(lat * d2r) * Math.cos(lon * d2r), Math.cos(lat * d2r) * Math.sin(lon * d2r), Math.sin(lat * d2r)];
  const A = vec(a), B = vec(b);
  const dot = Math.max(-1, Math.min(1, A[0] * B[0] + A[1] * B[1] + A[2] * B[2]));
  const w = Math.acos(dot);
  if (w < 1e-9) return [a, b];
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const s1 = Math.sin((1 - t) * w) / Math.sin(w), s2 = Math.sin(t * w) / Math.sin(w);
    const x = s1 * A[0] + s2 * B[0], y = s1 * A[1] + s2 * B[1], z = s1 * A[2] + s2 * B[2];
    pts.push([Math.atan2(y, x) / d2r, Math.atan2(z, Math.hypot(x, y)) / d2r]);
  }
  return pts;
}

function lonLatOf(geo) { return geo && geo.lat != null && geo.lon != null ? [geo.lon, geo.lat] : null; }
function toMap(lonlat) { return ol.proj.fromLonLat(lonlat, 'US-AEQD'); }

function rebuildEventFeatures() {
  eventSource.clear();
  const features = [];
  for (const ev of events) {
    const from = lonLatOf(ev.sentGeo);
    const to = lonLatOf(ev.downloadGeo);
    if (from && to) {
      features.push(new ol.Feature({ kind: 'arc', ev, geometry: new ol.geom.LineString(greatCircle(from, to).map(toMap)) }));
    }
    if (to) features.push(new ol.Feature({ kind: 'received', ev, geo: ev.downloadGeo, geometry: new ol.geom.Point(toMap(to)) }));
    if (from) features.push(new ol.Feature({ kind: 'sent', ev, geo: ev.sentGeo, inFlight: !ev.downloadedAt, geometry: new ol.geom.Point(toMap(from)) }));
  }
  eventSource.addFeatures(features);
}

// ============================================================
// MAP + VIEW
// ============================================================
const rect = mapEl.getBoundingClientRect();
const fitResolution = (2 * R) / (Math.max(1, Math.min(rect.width, rect.height)) * 0.98); // whole disc fits on load

const view = new ol.View({
  projection: 'US-AEQD',
  center: [0, 0],
  resolution: fitResolution,
  maxResolution: fitResolution * 4, // allows zooming out to 0.25x of the fit view
  minResolution: 8,                 // ~street-level cap; source tiles run out past this anyway
  extent: [-R, -R, R, R],
  constrainOnlyCenter: true,
  constrainRotation: false,         // no snapping back to north while spinning
});

const map = new ol.Map({
  target: mapEl,
  layers: [satelliteLayer, hillshadeLayer, eventLayer],
  view,
  controls: [new ol.control.Attribution({ collapsible: true })],
});

// built-in two-finger/alt-shift rotation is replaced by the custom spin
// below (faster, reversed direction, with momentum), so remove the defaults
map.getInteractions().getArray().slice().forEach((i) => {
  if (i instanceof ol.interaction.PinchRotate || i instanceof ol.interaction.DragRotate) map.removeInteraction(i);
});

resetBtn.onclick = () => {
  spinVelocity = 0;
  view.animate({ center: [0, 0], resolution: fitResolution, rotation: 0, duration: 400 });
};

// ============================================================
// TWO-FINGER SPIN with momentum — same feel as before: 2x finger speed,
// reversed direction, flick to keep it spinning, friction decay.
// Reads raw touch events in the capture phase, alongside OpenLayers'
// own pinch-zoom (which keeps handling zoom from the same two fingers).
// ============================================================
const SPIN_MULT = -2;
const MOMENTUM_MULT = 1.5;
const FRICTION = 0.976;
let twist = null;
let spinVelocity = 0; // degrees per frame

function touchAngle(t) { return Math.atan2(t[1].clientY - t[0].clientY, t[1].clientX - t[0].clientX) * 180 / Math.PI; }
function touchMidCoordinate(t) {
  const r = map.getViewport().getBoundingClientRect();
  const px = [((t[0].clientX + t[1].clientX) / 2) - r.left, ((t[0].clientY + t[1].clientY) / 2) - r.top];
  return map.getCoordinateFromPixel(px);
}
const vp = map.getViewport();
vp.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    twist = { prevAngle: touchAngle(e.touches), lastTime: performance.now() };
    spinVelocity = 0;
  }
}, { passive: true, capture: true });
vp.addEventListener('touchmove', (e) => {
  if (e.touches.length !== 2 || !twist) return;
  const angle = touchAngle(e.touches);
  let delta = angle - twist.prevAngle;
  if (delta > 180) delta -= 360;
  if (delta < -180) delta += 360;
  const now = performance.now();
  const dt = Math.max(now - twist.lastTime, 1);
  spinVelocity = (delta / dt) * 16 * SPIN_MULT * MOMENTUM_MULT;
  view.adjustRotation(delta * SPIN_MULT * Math.PI / 180, touchMidCoordinate(e.touches));
  twist.prevAngle = angle;
  twist.lastTime = now;
}, { passive: true, capture: true });
const endTwist = (e) => { if (e.touches.length < 2) twist = null; };
vp.addEventListener('touchend', endTwist, { passive: true, capture: true });
vp.addEventListener('touchcancel', endTwist, { passive: true, capture: true });

// ============================================================
// TOOLTIPS — hover on desktop, tap on touch
// ============================================================
function showTooltipAt(pixel) {
  const feature = map.forEachFeatureAtPixel(pixel, (f) => (f.get('kind') !== 'arc' ? f : undefined), { hitTolerance: 10 });
  if (!feature) { tooltipEl.style.display = 'none'; return; }
  const ev = feature.get('ev'), geo = feature.get('geo'), kind = feature.get('kind');
  const place = [geo.city, geo.region, geo.country].filter(Boolean).join(', ') || 'unknown location';
  let html = `<b>${kind === 'sent' ? 'sent from' : 'received in'}</b> ${place}`;
  if (ev.deliveryMs != null) {
    const secs = Math.round(ev.deliveryMs / 1000);
    html += `<br>delivered in ${secs < 60 ? secs + 's' : Math.round(secs / 60) + 'm'}`;
  } else {
    html += `<br><span style="color:var(--ember)">in flight…</span>`;
  }
  tooltipEl.innerHTML = html;
  tooltipEl.style.display = 'block';
  const w = mapEl.clientWidth;
  tooltipEl.style.left = Math.min(pixel[0] + 14, w - 230) + 'px';
  tooltipEl.style.top = Math.max(pixel[1] - 10, 4) + 'px';
}
map.on('pointermove', (e) => { if (!e.dragging) showTooltipAt(e.pixel); });
map.on('singleclick', (e) => showTooltipAt(e.pixel));
mapEl.addEventListener('mouseleave', () => { tooltipEl.style.display = 'none'; });

// ============================================================
// POLLING
// ============================================================
async function poll() {
  try {
    const res = await fetch(`${WORKER_BASE_URL}/gallery/events?limit=200`);
    if (!res.ok) {
      statusEl.textContent = `worker returned ${res.status} — check it's deployed`;
      statusEl.classList.add('error'); statusEl.classList.remove('live');
      return;
    }
    const data = await res.json();
    events = data.events || [];
    rebuildEventFeatures();
    countEl.textContent = events.length;
    emptyEl.style.display = events.length === 0 ? 'flex' : 'none';
    statusEl.textContent = 'live';
    statusEl.classList.add('live'); statusEl.classList.remove('error');
  } catch (err) {
    console.error('gallery: poll failed', err);
    statusEl.textContent = 'network error — retrying… (see console for detail)';
    statusEl.classList.add('error'); statusEl.classList.remove('live');
  }
}

// ============================================================
// ANIMATION LOOP — spin momentum + in-flight pulse
// ============================================================
function tick() {
  if (!twist && Math.abs(spinVelocity) > 0.01) {
    view.adjustRotation(spinVelocity * Math.PI / 180);
    spinVelocity *= FRICTION;
  }
  if (events.some((ev) => !ev.downloadedAt)) eventLayer.changed(); // re-style for the pulse
  requestAnimationFrame(tick);
}

window.addEventListener('resize', () => map.updateSize());
poll();
setInterval(poll, POLL_MS);
tick();
</script>
</body>
</html>
